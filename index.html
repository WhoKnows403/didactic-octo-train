<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تحلیل شخصیت MBTI</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@200;300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 🎨 Premium Zen Minimalist Palette - Enhanced */
            --bg-dark: #1a1c1d;
            --bg-center: #242728;
            --text-ivory: #FDFBF7;
            --text-muted: #9a958d;
            --accent-sage: #9DB39B;
            --accent-glow: rgba(157, 179, 155, 0.4);
            --line-color: rgba(255, 255, 255, 0.1);
            --gray-dark: #121415;
            --gray-light: #2d3133;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

        body, html {
            font-family: 'Vazirmatn', sans-serif;
            background: var(--bg-dark);
            color: var(--text-ivory);
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            position: fixed;
            user-select: none;
        }

        /* 🌟 Ethereal Breathing Background */

        .mesh-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden; z-index: 1; pointer-events: none;
            background: var(--bg-dark);
            filter: blur(80px);
            -webkit-filter: blur(80px);
        }

        .blob {
            position: absolute; border-radius: 50%;
            animation: drift 15s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
            transition: background 1.5s ease;
        }

        .blob-1 { width: 350px; height: 350px; background: var(--blob-1); top: -10%; left: -10%; animation-delay: 0s; }
        .blob-2 { width: 400px; height: 400px; background: var(--blob-2); bottom: -20%; right: -10%; animation-delay: -5s; }
        .blob-3 { width: 300px; height: 300px; background: var(--blob-3); top: 40%; left: 40%; animation-delay: -10s; }

        @keyframes drift {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(15vw, 10vh) scale(1.1); }
            66% { transform: translate(-10vw, 20vh) scale(0.9); }
            100% { transform: translate(5vw, -10vh) scale(1.05); }
        }

        /* 🚀 Screens */
        #access-denied {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 500; display: none;
            flex-direction: column; align-items: center; justify-content: center;
            padding: 30px; text-align: center; background: var(--bg-dark);
        }

        #intro-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 600; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            padding: 30px; text-align: center;
            background: radial-gradient(circle at center, var(--bg-center) 0%, var(--bg-dark) 100%);
        }

        /* Mind Ripple Animation for Intro */
        .mind-ripple {
            position: relative; width: 60px; height: 60px; margin-bottom: 30px;
        }
        .mind-ripple::before, .mind-ripple::after {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 50%; border: 2px solid var(--accent-sage);
            animation: ripple-out 3s infinite cubic-bezier(0.21, 0.53, 0.56, 0.8);
        }
        .mind-ripple::after { animation-delay: 1.5s; }
        @keyframes ripple-out {
            0% { transform: scale(0.5); opacity: 1; }
            100% { transform: scale(2); opacity: 0; }
        }

        .intro-h1 {
            font-size: 28px; font-weight: 500; margin-bottom: 15px;
            color: var(--text-ivory); letter-spacing: 1px;
            text-shadow: 0 4px 15px rgba(253, 251, 247, 0.1);
        }
        .intro-p {
            color: var(--text-muted); font-size: 15px; margin-bottom: 50px;
            max-width: 280px; font-weight: 300; line-height: 1.8;
        }

        .btn-start {
            background: var(--accent-sage); color: var(--bg-dark);
            border: none; padding: 16px 50px; font-size: 15px; font-weight: 600;
            border-radius: 50px; font-family: 'Vazirmatn'; cursor: pointer;
            transition: all 0.3s ease; box-shadow: 0 4px 20px rgba(157, 179, 155, 0.3);
            letter-spacing: 0.5px;
        }
        .btn-start:active { transform: scale(0.95); box-shadow: 0 2px 10px rgba(157, 179, 155, 0.2); }
        .btn-start:disabled {
            background: transparent; color: var(--text-muted); border: 1px solid var(--text-muted);
            box-shadow: none; opacity: 0.5; cursor: not-allowed;
        }

        /* 📱 Main App Layout */
        .app-layout {
            width: 100%; max-width: 480px; margin: 0 auto; height: 100%;
            display: none; flex-direction: column; padding: 20px 25px;
            opacity: 0; transform: translateY(10px); transition: opacity 0.8s ease, transform 0.8s ease;
            position: relative; z-index: 10;
        }

        .progress-container {
            width: 100%; display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 15px; margin-top: 40px;
            position: relative; z-index: 30;
        }

        .q-counter { color: var(--text-muted); font-size: 13px; font-weight: 400; letter-spacing: 1px;}
        .progress-track {
            flex-grow: 1; height: 3px; background: var(--line-color);
            margin-left: 20px; position: relative; border-radius: 4px; overflow: hidden;
        }
        .progress-glow {
            height: 100%; background: var(--accent-sage); width: 0%;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 8px var(--accent-glow);
            border-radius: 4px;
        }


        .music-toggle {
            position: absolute;
            top: 20px;
            left: 20px; /* چون rtl هست، میره سمت چپ که مزاحم نباشه */
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(26, 28, 29, 0.7);
            border: 1px solid var(--line-color);
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }
        .music-toggle:active { transform: scale(0.9); }
        .music-toggle svg { width: 20px; height: 20px; fill: currentColor; transition: 0.3s; }
        .music-toggle.playing { color: var(--accent-sage); border-color: var(--accent-sage); }

        /* 🎴 Question Stage */
        .card-stage {
            flex-grow: 1; position: relative; display: flex;
            align-items: center; justify-content: center; z-index: 10;
        }
        #card {
            width: 100%; min-height: 180px;
            display: flex; flex-direction: column; align-items: center;
            text-align: center; justify-content: center;
            position: absolute; opacity: 1;
        }

        .q-text-content {
            font-size: 26px; font-weight: 400; line-height: 1.7; color: var(--text-ivory);
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        /* 🔘 Interaction Area (Likert Scale) */
        .interaction-area { margin-bottom: 50px; width: 100%; z-index: 10; }

        .scale-container { position: relative; width: 100%; padding: 0 10px; }

        .scale-line {
            position: absolute; top: 15px; left: 25px; right: 25px;
            height: 2px; background: var(--line-color); z-index: 0;
            border-radius: 2px;
        }

        .options-grid {
            display: flex; justify-content: space-between; align-items: center;
            position: relative; z-index: 1;
        }

        /* 🔴 ENHANCED CIRCLES */
        .circle-btn {
            width: 32px; height: 32px;
            border: 2px solid var(--accent-sage);
            border-radius: 50%;
            background: var(--bg-dark);
            cursor: pointer; position: relative;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 0; appearance: none;
            box-shadow: none !important;
            outline: none !important;
        }
                /* Soft inner fill to make it pop */
        .circle-btn::after {
            content: ''; position: absolute; top: 50%; left: 50%;
            width: 12px; height: 12px; border-radius: 50%;
            background: var(--accent-sage);
            transform: translate(-50%, -50%) scale(0);
            transition: transform 0.2s ease;
        }

        .circle-btn:active { transform: scale(0.85); border-color: var(--text-ivory); }
        .circle-btn:active::after { transform: translate(-50%, -50%) scale(1); }

        .labels-row {
            display: flex; justify-content: space-between;
            color: var(--text-muted); font-size: 13px; margin-top: 20px;
            font-weight: 400; letter-spacing: 0.5px;
        }
        /* 🌟 Pure Fade Animation */
        .fade-out { animation: simpleFadeOut 0.3s forwards; }
        .fade-in { animation: simpleFadeIn 0.3s forwards; }

        @keyframes simpleFadeOut {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }
        @keyframes simpleFadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        /* 🧠 Loading Overlay */
        #loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2000;
            background: rgba(26, 28, 29, 0.85);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center;
        }
        .minimal-spinner {
            width: 40px; height: 40px; border: 3px solid rgba(157, 179, 155, 0.2);
            border-top-color: var(--accent-sage); border-radius: 50%;
            animation: spin 1s ease-in-out infinite;
        }

        /* 📖 Story Mode UI - Premium Experience */
        #result-container {
            display: none;
            flex-direction: column;
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0; left: 0;
            background: var(--bg-dark);
            z-index: 1000;
            padding: 30px 20px;
            overflow: hidden;
        }

        .story-progress-bar {
            display: flex; gap: 4px; width: 100%;
            margin-bottom: 30px; position: relative; z-index: 10;
        }

        .story-tick {
            flex: 1; height: 3px; background: rgba(255,255,255,0.1);
            border-radius: 4px; overflow: hidden;
        }

        .story-tick-fill {
            height: 100%; width: 0%; background: var(--accent-sage);
            transition: width 0.4s ease;
        }
        .story-tick.active .story-tick-fill { width: 100%; }

        .slide-container {
            flex-grow: 1;
            position: relative;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;

            -webkit-mask-image: linear-gradient(to bottom, black 85%, transparent 100%);
            mask-image: linear-gradient(to bottom, black 85%, transparent 100%);
        }

        .slide {
            position: absolute; width: 100%; max-height: 80vh;
            overflow-y: auto; padding-bottom: 40px;
            opacity: 0; transform: translateY(20px) scale(0.95);
            transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            pointer-events: none;
            scrollbar-width: none; /* Firefox */
            scroll-behavior: smooth;
        }
        .slide::-webkit-scrollbar { display: none; /* Chrome */ }

        .slide.active {
            opacity: 1; transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .slide.passed {
            opacity: 0; transform: translateY(-20px) scale(0.95);
        }

        .slide h2 {
            color: var(--accent-sage); font-size: 22px; font-weight: 500;
            margin-bottom: 20px; line-height: 1.4;
            text-shadow: 0 4px 15px rgba(157, 179, 155, 0.1);
        }

        .slide p {
            color: var(--text-ivory); font-size: 16px; font-weight: 300;
            line-height: 1.9; text-align: justify;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        /* 🔘 Floating Continue Button */
        .continue-btn-wrapper {
            position: absolute; bottom: 30px; left: 0; width: 100%;
            display: flex; justify-content: center; z-index: 20;
        }

        .continue-btn {
            background: var(--accent-sage); color: var(--bg-dark);
            border: none; padding: 15px 40px; font-size: 15px; font-weight: 600;
            border-radius: 50px; font-family: 'Vazirmatn'; cursor: pointer;
            box-shadow: 0 4px 20px rgba(157, 179, 155, 0.3);
            display: flex; align-items: center; gap: 10px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .continue-btn:active { transform: scale(0.95); }
        .continue-btn svg { width: 18px; height: 18px; fill: currentColor; }

        /* Network Error UI */
        .network-error-ui {
            display: none; flex-direction: column; align-items: center; justify-content: center;
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-dark); z-index: 2000; text-align: center; padding: 30px;
        }
        .network-error-ui svg { width: 60px; height: 60px; fill: var(--text-muted); margin-bottom: 20px; animation: pulse 2s infinite; }


        .back-story-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            z-index: 101;
            padding: 5px;
            display: none;
            transition: color 0.2s;
        }
        .back-story-btn:active { color: var(--text-ivory); transform: scale(0.9); }
        .back-story-btn svg { width: 24px; height: 24px; fill: currentColor; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .glass-card {
            position: relative;
            width: 92%;
            margin: 0 auto;
            padding: 40px 25px 35px 25px;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            transform: translateZ(0);
        }

        .glass-card::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: conic-gradient(transparent, var(--accent-sage), transparent 40%);
            animation: rotate-glow 5s linear infinite;
            opacity: 0.1
            z-index: 0;
            transition: background 1.5s ease;
        }


        .glass-card::after {
            content: '';
            position: absolute;
            top: 1px; left: 1px; right: 1px; bottom: 1px;
            background: linear-gradient(135deg, rgba(30, 33, 35, 0.8), rgba(20, 22, 23, 0.9));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 23px;
            z-index: 1;
        }

        .glass-card-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @keyframes rotate-glow { 100% { transform: rotate(360deg); } }

        .paragraph-target {
            opacity: 0;
            filter: blur(12px);
            transform: translateY(15px);
        }

        .blur-reveal {
            animation: blurFocus 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes blurFocus {
            to { opacity: 1; filter: blur(0); transform: translateY(0); }
        }

        .sacred-geometry {
            position: relative;
            width: 50px;
            height: 50px;
            margin-bottom: 25px;
            transform-style: preserve-3d;
            perspective: 800px;
        }

        .geom-ring {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border: 1px solid var(--accent-sage);
            border-radius: 50%;
            opacity: 0.6;
            transition: border-color 1.5s ease;
        }

        .geom-ring:nth-child(1) { animation: spin3D_1 8s linear infinite; }
        .geom-ring:nth-child(2) { animation: spin3D_2 10s linear infinite; }
        .geom-ring:nth-child(3) { animation: spin3D_3 12s linear infinite; }

        @keyframes spin3D_1 {
            0% { transform: rotateX(75deg) rotateZ(0deg); }
            100% { transform: rotateX(75deg) rotateZ(360deg); }
        }
        @keyframes spin3D_2 {
            0% { transform: rotateY(75deg) rotateZ(0deg); }
            100% { transform: rotateY(75deg) rotateZ(360deg); }
        }
        @keyframes spin3D_3 {
            0% { transform: rotateX(45deg) rotateY(45deg) rotateZ(0deg); }
            100% { transform: rotateX(45deg) rotateY(45deg) rotateZ(360deg); }
        }


        /* ---- Navigation Pill ---- */
        .smart-nav-wrapper {
            position: absolute; bottom: 35px; left: 0; width: 100%;
            display: flex; justify-content: center; z-index: 50;
        }

        .nav-pill {
            display: flex; align-items: center;
            background: rgba(30, 33, 35, 0.7);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            padding: 6px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        .nav-btn {
            background: transparent; border: none; color: var(--text-ivory);
            font-family: 'Vazirmatn'; font-size: 15px; font-weight: 500;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            padding: 10px 20px; transition: all 0.2s; border-radius: 40px;
        }

        .nav-btn svg { width: 20px; height: 20px; fill: currentColor; }
        .prev-btn { color: var(--text-muted); padding: 10px 15px; }
        .prev-btn:active { background: rgba(255,255,255,0.1); }

        .next-btn { background: var(--accent-sage); color: var(--bg-dark); gap: 8px; padding: 10px 30px; font-weight: 600; }
        .next-btn:active { transform: scale(0.95); }

        .nav-divider { width: 1px; height: 24px; background: rgba(255,255,255,0.1); margin: 0 5px; }

        /* ---- Typography Upgrades ---- */
        .glass-card h2.typewriter-target {
            background: linear-gradient(135deg, #ffffff 0%, var(--accent-sage) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-shadow: 0px 4px 20px rgba(0,0,0,0.2);
        }

        .glass-card p.paragraph-target {
            font-size: 15.5px;
            line-height: 2.1;
            color: rgba(253, 251, 247, 0.9);
            letter-spacing: 0.2px;
        }

        .text-highlight {
            color: var(--accent-sage);
            font-weight: 600;
            text-shadow: 0 0 8px var(--accent-glow);
            padding: 0 2px;
        }

        /* ========================================= */
        /* 🔮 Liquid Energy Orb (Zen Palette) 🔮 */
        /* ========================================= */
        .sacred-wrapper {
            position: relative;
            width: 60px;
            height: 60px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .liquid-orb {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 30%, var(--accent-sage) 0%, var(--bg-center) 70%, var(--bg-dark) 100%);
            box-shadow: 0 0 20px var(--accent-glow);
            filter: blur(4px);
            opacity: 0.6;
            border-radius: 40% 60% 60% 40% / 50% 50% 40% 60%;
            animation: morph-orb 8s ease-in-out infinite, spin-orb 12s linear infinite;
            z-index: 1;
        }

        .sacred-geometry {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            perspective: 800px;
            z-index: 2;
        }

        @keyframes morph-orb {
            0%, 100% { border-radius: 40% 60% 60% 40% / 50% 50% 40% 60%; }
            33% { border-radius: 60% 40% 50% 50% / 40% 60% 50% 40%; }
            66% { border-radius: 50% 50% 40% 60% / 60% 40% 60% 40%; }
        }

        @keyframes spin-orb {
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Ambient glowing breathing background -->
    <div class="mesh-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div id="access-denied">
        <h2 style="color: var(--text-ivory); font-weight: 300;">دسترسی غیرمجاز</h2>
    </div>

    <div id="intro-screen">
        <div class="mind-ripple"></div>
        <h1 class="intro-h1">کاوشگرِ درون</h1>
        <p class="intro-p" id="intro-desc">در حال بارگذاری...</p>
        <button class="btn-start" id="btn-start" onclick="startApp()" disabled>L O A D I N G</button>
    </div>

    <div class="app-layout" id="app">
        <audio id="bg-audio" src="bg-music.mp3" loop preload="auto"></audio>

        <button class="music-toggle playing" id="mute-btn" onclick="toggleMute()">
            <svg id="icon-unmuted" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            <svg id="icon-muted" viewBox="0 0 24 24" style="display: none;"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
        </button>
        <div class="progress-container">
            <div class="progress-track">
                <div class="progress-glow" id="progress"></div>
            </div>
            <div class="q-counter" id="q-num">1 / 60</div>
        </div>

        <div class="card-stage">
            <div id="card">
                <div class="q-text-content" id="q-text">...</div>
            </div>
        </div>

        <div class="interaction-area" id="interaction-area">
            <div class="scale-container">
                <div class="scale-line"></div>
                <div class="options-grid">
                    <button class="circle-btn" data-val="1" onclick="handleAnswer(1)"></button>
                    <button class="circle-btn" data-val="2" onclick="handleAnswer(2)"></button>
                    <button class="circle-btn" data-val="3" onclick="handleAnswer(3)"></button>
                    <button class="circle-btn" data-val="4" onclick="handleAnswer(4)"></button>
                    <button class="circle-btn" data-val="5" onclick="handleAnswer(5)"></button>
                </div>
                <div class="labels-row">
                    <span>کاملاً مخالف</span>
                    <span>کاملاً موافق</span>
                </div>
            </div>
        </div>
    </div>

    <div id="loading-overlay" style="display: none;">
        <div class="minimal-spinner"></div>
        <h3 style="margin-top: 25px; color: var(--text-ivory); font-weight: 400; letter-spacing: 1px; font-size: 16px;">تـحـلـیـل داده‌هـا</h3>
        <p style="color: var(--text-muted); font-size: 13px; margin-top: 5px;">در حال ترسیم نقشه‌ی ذهن...</p>
    </div>

    <!-- Story Mode Result Container -->
    <div id="result-container">
    <div class="smart-nav-wrapper">
        <div class="nav-pill">
            <button class="nav-btn prev-btn" id="btn-prev" onclick="prevSlide()">
                <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
            </button>
            <div class="nav-divider"></div>
            <button class="nav-btn next-btn" id="btn-next" onclick="nextSlide()">
                <span id="next-btn-text">ادامه</span>
                <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
            </button>
        </div>
    </div>
        <div class="story-progress-bar" id="story-progress"></div>
        <div class="slide-container" id="slides-wrapper"></div>

    </div>

    <!-- Beautiful Network Error -->
    <div class="network-error-ui" id="network-error">
        <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.36 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/></svg>
        <h3 style="color: var(--text-ivory); font-weight: 400; margin-bottom: 10px;">ارتباط با سرور کُند است</h3>
        <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 30px; max-width: 250px;">سیگنال‌های ذهن شما در مسیر ارتباطی گیر کرده‌اند. لطفاً اینترنت خود را بررسی کنید.</p>
        <button class="btn-start" onclick="loadAnalysis()">تلاش مجدد</button>
    </div>

    <script>
        // ✅ Main Logic (Untouched functionally, only UI constants updated)
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand(); tg.disableVerticalSwipes();
        if(tg.setHeaderColor) tg.setHeaderColor('#1a1c1d');
        if(tg.setBackgroundColor) tg.setBackgroundColor('#1a1c1d');

        const isTelegram = (tg.initData && tg.initData.length > 0) || (tg.platform && tg.platform !== 'unknown');

        let questionsDB = []; let currentIndex = 0; let userAnswers = {};
        const app = document.getElementById('app');
        const intro = document.getElementById('intro-screen');
        const card = document.getElementById('card');
        const qText = document.getElementById('q-text');
        const qNum = document.getElementById('q-num');
        const progress = document.getElementById('progress');
        const btnStart = document.getElementById('btn-start');
        const introDesc = document.getElementById('intro-desc');
        const bgAudio = document.getElementById('bg-audio');
        const muteBtn = document.getElementById('mute-btn');
        const iconUnmuted = document.getElementById('icon-unmuted');
        const iconMuted = document.getElementById('icon-muted');

        function toggleMute() {
            if (bgAudio.muted) {
                bgAudio.muted = false;
                muteBtn.classList.add('playing');
                iconUnmuted.style.display = 'block';
                iconMuted.style.display = 'none';
            } else {
                bgAudio.muted = true;
                muteBtn.classList.remove('playing');
                iconUnmuted.style.display = 'none';
                iconMuted.style.display = 'block';
            }
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
        }

        async function fetchQuestions() {
            try {
                const res = await fetch('questions.json?v=' + new Date().getTime());
                if (!res.ok) throw new Error("Network error");
                questionsDB = await res.json();
                introDesc.innerHTML = `${questionsDB.length} ایستگاه برای شناخت عمیق`;
                loadSavedAnswers();
            } catch (e) {
                console.error(e);
                btnStart.innerText = "خطا در ارتباط";
                introDesc.innerText = "امکان بارگذاری وجود ندارد.";
            }
        }

        function loadSavedAnswers() {
            let cloudResponded = false;

            const fallbackTimer = setTimeout(() => {
                if (!cloudResponded) {
                    console.warn("CloudStorage timeout. Falling back to LocalStorage.");
                    loadFromLocalStorage();
                }
            }, 2000);

            if (tg.CloudStorage) {
                tg.CloudStorage.getItems(['user_answers_v1', 'current_index_v1'], (err, res) => {
                    cloudResponded = true;
                    clearTimeout(fallbackTimer);

                    if (!err && res) {
                        const savedAnswers = res['user_answers_v1'];
                        const savedIndex = res['current_index_v1'];

                        if (savedAnswers && savedIndex) {
                            userAnswers = JSON.parse(savedAnswers);
                            currentIndex = parseInt(savedIndex);

                            if (currentIndex >= questionsDB.length) {
                                currentIndex = 0;
                                userAnswers = {};
                            }
                        }
                    }
                    btnStart.removeAttribute('disabled');
                    btnStart.innerText = currentIndex > 0 ? "ادامه مسیر قبلی" : "ورود به ناخودآگاه";
                });
            } else {
                cloudResponded = true;
                clearTimeout(fallbackTimer);
                loadFromLocalStorage();
            }
        }

        function loadFromLocalStorage() {
            const savedAnswers = localStorage.getItem('user_answers_v1');
            const savedIndex = localStorage.getItem('current_index_v1');
            if (savedAnswers && savedIndex) {
                userAnswers = JSON.parse(savedAnswers);
                currentIndex = parseInt(savedIndex);
                if (currentIndex >= questionsDB.length) {
                    currentIndex = 0;
                    userAnswers = {};
                }
            }
            btnStart.removeAttribute('disabled');
            btnStart.innerText = currentIndex > 0 ? "ادامه مسیر قبلی" : "ورود به ناخودآگاه";
        }

        let cloudSaveTimeout;

        function saveProgress() {
            localStorage.setItem('user_answers_v1', JSON.stringify(userAnswers));
            localStorage.setItem('current_index_v1', currentIndex);

            if (tg.CloudStorage) {
                clearTimeout(cloudSaveTimeout);
                cloudSaveTimeout = setTimeout(() => {
                    tg.CloudStorage.setItem('user_answers_v1', JSON.stringify(userAnswers), (err) => {
                        if (err) console.error("CloudStorage Error:", err);
                    });
                    tg.CloudStorage.setItem('current_index_v1', currentIndex.toString());
                }, 1500);
            }
        }

        function startApp() {
            document.getElementById('access-denied').style.display = 'none';
            intro.style.display = 'none';
            app.style.display = 'flex';
            bgAudio.play().catch(e => console.log("Audio autoplay issue:", e));
            if (tg.BackButton) {
                tg.BackButton.show();
                tg.BackButton.onClick(() => {
                    tg.showPopup({
                        title: 'توقف مسیر؟', message: 'پیشرفت شما محفوظ می‌ماند.',
                        buttons: [{id: 'yes', type: 'destructive', text: 'خروج'}, {id: 'no', type: 'cancel', text: 'ادامه'}]
                    }, (btnId) => { if (btnId === 'yes') tg.close(); });
                });
            }
            setTimeout(() => {
                app.style.opacity = '1'; app.style.transform = 'translateY(0)';
                renderQuestion(false);
            }, 100);
        }

        let isAnimating = false;
        function renderQuestion(animate = true) {
            if (currentIndex >= questionsDB.length) { finishQuiz(); return; }
            const q = questionsDB[currentIndex];
            const percent = ((currentIndex) / questionsDB.length) * 100;
            qNum.innerText = `${currentIndex + 1} / ${questionsDB.length}`;
            qText.innerText = q.text;
            progress.style.width = percent + '%';

            if (animate) {
                card.classList.remove('fade-out');
                card.classList.add('fade-in');
                setTimeout(() => card.classList.remove('fade-in'), 300);
            }
        }

        window.handleAnswer = function(score) {
            if (isAnimating) return;
            isAnimating = true;
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            const currentQ = questionsDB[currentIndex];
            userAnswers[currentQ.key] = score;
            currentIndex++;
            saveProgress();

            card.classList.add('fade-out');
            setTimeout(() => {
                if (currentIndex >= questionsDB.length) { finishQuiz(); }
                else { renderQuestion(true); isAnimating = false; }
            }, 300);
        };

        function finishQuiz() {
            progress.style.width = '100%'; qNum.innerText = '';
            document.getElementById('interaction-area').style.display = 'none';
            if(tg.BackButton) tg.BackButton.hide();
            card.classList.remove('fade-out');

            card.innerHTML = `
                <div style="width: 16px; height: 16px; border-radius: 50%; background: var(--accent-sage); box-shadow: 0 0 20px var(--accent-sage); margin: 0 auto 30px auto; animation: breathe 2s infinite alternate;"></div>
                <h3 style="margin:0 0 15px 0; color:var(--text-ivory); font-weight:500; font-size:24px;">پایان سفر</h3>
                <p style="font-size:15px; color:var(--text-muted); margin-bottom:30px;">الگوهای شما ثبت شد.</p>
            `;
            tg.MainButton.text = "دریافت تحلیل نهایی";
            tg.MainButton.color = "#9DB39B";
            tg.MainButton.textColor = "#1a1c1d";
            tg.MainButton.show();
            tg.MainButton.onClick(sendDataSecure);
        }

        let isSubmitting = false;
        async function sendDataSecure() {
            if (isSubmitting) return;
            const initDataRaw = window.Telegram.WebApp.initData;
            if (!initDataRaw) { tg.showtg.showAlert("خطا: احراز هویت انجام نشد."); return; }

            isSubmitting = true;
            bgAudio.pause();
            document.getElementById('loading-overlay').style.display = 'flex';
            tg.MainButton.showProgress(true);
            tg.MainButton.disable();

            const payload = { init_data: initDataRaw, answers: userAnswers, timestamp: Math.floor(Date.now() / 1000) };

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 30000);

                const response = await fetch('https://6f04-2a01-4ff-f0-fec7-00-1.ngrok-free.app/assessment/receive-data', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                    signal: controller.signal
                });

                clearTimeout(timeoutId);

                if (response.ok) {
                    localStorage.removeItem('user_answers_v1');
                    localStorage.removeItem('current_index_v1');

                    if (tg.CloudStorage) {
                        tg.CloudStorage.removeItems(['user_answers_v1', 'current_index_v1'], (err, success) => {
                            if (err) console.error("Error clearing CloudStorage:", err);
                            tg.close();
                        });
                    } else {
                        tg.close();
                    }
                    return;
                }

                if (!response.ok) {
                    if (response.status === 429 || response.status === 400) {
                        tg.showAlert("⏳ درخواست شما قبلا ثبت شده است. لطفاً ربات را چک کنید.");
                    } else {
                        try {
                            const errJson = await response.json();
                            tg.showAlert("خطا: " + (errJson.detail || "مشکلی پیش آمده است"));
                        } catch (parseError) {
                            const errText = await response.text();
                            tg.showAlert("خطا: " + errText);
                        }
                    }
                    resetButtonState();
                    return;
                }

            } catch (error) {
                tg.showAlert("خطا در برقراری ارتباط با سرور: " + error.message);
                resetButtonState();
            }
        }

        function resetButtonState() {
            isSubmitting = false;
            document.getElementById('loading-overlay').style.display = 'none';
            tg.MainButton.hideProgress(); tg.MainButton.enable();
        }

        window.onload = function() {
            const isDebug = false;

            if (isTelegram || isDebug) {
                document.getElementById('access-denied').style.display = 'none';

                const params = new URLSearchParams(window.location.search);
                const flow = params.get("flow");

                if (flow === "result") {
                    document.getElementById('intro-screen').style.display = 'none';
                    document.getElementById('app').style.display = 'none';

                    loadAnalysis();
                } else {
                    intro.style.display = 'flex';
                    fetchQuestions();
                }

            } else {
                document.getElementById('access-denied').style.display = 'flex';
                intro.style.display = 'none';
            }
        };

        let parsedSlides = [];
        let currentSlideIndex = 0;

        async function loadAnalysis() {
            document.getElementById('network-error').style.display = 'none';
            document.getElementById('loading-overlay').style.display = 'flex';
            document.querySelector('#loading-overlay h3').innerText = "فراخوانی پرونده ذهنی";
            document.querySelector('#loading-overlay p').innerText = "در حال ایجاد ارتباط امن...";

            const initDataRaw = window.Telegram.WebApp.initData;

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 12000);

            try {
                const response = await fetch('https://6f04-2a01-4ff-f0-fec7-00-1.ngrok-free.app/assessment/receive-result', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'ngrok-skip-browser-warning': 'true'
                    },
                    body: JSON.stringify({ init_data: initDataRaw }),
                    signal: controller.signal
                });

                clearTimeout(timeoutId);

                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('loading-overlay').style.display = 'none';

                    renderResultUI(data.report_text);
                } else {
                    tg.showAlert("هنوز تحلیلی برای شما ثبت نشده یا خطایی رخ داده است.");
                    tg.close();
                }
            } catch (error) {
                clearTimeout(timeoutId);
                document.getElementById('loading-overlay').style.display = 'none';

                if (error.name === 'AbortError' || error.message.includes('Failed to fetch')) {
                    document.getElementById('network-error').style.display = 'flex';
                    if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                } else {
                    tg.showAlert("خطای فنی: " + error.message);
                }
            }
        }

        function parseMarkdownToSlides(rawText) {
            const cleanText = rawText.replace(/---/g, '');

            const rawParts = cleanText.split('##').map(p => p.trim()).filter(p => p.length > 0);

            return rawParts.map(part => {
                const lines = part.split('\n');
                const title = lines[0].trim();
                const content = lines.slice(1).join('<br><br>').trim();
                return { title, content };
            });
        }

        function typeWriterEffect(element, text, speed = 35, onComplete) {
            if (element.twTimeout) clearTimeout(element.twTimeout);
            element.innerHTML = "";
            let i = 0;

            function type() {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    i++;
                    element.twTimeout = setTimeout(type, speed);
                } else if (onComplete) {
                    onComplete();
                }
            }
            type();
        }

        function renderResultUI(reportText) {
            document.getElementById('app').style.display = 'none';
            document.getElementById('intro-screen').style.display = 'none';

            parsedSlides = parseMarkdownToSlides(reportText);
            currentSlideIndex = 0;

            const container = document.getElementById('result-container');
            const slidesWrapper = document.getElementById('slides-wrapper');
            const progressWrapper = document.getElementById('story-progress');

            slidesWrapper.innerHTML = '';
            progressWrapper.innerHTML = '';

            parsedSlides.forEach((slide, index) => {
                const tick = document.createElement('div');
                tick.className = 'story-tick';
                tick.id = `tick-${index}`;
                tick.innerHTML = `<div class="story-tick-fill"></div>`;
                progressWrapper.appendChild(tick);

                const slideDiv = document.createElement('div');
                slideDiv.className = 'slide';
                slideDiv.id = `slide-${index}`;
                const cleanTitle = slide.title.replace(/^\d+\.\s*/, '').replace(/<\/?[^>]+(>|$)/g, "").replace(/\*/g, '');
                const formattedContent = slide.content.replace(/\*\*(.*?)\*\*/g, '<span class="text-highlight">$1</span>');
                slideDiv.innerHTML = `
                    <div class="glass-card">
                        <div class="glass-card-content">
                            <div class="sacred-wrapper">
                                <div class="liquid-orb"></div>
                                    <div class="sacred-geometry">
                                        <div class="geom-ring"></div>
                                        <div class="geom-ring"></div>
                                        <div class="geom-ring"></div>
                                    </div>
                            </div>
                            <h2 class="typewriter-target" style="text-align: center; margin-top: 0;" data-text="${cleanTitle}"></h2>
                            <p class="paragraph-target">${formattedContent}</p>
                        </div>
                    </div>
                `;
                                slidesWrapper.appendChild(slideDiv);
            });

            container.style.display = 'flex';
            updateStoryUI();
        }

        function applyMoodTheme(title, content) {
            const textToAnalyze = (title + " " + content);
            const root = document.documentElement;

            if (textToAnalyze.includes('اصطکاک') || textToAnalyze.includes('سایه') || textToAnalyze.includes('ضعف')) {
                root.style.setProperty('--accent-sage', '#AAB2AD');
                root.style.setProperty('--blob-1', 'rgba(170, 178, 173, 0.2)');
                root.style.setProperty('--blob-2', 'rgba(100, 105, 102, 0.1)');
                root.style.setProperty('--blob-3', 'rgba(50, 55, 52, 0.1)');
            }
            else if (textToAnalyze.includes('معماری') || textToAnalyze.includes('ساختار') || textToAnalyze.includes('منطق')) {
                root.style.setProperty('--accent-sage', '#C2C5C3');
                root.style.setProperty('--blob-1', 'rgba(194, 197, 195, 0.2)');
                root.style.setProperty('--blob-2', 'rgba(140, 143, 141, 0.1)');
                root.style.setProperty('--blob-3', 'rgba(80, 85, 82, 0.1)');
            }
            else {
                root.style.setProperty('--accent-sage', '#9DB39B');
                root.style.setProperty('--blob-1', 'rgba(157, 179, 155, 0.3)');
                root.style.setProperty('--blob-2', 'rgba(85, 107, 112, 0.3)');
                root.style.setProperty('--blob-3', 'rgba(45, 60, 65, 0.3)');
            }
        }


        function updateStoryUI() {
            parsedSlides.forEach((_, index) => {
                const slide = document.getElementById(`slide-${index}`);
                const tick = document.getElementById(`tick-${index}`);

                if (index < currentSlideIndex) {
                    slide.className = 'slide passed';
                    tick.classList.add('active');
                } else if (index === currentSlideIndex) {
                    applyMoodTheme(parsedSlides[currentSlideIndex].title, parsedSlides[currentSlideIndex].content);
                    slide.className = 'slide active';
                    tick.classList.remove('active');

                    const titleEl = slide.querySelector('.typewriter-target');
                    const pEl = slide.querySelector('.paragraph-target');

                    pEl.classList.remove('blur-reveal');
                    pEl.style.opacity = '0';
                    titleEl.innerHTML = "";

                    setTimeout(() => {
                        typeWriterEffect(titleEl, titleEl.getAttribute('data-text'), 40, () => {
                            pEl.classList.add('blur-reveal');
                        });
                    }, 350);

                    setTimeout(() => tick.classList.add('active'), 50);
                } else {
                    slide.className = 'slide';
                    tick.classList.remove('active');
                }
            });

            const btnPrev = document.getElementById('btn-prev');
            const nextText = document.getElementById('next-btn-text');
            const nextIcon = document.querySelector('.next-btn svg');
            if (currentSlideIndex > 0) {
                btnPrev.style.display = 'flex';
                document.querySelector('.nav-divider').style.display = 'block';
            } else {
                btnPrev.style.display = 'none';
                document.querySelector('.nav-divider').style.display = 'none';
            }

            const btnSpan = document.querySelector('#next-slide-btn span');
            const btnIcon = document.querySelector('#next-slide-btn svg');

            if (currentSlideIndex === parsedSlides.length - 1) {
                nextText.innerText = "پایان تحلیل";
                nextIcon.style.display = "none";
            } else {
                nextText.innerText = "ادامه";
                nextIcon.style.display = "block";
            }
        }

        window.nextSlide = function() {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

            if (currentSlideIndex < parsedSlides.length - 1) {
                currentSlideIndex++;
                updateStoryUI();
            } else {
                tg.close();
            }
        }


        window.prevSlide = function() {
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

            if (currentSlideIndex > 0) {
                currentSlideIndex--;
                updateStoryUI();
            }
        }


    </script>
</body>
