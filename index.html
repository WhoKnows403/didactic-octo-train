<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تحلیل شخصیت MBTI</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@200;300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 🎨 پالت رنگی: نوآر، تاریکی مطلق، طلای سوخته */
            --bg-main: #020202;         
            --bg-card: rgba(15, 15, 15, 0.65); /* شیشه‌ای خیلی شفاف برای دیدن محیط */
            --border-color: #333;    
            --text-primary: #e0e0e0;    
            --text-secondary: #888;  
            --text-gold: #ffb700;       
            
            /* رنگ دکمه‌ها */
            --btn-disagree: #000000;    /* سیاه */
            --btn-neutral: #1a1a1a;     /* خاکستری خیلی تیره */
            --btn-agree: #d49017;       /* طلایی کلاسیک */
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body, html {
            font-family: 'Vazirmatn', sans-serif;
            background-color: var(--bg-main);
            /* ساخت اتمسفر خیابان خیس و مه آلود بدون عکس */
            background: 
                radial-gradient(ellipse at 50% 90%, #1a1a20 0%, #000000 60%), /* بازتاب نور روی زمین */
                linear-gradient(to bottom, #050505 0%, #08080a 100%); /* آسمان شب */
            color: var(--text-primary);
            margin: 0; padding: 0; 
            width: 100%; height: 100%;
            overflow: hidden; 
            overscroll-behavior: none; 
            position: fixed; 
            user-select: none;
        }

        /* ❄️ کانتینر برف */
        .snow-scene {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 1;
            overflow: hidden;
        }
        
        .snowflake {
            position: absolute; background: white; border-radius: 50%; opacity: 0;
            animation: fall linear infinite;
        }

        /* تنظیم کیفیت برف‌ها برای عمق میدان */
        .snow-layer-1 .snowflake { width: 3px; height: 3px; opacity: 0.9; animation-duration: 8s; box-shadow: 0 0 2px white; } /* نزدیک و شفاف */
        .snow-layer-2 .snowflake { width: 2px; height: 2px; opacity: 0.5; animation-duration: 12s; filter: blur(0.5px); } /* وسط */
        .snow-layer-3 .snowflake { width: 1px; height: 1px; opacity: 0.3; animation-duration: 18s; filter: blur(1.5px); } /* دور و تار */

        @keyframes fall {
            0% { transform: translateY(-10vh) translateX(-5px); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(110vh) translateX(10px); opacity: 0; }
        }

        /* 🌫️ مه اتمسفریک */
        .fog-floor {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 50%;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 100%);
            z-index: 2; pointer-events: none;
        }

        /* 🕯️ چراغ گازی سیلوئت (ضد نور) - سمت چپ */
        .wall-lamp-container {
            position: fixed;
            top: 0; left: -10px; /* متصل به چپ */
            z-index: 20; /* روی همه چیز */
            width: 180px; height: 400px;
            pointer-events: none;
            display: flex; justify-content: flex-start;
        }

        /* هاله نور پشت چراغ (که سیاهی چراغ رو منطقی میکنه) */
        .lamp-light-bloom {
            position: absolute;
            left: 55px; top: 130px; /* تنظیم دقیق پشت حباب */
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(255, 170, 0, 0.3) 0%, rgba(255, 100, 0, 0.05) 50%, transparent 70%);
            transform: translate(-50%, -50%);
            pointer-events: none;
            mix-blend-mode: screen;
            animation: flicker 5s infinite ease-in-out;
        }

        /* استایل SVG چراغ (سیاه یکدست) */
        .silhouette-svg {
            filter: drop-shadow(2px 4px 10px rgba(0,0,0,0.8));
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.9; transform: translate(-50%, -50%) scale(0.98); }
        }

        /* 🚀 صفحات */
        #access-denied, #intro-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 500;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            padding: 30px; text-align: center;
            background: #000;
        }
        
        .intro-visual { 
            font-size: 50px; margin-bottom: 20px; 
            filter: grayscale(100%); opacity: 0.7;
            animation: breathe 4s infinite;
        }
        .intro-h1 { 
            font-size: 24px; font-weight: 300; margin-bottom: 10px; 
            color: var(--text-gold); letter-spacing: 1px;
        }
        .intro-p { 
            color: var(--text-secondary); font-size: 14px; margin-bottom: 50px; 
            max-width: 280px; font-weight: 300; line-height: 1.8;
        }
        .btn-start {
            background: transparent; color: var(--text-gold);
            border: 1px solid rgba(255, 183, 0, 0.4);
            padding: 12px 45px; font-size: 14px; border-radius: 4px;
            font-family: 'Vazirmatn'; cursor: pointer; transition: all 0.3s;
        }
        .btn-start:active { background: rgba(255, 183, 0, 0.15); border-color: var(--text-gold); }

        /* 📱 کانتینر اصلی */
        .app-layout {
            width: 100%; max-width: 480px; margin: 0 auto; height: 100%;
            display: none; flex-direction: column; padding: 20px 25px;
            opacity: 0; transform: translateY(10px); transition: opacity 0.8s;
            position: relative; z-index: 10;
        }

        .progress-container {
            width: 100%; display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 25px; margin-top: 60px; 
        }
        .q-counter { color: #666; font-size: 12px; font-family: monospace; }
        .progress-track {
            flex-grow: 1; height: 1px; background: #333;
            margin-right: 15px; position: relative;
        }
        .progress-glow {
            height: 100%; background: var(--text-gold); width: 0%; 
            transition: width 0.5s ease; box-shadow: 0 0 10px var(--text-gold);
        }

        /* 🎴 کارت سوال - گلس مورفیسم */
        .card-stage { 
            flex-grow: 1; position: relative; display: flex; 
            align-items: center; justify-content: center; 
        }
        .stone-card {
            background: var(--bg-card);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            /* نوری که از چراغ سمت چپ میخوره به لبه کارت */
            border-left: 1px solid rgba(255, 183, 0, 0.3); 
            
            padding: 30px 25px; border-radius: 4px; width: 100%; min-height: 220px;
            display: flex; flex-direction: column; align-items: center; 
            text-align: center; justify-content: center;
            box-shadow: 0 25px 60px rgba(0,0,0,0.9);
            position: absolute; opacity: 1; 
        }
        .q-text-content { 
            font-size: 18px; font-weight: 300; line-height: 1.8; color: #f0f0f0;
            text-shadow: 0 2px 4px rgba(0,0,0,1);
        }

        /* 🔘 دکمه‌ها */
        .interaction-area { margin-bottom: 40px; width: 100%; }
        .labels-row { 
            display: flex; justify-content: space-between; 
            color: #555; font-size: 11px; margin-bottom: 20px; padding: 0 10px; 
            text-transform: uppercase; letter-spacing: 1px;
        }
        .options-grid {
            display: flex; justify-content: space-between; align-items: center;
            position: relative; padding: 0 10px;
        }
        /* خط راهنمای وسط دکمه ها */
        .options-grid::before {
            content: ''; position: absolute; left: 20px; right: 20px; top: 50%; height: 1px;
            background: #222; z-index: 0;
        }
        .circle-btn {
            border: none; border-radius: 50%; 
            cursor: pointer; z-index: 2; position: relative;
            transition: all 0.2s;
            color: transparent; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        
        /* استایل دکمه‌ها */
        .circle-btn[data-val="1"] { width: 36px; height: 36px; background: #080808; border: 1px solid #333; }
        .circle-btn[data-val="2"] { width: 44px; height: 44px; background: #121212; border: 1px solid #333; }
        .circle-btn[data-val="3"] { width: 50px; height: 50px; background: #1a1a1a; border: 1px solid #444; }
        .circle-btn[data-val="4"] { width: 56px; height: 56px; background: #b8860b; opacity: 0.9; }
        .circle-btn[data-val="5"] { 
            width: 68px; height: 68px; 
            background: radial-gradient(circle at 30% 30%, #ffd700, #ff8c00); 
            box-shadow: 0 0 20px rgba(255, 140, 0, 0.4);
        }
        .circle-btn:active { transform: scale(0.95); }

        .fade-out { animation: dissolveOut 0.4s forwards; }
        .fade-in { animation: dissolveIn 0.4s forwards; }
        @keyframes dissolveOut { to { opacity: 0; transform: scale(0.98); } }
        @keyframes dissolveIn { from { opacity: 0; transform: scale(1.02); } to { opacity: 1; transform: scale(1); } }
        @keyframes breathe { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }

        /* 🧠 لایه لودینگ */
        #loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2000;
            background: rgba(0, 0, 0, 0.95); 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center;
        }
        .brain-loader {
            font-size: 50px; filter: grayscale(100%); opacity: 0.8;
            animation: breathe 1.5s infinite;
        }
        .loading-bar-container {
            width: 140px; height: 1px; background: #333; 
            margin-top: 30px; overflow: hidden; position: relative;
        }
        .loading-bar-fill {
            position: absolute; top: 0; left: 0; bottom: 0; background: var(--text-gold);
            width: 50%; animation: indeterminate 1.5s infinite ease-in-out;
        }
        @keyframes indeterminate {
            0% { left: -50%; width: 30%; } 50% { left: 20%; width: 80%; } 100% { left: 100%; width: 30%; }
        }
    </style>
</head>
<body>

    <!-- ❄️ سیستم برف و محیط -->
    <div class="snow-scene" id="snow-container">
        <!-- دانه‌ها توسط JS ساخته میشن -->
        <div class="snow-layer-1" id="snow-l1"></div>
        <div class="snow-layer-2" id="snow-l2"></div>
        <div class="snow-layer-3" id="snow-l3"></div>
    </div>
    <div class="fog-floor"></div>

    <!-- 🕯️ چراغ گازی دیواری (طرح Silhouette - سیاه یکدست) -->
    <div class="wall-lamp-container">
        <!-- هاله نور پشت چراغ -->
        <div class="lamp-light-bloom"></div>
        
        <!-- وکتور چراغ به صورت سایه سیاه -->
        <svg class="silhouette-svg" width="180" height="350" viewBox="0 0 180 350" xmlns="http://www.w3.org/2000/svg">
            <!-- پایه آهنی سیاه -->
            <path d="M0 80 L 50 80 C 70 80, 80 90, 85 110" stroke="black" stroke-width="14" fill="none"/>
            <path d="M0 140 L 40 140 C 60 140, 70 150, 85 190" stroke="black" stroke-width="8" fill="none"/>
            
            <!-- تزیینات -->
            <circle cx="85" cy="110" r="10" fill="black"/>
            
            <!-- بدنه فانوس (توپر سیاه) -->
            <g transform="translate(55, 110)">
                <!-- کلاهک بالا -->
                <path d="M30 0 L 0 35 L 60 35 Z" fill="black"/>
                <rect x="25" y="-15" width="10" height="15" fill="black"/>
                <circle cx="30" cy="-18" r="5" fill="black"/>
                
                <!-- فریم دور شیشه (چون ضد نور است، شیشه هم سیاه دیده میشود یا فقط فریم) -->
                <!-- اینجا یک حقه میزنیم: کل بدنه سیاهه، نور فقط از پشتش میزنه بیرون -->
                <path d="M5 35 L 15 120 L 45 120 L 55 35 Z" fill="black"/> 
                
                <!-- کف فانوس -->
                <path d="M15 120 L 20 135 L 40 135 L 45 120 Z" fill="black"/>
                <circle cx="30" cy="138" r="6" fill="black"/>
            </g>
        </svg>
    </div>

    <div id="access-denied">
        <h2 style="color: var(--text-gold); font-weight: 300;">دسترسی غیرمجاز</h2>
    </div>

    <div id="intro-screen">
        <div class="intro-visual">🗝️</div>
        <h1 class="intro-h1">کاوشگرِ درون</h1>
        <p class="intro-p" id="intro-desc">در حال بارگذاری...</p>
        <button class="btn-start" id="btn-start" onclick="startApp()" disabled>L O A D I N G</button>
    </div>

    <div class="app-layout" id="app">
        <div class="progress-container">
            <div class="progress-track">
                <div class="progress-glow" id="progress"></div>
            </div>
            <div class="q-counter" id="q-num">1 / 60</div>
        </div>
        
        <div class="card-stage">
            <div class="stone-card" id="card">
                <div class="q-text-content" id="q-text">...</div>
            </div>
        </div>

        <div class="interaction-area" id="interaction-area">
            <div class="labels-row">
                <span>مخالفم</span>
                <span>موافقم</span>
            </div>
            <div class="options-grid">
                <button class="circle-btn" data-val="1" onclick="handleAnswer(1)"></button>
                <button class="circle-btn" data-val="2" onclick="handleAnswer(2)"></button>
                <button class="circle-btn" data-val="3" onclick="handleAnswer(3)"></button>
                <button class="circle-btn" data-val="4" onclick="handleAnswer(4)"></button>
                <button class="circle-btn" data-val="5" onclick="handleAnswer(5)"></button>
            </div>
        </div>
    </div>

    <div id="loading-overlay" style="display: none;">
        <div class="brain-loader">🧠</div>
        <h3 style="margin-top: 25px; color: var(--text-gold); font-weight: 300; letter-spacing: 1px; font-size: 16px;">تـحـلـیـل داده‌هـا</h3>
        <p style="color: var(--text-secondary); font-size: 12px; margin-top: 5px;">در حال ترسیم نقشه‌ی ذهن...</p>
        <div class="loading-bar-container">
            <div class="loading-bar-fill"></div>
        </div>
    </div>

    <script>
        // ✅ لاجیک اصلی (بدون تغییر)
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand(); tg.disableVerticalSwipes();
        if(tg.setHeaderColor) tg.setHeaderColor('#020202');
        if(tg.setBackgroundColor) tg.setBackgroundColor('#020202');
        
        // ❄️ اسکریپت تولید برف (فوق‌العاده سبک)
        function createSnow() {
            const l1 = document.getElementById('snow-l1');
            const l2 = document.getElementById('snow-l2');
            const l3 = document.getElementById('snow-l3');
            
            function addFlakes(container, count) {
                for(let i=0; i<count; i++) {
                    const el = document.createElement('div');
                    el.className = 'snowflake';
                    el.style.left = Math.random() * 100 + '%';
                    // زمان شروع رندوم برای اینکه همه با هم نریزن
                    el.style.animationDelay = (Math.random() * 10) + 's';
                    container.appendChild(el);
                }
            }
            
            addFlakes(l1, 15); // برف‌های نزدیک
            addFlakes(l2, 10); // برف‌های وسط
            addFlakes(l3, 8);  // برف‌های دور
        }
        createSnow();

        const isTelegram = (tg.initData && tg.initData.length > 0) || (tg.platform && tg.platform !== 'unknown');
        
        let questionsDB = []; let currentIndex = 0; let userAnswers = {};
        const app = document.getElementById('app');
        const intro = document.getElementById('intro-screen');
        const card = document.getElementById('card');
        const qText = document.getElementById('q-text');
        const qNum = document.getElementById('q-num');
        const progress = document.getElementById('progress');
        const btnStart = document.getElementById('btn-start');
        const introDesc = document.getElementById('intro-desc');

        async function fetchQuestions() {
            try {
                const res = await fetch('questions.json?v=' + new Date().getTime());
                if (!res.ok) throw new Error("Network error");
                questionsDB = await res.json();
                btnStart.removeAttribute('disabled');
                btnStart.innerText = "ورود به ناخودآگاه"; 
                introDesc.innerHTML = `${questionsDB.length} ایستگاه برای شناخت عمیق`;
                loadSavedAnswers();
            } catch (e) {
                console.error(e);
                btnStart.innerText = "خطا در ارتباط";
                introDesc.innerText = "امکان بارگذاری وجود ندارد.";
            }
        }

        function loadSavedAnswers() {
            try {
                const saved = localStorage.getItem('user_answers_v1');
                const savedIndex = localStorage.getItem('current_index_v1');
                const isSent = localStorage.getItem('data_sent_flag');
                if (saved && savedIndex && !isSent) {
                    userAnswers = JSON.parse(saved);
                    currentIndex = parseInt(savedIndex);
                    if (currentIndex >= questionsDB.length) { currentIndex = 0; userAnswers = {}; }
                    else if (currentIndex > 0) { btnStart.innerText = "ادامه مسیر قبلی"; }
                }
            } catch (e) { console.error(e); }
        }

        function saveProgress() {
            localStorage.setItem('user_answers_v1', JSON.stringify(userAnswers));
            localStorage.setItem('current_index_v1', currentIndex);
        }

        function startApp() {
            document.getElementById('access-denied').style.display = 'none';
            intro.style.display = 'none';
            app.style.display = 'flex';
            if (tg.BackButton) {
                tg.BackButton.show();
                tg.BackButton.onClick(() => {
                    tg.showPopup({
                        title: 'توقف مسیر؟', message: 'پیشرفت شما محفوظ می‌ماند.',
                        buttons: [{id: 'yes', type: 'destructive', text: 'خروج'}, {id: 'no', type: 'cancel', text: 'ادامه'}]
                    }, (btnId) => { if (btnId === 'yes') tg.close(); });
                });
            }
            setTimeout(() => {
                app.style.opacity = '1'; app.style.transform = 'translateY(0)';
                renderQuestion(false);
            }, 100);
        }

        let isAnimating = false;
        function renderQuestion(animate = true) {
            if (currentIndex >= questionsDB.length) { finishQuiz(); return; }
            const q = questionsDB[currentIndex];
            const percent = ((currentIndex) / questionsDB.length) * 100;
            qNum.innerText = `${currentIndex + 1} / ${questionsDB.length}`;
            qText.innerText = q.text;
            progress.style.width = percent + '%';

            if (animate) {
                card.classList.remove('fade-out');
                card.classList.add('fade-in');
                setTimeout(() => card.classList.remove('fade-in'), 400);
            }
        }

        window.handleAnswer = function(score) {
            if (isAnimating) return;
            isAnimating = true;
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light'); 
            const currentQ = questionsDB[currentIndex];
            userAnswers[currentQ.key] = score;
            currentIndex++;
            saveProgress();
            
            card.classList.add('fade-out');
            setTimeout(() => {
                if (currentIndex >= questionsDB.length) { finishQuiz(); }
                else { renderQuestion(true); isAnimating = false; }
            }, 400); 
        };

        function finishQuiz() {
            progress.style.width = '100%'; qNum.innerText = '';
            document.getElementById('interaction-area').style.display = 'none';
            if(tg.BackButton) tg.BackButton.hide();
            card.classList.remove('fade-out');
            card.innerHTML = `
                <div style="font-size:60px; margin-bottom:20px; filter: grayscale(1);">✨</div>
                <h3 style="margin:10px 0 10px 0; color:var(--text-gold); font-weight:300;">پایان سفر</h3>
                <p style="font-size:14px; color:var(--text-secondary); margin-bottom:30px;">الگوهای شما ثبت شد.</p>
            `;
            tg.MainButton.text = "دریافت تحلیل نهایی";
            tg.MainButton.color = "#c5a059"; tg.MainButton.textColor = "#000000"; 
            tg.MainButton.show();
            tg.MainButton.onClick(sendDataSecure);
        }

        let isSubmitting = false; 
        async function sendDataSecure() {
            if (isSubmitting) return; 
            const initDataRaw = window.Telegram.WebApp.initData;
            if (!initDataRaw) { alert("خطا: احراز هویت انجام نشد."); return; }
            isSubmitting = true;
            document.getElementById('loading-overlay').style.display = 'flex';
            tg.MainButton.showProgress(true); tg.MainButton.disable();
            const payload = { init_data: initDataRaw, answers: userAnswers, timestamp: Math.floor(Date.now() / 1000) };
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 30000);
                const response = await fetch('https://self-production-1573.up.railway.app/receive-data', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload), signal: controller.signal
                });
                clearTimeout(timeoutId);
                if (response.ok) { tg.close(); }
                else {
                    if (response.status === 429) { alert("⏳ درخواست شما قبلا ثبت شده است. لطفاً ربات را چک کنید."); }
                    else { const err = await response.text(); alert("خطا: " + err); }
                    resetButtonState();
                }
            } catch (error) {
                if (error.name === 'AbortError') { alert("ارتباط با سرور زمان‌بر شد. لطفاً ربات را چک کنید."); }
                else { alert("خطای شبکه: " + error.message); }
                resetButtonState();
            }
        }

        function resetButtonState() {
            isSubmitting = false;
            document.getElementById('loading-overlay').style.display = 'none';
            tg.MainButton.hideProgress(); tg.MainButton.enable();
        }

        window.onload = function() {
            const isDebug = false; 
            if (isTelegram || isDebug) {
                document.getElementById('access-denied').style.display = 'none';
                intro.style.display = 'flex'; fetchQuestions();
            } else {
                document.getElementById('access-denied').style.display = 'flex';
                intro.style.display = 'none';
            }
        };
    </script>
</body>
</html>
