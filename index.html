                        let processedText = safeContent.replace(/\*\*(.*?)\*\*/g, '<span class="text-highlight">$1</span>');

                        // ۲. جداسازی هوشمند خطوط نقل‌قول پیش از تفکیک پاراگراف‌ها (برای جلوگیری از سقوط دیو داخل p)
                        // این رگکس مطمئن می‌شود اطراف خطوط > حتماً فضای خالی بلاک وجود دارد
                        let normalizedText = processedText
                            .replace(/(?:^|\n)(>[^\n]*)/g, '\n\n$1\n\n')
                            .replace(/\n\n\n+/g, '\n\n');

                        // ۳. شکستن متن به بلاک‌های مستقل
                        let paragraphs = normalizedText.split(/\n\n+/);

                        let formattedContent = paragraphs.map(para => {
                            para = para.trim();
                            if (!para) return '';

                            // الف) اگر بلاک با > شروع شده، آن را به باکس نقل‌قول (Soul Quote) تبدیل کن
                            if (para.startsWith('>')) {
                                let cleanQuote = para.replace(/^>\s*/mg, '').trim();
                                return `<div class="soul-quote">${cleanQuote.replace(/\n/g, '<br>')}</div>`;
                            }

                            // ب) اگر شامل بولت‌پوینت بود، به لیست تبدیلش کن
                            if (para.includes('\n- ') || para.startsWith('- ') || para.includes('\n* ') || para.startsWith('* ')) {
                                let lines = para.split('\n');
                                let listHtml = '<ul class="soul-list">';
                                let textBeforeList = '';

                                lines.forEach(line => {
                                    line = line.trim();
                                    if (line.startsWith('- ') || line.startsWith('* ')) {
                                        listHtml += `<li>${line.substring(2)}</li>`;
                                    } else if (line) {
                                        textBeforeList += `<p>${line.replace(/\n/g, '<br>')}</p>`;
                                    }
                                });
                                listHtml += '</ul>';
                                return textBeforeList + listHtml;
                            }

                            // ج) پاراگراف معمولی با مدیریت اینترهای داخلی
                            return `<p>${para.replace(/\n/g, '<br>')}</p>`;
                        }).join('');

                        const chapterBlock = meta.chapter ? `
                            <div class="story-chapter" style="color: var(--accent-sage); font-weight: 600; letter-spacing: 1px; margin-bottom: 8px;">
                                ${meta.chapter}
                            </div>
                        ` : "";

                        const whisperBlock = meta.whisper ? `
                            <div class="story-whisper-container" style="margin: 15px 0;">
                                <div class="story-divider" style="display: flex; align-items: center; justify-content: center; gap: 8px; opacity: 0.6;">
                                    <span style="height: 1px; width: 40px; background: linear-gradient(90deg, transparent, var(--accent-sage));"></span>
                                    <span style="color: var(--accent-sage); font-size: 12px;">✦</span>
                                    <span style="height: 1px; width: 40px; background: linear-gradient(-90deg, transparent, var(--accent-sage));"></span>
                                </div>
                                <div class="story-whisper" style="font-style: italic; font-size: 14px; color: rgba(255,255,255,0.7); margin-top: 10px; font-weight: 300;">
                                    ${meta.whisper}
                                </div>
                            </div>
                        ` : "";

                       slideDiv.innerHTML = `
                            <div class="glass-card" style="padding: 25px;">
                                <div class="card-ambient-glow"></div>

                                <div class="glass-card-content">
                                    <div class="sacred-wrapper" style="margin-bottom: 20px;">
                                        <div class="liquid-orb" style="box-shadow: 0 0 30px var(--accent-glow);"></div>
                                        <div class="sacred-geometry">
                                            <div class="geom-ring"></div>
                                            <div class="geom-ring" style="opacity: 0.6; transform: scale(0.85);"></div>
                                            <div class="geom-ring" style="opacity: 0.3; transform: scale(0.7);"></div>
                                        </div>
                                    </div>

                                    ${chapterBlock}

                                    <h2 class="typewriter-target" data-text="${cleanTitle}"
                                        style="text-align:center; margin:0 0 15px 0; font-size:24px; font-weight:700; background: linear-gradient(135deg, #FFFFFF 40%, var(--accent-sage) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height:1.5; position:relative; z-index:2; text-shadow: 0 4px 20px rgba(0,0,0,0.2);">
                                    </h2>

                                    <div style="width:40px; height:3px; background:linear-gradient(to right, transparent, var(--accent-sage), transparent); margin:0 auto 20px; border-radius: 2px; opacity:0.8;"></div>

                                    ${whisperBlock}

                                    <div class="story-content-wrapper paragraph-target" style="line-height: 1.8; font-size: 15px; color: rgba(255,255,255,0.85); font-weight: 300;">
                                        ${formattedContent}
                                    </div>
                                </div>
                            </div>
                        `;
                    }
                    slidesWrapper.appendChild(slideDiv);
                });




                container.style.display = 'flex';
                updateStoryUI();
            }

            function setAtmosphere(hex, rgb) {
                const root = document.documentElement;
                root.style.setProperty('--accent-sage', hex);
                // دادن عمق و حجم بیشتر به هاله‌های پس‌زمینه برای خروج از حالت تخت
                root.style.setProperty('--accent-glow', `rgba(${rgb}, 0.25)`);
                root.style.setProperty('--blob-1', `rgba(${rgb}, 0.20)`);
                root.style.setProperty('--blob-2', `rgba(${rgb}, 0.15)`);
                root.style.setProperty('--blob-3', `rgba(${rgb}, 0.10)`);
                // ایجاد یک گرادیانت نرم و درخشان برای کلمات کلیدی
                root.style.setProperty('--text-highlight-grad', `linear-gradient(135deg, #FFFFFF 15%, ${hex} 100%)`);
            }

           function applyMoodTheme(titleText) {
                // تغییر رنگ‌ها به کدهای زنده، عمیق و دارای کنتراست بالا روی پس‌زمینه تیره
                if (titleText.includes('قبل از اینکه شروع کنیم') || titleText.includes('چیزی که در ذهن تو پررنگ‌تر است') || titleText.includes('جایی برای مکث')) {
                    // آبی لاجوردی عمیق (حس شروع، آرامش و عمق)
                    setAtmosphere('#60A5FA', '96, 165, 250');
                }
                else if (titleText.includes('ذهن تو چطور کار می‌کند') || titleText.includes('تفاوتِ درون تو') || titleText.includes('لایه‌های عمیق‌تر')) {
                    // بنفش-نیلی (حس رمزآلود بودن و لایه‌های پنهان روان)
                    setAtmosphere('#A78BFA', '167, 139, 250');
                }
                else if (titleText.includes('زاویه‌ای که شاید کمتر دیده باشی') || titleText.includes('این الگو در یک آدم دیگر')) {
                    // سبز زمردی درخشان (حس کشف یک زاویه جدید و رشد)
                    setAtmosphere('#34D399', '52, 211, 153');
                }
                else if (titleText.includes('گره می‌خورد') || titleText.includes('فشار و تعادل') || titleText.includes('نشتیِ انرژی')) {
                    // نارنجی/آتشی ملایم (حس انرژی، تنش و چالش)
                    setAtmosphere('#FB923C', '251, 146, 60');
                }
                else {
                    // رنگ پایه: آبی فیروزه‌ای ملایم (زنده اما بالانس)
                    setAtmosphere('#38BDF8', '56, 189, 248');
                }
            }


            function updateStoryUI() {

                parsedSlides.forEach((_, index) => {
                    const slide = document.getElementById(`slide-${index}`);
                    const node = document.getElementById(`node-${index}`);
                    const link = document.getElementById(`link-${index}`);

                    if (index <= currentSlideIndex) {
                        node.classList.add('active');
                    } else {
                        node.classList.remove('active');
                    }

                    if (link) {
                        if (index < currentSlideIndex) {
                            link.classList.add('active');
                        } else {
                            link.classList.remove('active');
                        }
                    }

                    if (index < currentSlideIndex) {
                        slide.className = 'slide passed';
                    } else if (index === currentSlideIndex) {
                        slide.className = 'slide active';

                        applyMoodTheme(parsedSlides[currentSlideIndex].title, parsedSlides[currentSlideIndex].content);

                        const slideData = parsedSlides[currentSlideIndex];

                        if (slideData.isChart) {
                            setTimeout(() => {
                                drawSakinorvaChart('sakinorva-canvas', slideData.chartData);
                            }, 200);
                        } else {
                            // اگر اسلاید آخر (جهان درون شما) باشد و تیتر ثابت بخواهیم، نیازی به تایپ‌رایتر نیست
                            // اما برای حفظ ساختار قبلی شما این بخش را دست نزدیم تا مابقی اسلایدها درست کار کنند
                            const titleEl = slide.querySelector('.typewriter-target');
                            const pEl = slide.querySelector('.paragraph-target');

                            if (titleEl && pEl) {
                                pEl.classList.remove('blur-reveal');
                                pEl.style.opacity = '0';
                                titleEl.innerHTML = "";

                                setTimeout(() => {
                                    typeWriterEffect(titleEl, titleEl.getAttribute('data-text'), 40, () => {
                                        pEl.classList.add('blur-reveal');
                                    });
                                }, 350);
                            }
                        }
                    } else {
                        slide.className = 'slide';
                    }
                });

                // === بخش مدیریت دکمه‌های پایین که اصلاح شد ===
                const btnPrev = document.getElementById('btn-prev');
                const nextText = document.getElementById('next-btn-text');
                const nextIcon = document.querySelector('.next-btn svg');
                const navDivider = document.querySelector('.nav-divider');
                const navWrapper = document.querySelector('.smart-nav-wrapper'); // انتخاب کل نوار نویگیشن

                // مدیریت دکمه بازگشت به اسلاید قبلی
                if (currentSlideIndex > 0) {
                    if (btnPrev) btnPrev.style.display = 'flex';
                    if (navDivider) navDivider.style.display = 'block';
                } else {
                    if (btnPrev) btnPrev.style.display = 'none';
                    if (navDivider) navDivider.style.display = 'none';
                }

                // منطق جدید برای دکمه «ادامه / جهان درون شما» و مخفی کردن در اسلاید آخر
                if (currentSlideIndex === parsedSlides.length - 1) {
                    // ۱. اسلاید آخر: کل نوار دکمه‌ها مخفی شود تا تداخلی با دکمه طلایی ایجاد نکند
                    if (navWrapper) navWrapper.style.display = 'none';

                } else if (currentSlideIndex === parsedSlides.length - 2) {
                    // ۲. اسلاید یکی مانده به آخر: تغییر متن به سمت اسلاید هیجان‌انگیز
                    if (navWrapper) navWrapper.style.display = 'flex';
                    if (nextText) nextText.innerText = "جهان درون شما 🌗";
                    if (nextIcon) nextIcon.style.display = "none"; // مخفی کردن آیکون فلش برای تمیزی بیشتر

                } else {
                    // ۳. اسلایدهای عادی: نمایش حالت پیش‌فرض
                    if (navWrapper) navWrapper.style.display = 'flex';
                    if (nextText) nextText.innerText = "ادامه";
                    if (nextIcon) nextIcon.style.display = "block";
                }
            }


            function drawSakinorvaChart(canvasId, rawData) {
                const canvas = document.getElementById(canvasId);
                if (!canvas) return;
                const ctx = canvas.getContext('2d');

                const scores = rawData.function_scores || {};
                const data = {
                    'Ni': scores.ni || 0, 'Ne': scores.ne || 0,
                    'Fi': scores.fi || 0, 'Fe': scores.fe || 0,
                    'Ti': scores.ti || 0, 'Te': scores.te || 0,
                    'Si': scores.si || 0, 'Se': scores.se || 0
                };

                const labels = Object.keys(data);
                const values = Object.values(data);
                const numElements = labels.length;

                // تنظیم رزولوشن صفحه (Retina/DPR)
                const dpr = window.devicePixelRatio || 1;
                const rect = canvas.parentElement.getBoundingClientRect();
                canvas.width = rect.width * dpr;
                canvas.height = rect.height * dpr;
                ctx.scale(dpr, dpr);

                const width = rect.width;
                const height = rect.height;
                const centerX = width / 2;
                const centerY = height / 2;
                const maxRadius = Math.min(width, height) / 2 - 40;

                ctx.clearRect(0, 0, width, height);

                // رنگ اکسنت پروژه
                const accentColor = getComputedStyle(document.documentElement).getPropertyValue('--accent-sage').trim() || '#9DB39B';

                // ==========================================
                // ۱. دایره‌های راهنما (کاملاً محو و نازک)
                // ==========================================
                const levels = 4;
                ctx.lineWidth = 0.8; // بسیار ظریف
                for (let i = 1; i <= levels; i++) {
                    const radius = maxRadius * (i / levels);
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)'; // تقریبا نامرئی
                    ctx.stroke();
                }

                // ==========================================
                // ۲. محاسبه مختصات نقاط
                // ==========================================
                const maxValue = 50;
                const points = [];
                for (let i = 0; i < numElements; i++) {
                    const angle = (i * 2 * Math.PI) / numElements - Math.PI / 2;
                    const val = Math.min(Math.max(values[i], 0), maxValue);
                    const radius = maxRadius * (val / maxValue);
                    points.push({
                        x: centerX + radius * Math.cos(angle),
                        y: centerY + radius * Math.sin(angle),
                        val: values[i],
                        label: labels[i],
                        angle: angle
                    });
                }

                // محاسبه نقاط میانی (Midpoints) برای رسم منحنی‌های نرم
                const midpoints = [];
                for (let i = 0; i < numElements; i++) {
                    const nextIdx = (i + 1) % numElements;
                    midpoints.push({
                        x: (points[i].x + points[nextIdx].x) / 2,
                        y: (points[i].y + points[nextIdx].y) / 2
                    });
                }

                // ==========================================
                // ۳. رسم مساحت داخلی (Fill با آپاسیتی بسیار کم)
                // ==========================================
                ctx.beginPath();
                ctx.moveTo(midpoints[0].x, midpoints[0].y);
                for (let i = 0; i < numElements; i++) {
                    const nextIdx = (i + 1) % numElements;
                    ctx.quadraticCurveTo(points[nextIdx].x, points[nextIdx].y, midpoints[nextIdx].x, midpoints[nextIdx].y);
                }
                ctx.closePath();
                ctx.fillStyle = accentColor;
                ctx.globalAlpha = 0.04; // بسیار لایت و ملایم
                ctx.fill();
                ctx.globalAlpha = 1.0;

                // ==========================================
                // ۴. رسم خط منحنی ارگانیک با انتهای فید شده (Fade Layer)
                // ==========================================
                ctx.lineWidth = 1.8; // طبق استاندارد درخواستی شما

                // الف) رسم بخش اصلی منحنی (از کارکرد اول تا کارکرد ماقبل آخر)
                ctx.beginPath();
                ctx.moveTo(midpoints[0].x, midpoints[0].y);
                for (let i = 0; i < numElements - 1; i++) {
                    const nextIdx = (i + 1) % numElements;
                    ctx.quadraticCurveTo(points[nextIdx].x, points[nextIdx].y, midpoints[nextIdx].x, midpoints[nextIdx].y);
                }
                ctx.strokeStyle = accentColor;
                ctx.stroke();

                // ب) رسم آخرین سگمنت به صورت فید شده (حس عدم انسداد و زنده بودن نقشه)
                ctx.beginPath();
                ctx.moveTo(midpoints[numElements - 1].x, midpoints[numElements - 1].y);
                ctx.quadraticCurveTo(points[0].x, points[0].y, midpoints[0].x, midpoints[0].y);
                ctx.strokeStyle = accentColor;
                ctx.globalAlpha = 0.25; // فید ملایم به سمت نقطه‌ی آغازین
                ctx.stroke();
                ctx.globalAlpha = 1.0;

                // ==========================================
                // ۵. رسم نودها (حلقه اکسنت + نقطه داخلی سفید)
                // ==========================================
                points.forEach(p => {
                    // حلقه‌ی بیرونی
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 4.5, 0, Math.PI * 2);
                    ctx.strokeStyle = accentColor;
                    ctx.lineWidth = 1.2;
                    ctx.stroke();

                    // نقطه‌ی مرکزی
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 1.5, 0, Math.PI * 2);
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fill();
                });

                // ==========================================
                // ۶. لِیبل‌ها و مقادیر عددی (مینیمال و مینیاتوری)
                // ==========================================
                points.forEach((p) => {
                    const labelRadius = maxRadius + 26;
                    const lx = centerX + labelRadius * Math.cos(p.angle);
                    const ly = centerY + labelRadius * Math.sin(p.angle);

                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';

                    // عنوان کارکرد (مثل Ni)
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
                    ctx.font = '500 11px system-ui, -apple-system, sans-serif';
                    ctx.fillText(p.label, lx, ly - 7);

                    // امتیاز دقیق کارکرد (مثل 33.4)
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
                    ctx.font = '400 10px system-ui, -apple-system, sans-serif';
                    // نمایش امتیاز به صورت دسی‌مال تک‌رقمی جهت حس آرکایو و دقیق بودن
                    const displayVal = p.val.toFixed(1);
                    ctx.fillText(displayVal, lx, ly + 7);
                });

                // ==========================================
                // ۷. هسته مرکزی قطب‌نما (Serif Style)
                // ==========================================
                if (rawData.myers_type) {
                    // دایره‌ی بسیار نازک مرکزی
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, 34, 0, Math.PI * 2);
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
                    ctx.lineWidth = 0.8;
                    ctx.stroke();

                    // نگاشت تیپ‌ها به آرکتایپ‌های کلاسیک و اصیل (کتابی)
                    const archetypes = {
                        'INTJ': 'Architect', 'INFJ': 'Observer', 'INTP': 'Logician', 'INFP': 'Visionary',
                        'ENTJ': 'Commander', 'ENFJ': 'Catalyst', 'ENTP': 'Innovator', 'ENFP': 'Idealist',
                        'ISTJ': 'Inspector', 'ISFJ': 'Protector', 'ESTJ': 'Executive', 'ESFJ': 'Provider',
                        'ISTP': 'Virtuoso', 'ISFP': 'Composer', 'ESTP': 'Dynamo', 'ESFP': 'Performer'
                    };
                    const subtitle = archetypes[rawData.myers_type.toUpperCase()] || 'Reflection';

                    // رسم متن تیپ شخصیتی اصلی
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
                    ctx.font = '400 16px Georgia, Garamond, "Times New Roman", serif';
                    ctx.letterSpacing = "1.5px";
                    ctx.fillText(rawData.myers_type.toUpperCase(), centerX, centerY - 5);

                    // رسم زیرعنوان مفهومی (مثل Observer)
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                    ctx.font = 'italic 10px Georgia, Garamond, "Times New Roman", serif';
                    ctx.letterSpacing = "0.5px";
                    ctx.fillText(subtitle, centerX, centerY + 9);
                }
            }

            window.nextSlide = function() {
                if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

                if (currentSlideIndex < parsedSlides.length - 1) {
                    currentSlideIndex++;
                    updateStoryUI();
                } else {
                    tg.close();
                }
            }


            window.prevSlide = function() {
                if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');

                if (currentSlideIndex > 0) {
                    currentSlideIndex--;
                    updateStoryUI();
                }
            }


        </script>
