<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تحلیل شخصیت MBTI</title>
    <!-- تلگرام وب‌اپ -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- فونت وزیرمتن -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@200;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 🎨 پالت رنگی جدید: لوکس، سنگین، طوسی و طلایی مات */
            --bg-main: #121212;         /* سیاه دودی */
            --bg-card: #1e1e1e;         /* طوسی تیره مات */
            --border-color: #333333;    /* رنگ حاشیه ظریف */
            
            --text-primary: #e0e0e0;    /* سفید مات */
            --text-secondary: #a0a0a0;  /* طوسی روشن */
            --text-gold: #d4af37;       /* طلایی کلاسیک (برای تاکید) */
            
            --btn-base: #2c2c2c;        /* رنگ دکمه خاموش */
            --accent-glow: rgba(212, 175, 55, 0.15); /* هاله طلایی */
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html {
            font-family: 'Vazirmatn', sans-serif;
            background-color: var(--bg-main);
            /* یک گرادینت خیلی محو برای عمق دادن */
            background-image: radial-gradient(circle at top, #1a1a1a 0%, #121212 100%);
            color: var(--text-primary);
            margin: 0; padding: 0; 
            width: 100%; height: 100%;
            overflow: hidden; 
            overscroll-behavior: none; 
            position: fixed; 
            user-select: none;
        }

        /* ⛔ صفحه خطا */
        #access-denied {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-main); z-index: 10000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 40px;
            display: none; 
        }

        /* 🚀 صفحه شروع (Intro) - مینیمال */
        #intro-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-main); z-index: 500;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            padding: 30px; text-align: center;
            transition: opacity 0.8s ease-out;
        }
        
        .intro-visual { 
            font-size: 60px; margin-bottom: 20px; 
            filter: grayscale(100%) opacity(0.7); /* ایموجی سیاه و سفید */
            animation: pulse-slow 4s infinite;
        }
        
        .intro-h1 { 
            font-size: 28px; font-weight: 200; margin-bottom: 15px; 
            color: var(--text-gold); letter-spacing: 1px;
        }
        
        .intro-p { 
            color: var(--text-secondary); font-size: 14px; line-height: 1.9; 
            margin-bottom: 50px; max-width: 300px; font-weight: 300;
        }

        /* دکمه شروع: ساده، با حاشیه طلایی */
        .btn-start {
            background: transparent;
            color: var(--text-gold);
            border: 1px solid var(--text-gold);
            padding: 14px 50px;
            font-size: 16px; font-weight: 400; 
            border-radius: 50px;
            font-family: 'Vazirmatn'; cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }
        .btn-start:active { background: var(--accent-glow); transform: scale(0.98); }
        .btn-start:disabled { opacity: 0.3; border-color: #555; color: #555; }

        /* 📱 کانتینر اصلی */
        .app-layout {
            width: 100%; max-width: 500px; margin: 0 auto; height: 100%;
            display: none; flex-direction: column; padding: 20px 30px;
            opacity: 0; transform: translateY(10px); 
            transition: opacity 0.8s, transform 0.8s;
        }

        /* پروگرس بار: خطی باریک و طلایی در بالا */
        .progress-container {
            width: 100%; display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 30px; margin-top: 10px;
        }
        .q-counter { color: var(--text-secondary); font-size: 12px; font-weight: 300; letter-spacing: 1px; }
        
        .progress-track {
            flex-grow: 1; height: 2px; background: #333;
            margin-right: 15px; border-radius: 2px; position: relative;
        }
        .progress-glow {
            height: 100%; background: var(--text-gold);
            width: 0%; border-radius: 2px; transition: width 0.5s ease;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        /* کارت سوال: استایل سنگ مات */
        .card-stage { 
            flex-grow: 1; position: relative; perspective: 1000px; 
            display: flex; align-items: center; justify-content: center; 
        }
        
        .stone-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 40px 30px; border-radius: 4px; /* گوشه‌های کمتر گرد برای حس جدی‌تر */
            width: 100%; min-height: 240px;
            display: flex; flex-direction: column; align-items: center; text-align: center; justify-content: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            position: absolute; opacity: 1; transform: translateX(0);
            transition: all 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .q-text-content { 
            font-size: 20px; font-weight: 400; line-height: 1.8; color: var(--text-primary);
        }

        /* دکمه‌های پاسخ: دایره‌های تک‌رنگ با تغییر سایز */
        .interaction-area { margin-bottom: 40px; width: 100%; }
        .labels-row { 
            display: flex; justify-content: space-between; 
            color: var(--text-secondary); font-size: 12px; margin-bottom: 20px; padding: 0 10px; 
        }
        
        .options-grid {
            display: flex; justify-content: space-between; align-items: center;
            position: relative;
        }
        /* خط اتصال پشت دکمه‌ها */
        .options-grid::before {
            content: ''; position: absolute; left: 10px; right: 10px; top: 50%; height: 1px;
            background: #333; z-index: 0;
        }

        .circle-btn {
            background: var(--bg-main);
            border: 2px solid #444;
            border-radius: 50%; 
            cursor: pointer; z-index: 1;
            transition: all 0.2s ease-out;
            /* حذف عدد داخل دکمه برای مینیمال شدن */
            color: transparent; 
        }
        
        /* سایز دکمه‌ها بر اساس شدت موافقت */
        .circle-btn[data-val="1"] { width: 25px; height: 25px; } /* کوچک */
        .circle-btn[data-val="2"] { width: 35px; height: 35px; }
        .circle-btn[data-val="3"] { width: 45px; height: 45px; border-color: #666; } /* متوسط */
        .circle-btn[data-val="4"] { width: 55px; height: 55px; }
        .circle-btn[data-val="5"] { width: 65px; height: 65px; border-color: var(--text-gold); } /* بزرگ */

        .circle-btn:active { 
            background: var(--text-gold); 
            border-color: var(--text-gold);
            transform: scale(0.9);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
        }

        /* انیمیشن‌ها */
        .slide-out { opacity: 0; transform: translateX(-30px) scale(0.95); pointer-events: none; }
        .slide-in { animation: fadeMove 0.5s forwards; }
        @keyframes fadeMove {
            from { opacity: 0; transform: translateX(30px) scale(0.95); }
            to { opacity: 1; transform: translateX(0) scale(1); }
        }
        @keyframes pulse-slow { 
            0% { transform: scale(1); opacity: 0.7; } 
            50% { transform: scale(1.05); opacity: 1; } 
            100% { transform: scale(1); opacity: 0.7; } 
        }

        /* لایه لودینگ جدید */
        #loading-overlay {
            backdrop-filter: blur(15px); /* بلور زیاد برای محو کردن پشت */
            background: rgba(18, 18, 18, 0.85);
        }
        .brain-loader {
            font-size: 50px; 
            filter: grayscale(100%) drop-shadow(0 0 10px var(--text-gold)); /* مغز طلایی */
            animation: pulse-slow 2s infinite;
        }

    </style>
</head>
<body>
    <!-- 1. صفحه دسترسی غیرمجاز -->
    <div id="access-denied">
        <div style="font-size: 40px; margin-bottom: 20px; filter: grayscale(1);">🔒</div>
        <h2 style="font-weight: 300; color: var(--text-gold);">منطقه حفاظت شده</h2>
        <p style="color: var(--text-secondary);">دسترسی فقط از طریق تلگرام</p>
    </div>

    <!-- 2. صفحه شروع (Intro) -->
    <div id="intro-screen">
        <div class="intro-visual">🗝️</div> <!-- تغییر ایموجی به کلید/معما -->
        <h1 class="intro-h1">کاوشگرِ درون</h1>
        <p class="intro-p" id="intro-desc">در حال آماده‌سازی...</p>
        <button class="btn-start" id="btn-start" onclick="startApp()" disabled>L O A D I N G</button>
    </div>

    <!-- 3. محیط اصلی برنامه -->
    <div class="app-layout" id="app">
        <!-- پروگرس بار جدید -->
        <div class="progress-container">
            <div class="progress-track">
                <div class="progress-glow" id="progress"></div>
            </div>
            <div class="q-counter" id="q-num">1 / 60</div>
        </div>
        
        <div class="card-stage">
            <div class="stone-card" id="card">
                <div class="q-text-content" id="q-text">...</div>
            </div>
        </div>

        <div class="interaction-area" id="interaction-area">
            <div class="labels-row">
                <span>مخالف</span>
                <span>موافق</span>
            </div>
            <!-- دکمه‌ها بدون عدد (مینیمال) -->
            <div class="options-grid">
                <button class="circle-btn" data-val="1" onclick="handleAnswer(1)"></button>
                <button class="circle-btn" data-val="2" onclick="handleAnswer(2)"></button>
                <button class="circle-btn" data-val="3" onclick="handleAnswer(3)"></button>
                <button class="circle-btn" data-val="4" onclick="handleAnswer(4)"></button>
                <button class="circle-btn" data-val="5" onclick="handleAnswer(5)"></button>
            </div>
        </div>
    </div>

    <!-- 4. لایه لودینگ (کامل شده) -->
    <div id="loading-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2000; flex-direction: column; align-items: center; justify-content: center; text-align: center;">
        <div class="brain-loader">🧠</div>
        <h3 style="margin-top: 30px; color: var(--text-gold); font-weight: 300; letter-spacing: 1px;">تـحـلـیـل داده‌هـا</h3>
        <p style="color: var(--text-secondary); font-size: 13px; margin-top: 10px;">در حال ترسیم نقشه‌ی ذهن...</p>
    </div>

    <!-- 5. لاجیک (دست نخورده و فیکس شده) -->
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        tg.disableVerticalSwipes();
        
        // تنظیم رنگ هدر تلگرام برای هماهنگی با تم تیره
        if(tg.setHeaderColor) tg.setHeaderColor('#121212');
        if(tg.setBackgroundColor) tg.setBackgroundColor('#121212');
        
        const isTelegram = (tg.initData && tg.initData.length > 0) || (tg.platform && tg.platform !== 'unknown');
        
        let questionsDB = []; 
        let currentIndex = 0;
        let userAnswers = {};

        // DOM Elements
        const app = document.getElementById('app');
        const intro = document.getElementById('intro-screen');
        const card = document.getElementById('card');
        const qText = document.getElementById('q-text');
        const qNum = document.getElementById('q-num');
        const progress = document.getElementById('progress');
        const btnStart = document.getElementById('btn-start');
        const introDesc = document.getElementById('intro-desc');

        // Fetch Questions
        async function fetchQuestions() {
            try {
                const res = await fetch('questions.json?v=' + new Date().getTime());
                if (!res.ok) throw new Error("Network error");
                questionsDB = await res.json();
                
                btnStart.removeAttribute('disabled');
                btnStart.innerText = "ورود به ناخودآگاه"; // متن دکمه جدید
                introDesc.innerHTML = `${questionsDB.length} ایستگاه برای شناخت عمیق`;
                
                loadSavedAnswers();
            } catch (e) {
                console.error(e);
                btnStart.innerText = "خطا در ارتباط";
                introDesc.innerText = "امکان بارگذاری وجود ندارد.";
            }
        }

        function loadSavedAnswers() {
            try {
                const saved = localStorage.getItem('user_answers_v1');
                const savedIndex = localStorage.getItem('current_index_v1');
                const isSent = localStorage.getItem('data_sent_flag');
                
                if (saved && savedIndex && !isSent) {
                    userAnswers = JSON.parse(saved);
                    currentIndex = parseInt(savedIndex);
                    
                    if (currentIndex >= questionsDB.length) {
                        currentIndex = 0; userAnswers = {};
                    } else if (currentIndex > 0) {
                        btnStart.innerText = "ادامه مسیر قبلی";
                    }
                }
            } catch (e) { console.error(e); }
        }

        function saveProgress() {
            localStorage.setItem('user_answers_v1', JSON.stringify(userAnswers));
            localStorage.setItem('current_index_v1', currentIndex);
        }

        function startApp() {
            document.getElementById('access-denied').style.display = 'none';
            intro.style.display = 'none';
            app.style.display = 'flex';
            
            // Back Button Logic
            if (tg.BackButton) {
                tg.BackButton.show();
                tg.BackButton.onClick(() => {
                    tg.showPopup({
                        title: 'توقف مسیر؟',
                        message: 'پیشرفت شما محفوظ می‌ماند.',
                        buttons: [
                            {id: 'yes', type: 'destructive', text: 'خروج'},
                            {id: 'no', type: 'cancel', text: 'ادامه'}
                        ]
                    }, (btnId) => {
                        if (btnId === 'yes') tg.close();
                    });
                });
            }
            
            setTimeout(() => {
                app.style.opacity = '1';
                app.style.transform = 'translateY(0)';
                renderQuestion(false);
            }, 100);
        }

        let isAnimating = false;
        function renderQuestion(animate = true) {
            if (currentIndex >= questionsDB.length) {
                finishQuiz();
                return;
            }
            const q = questionsDB[currentIndex];
            const percent = ((currentIndex) / questionsDB.length) * 100;
            
            qNum.innerText = `${currentIndex + 1} / ${questionsDB.length}`;
            qText.innerText = q.text;
            progress.style.width = percent + '%';
            
            if (animate) {
                card.classList.remove('slide-out');
                card.classList.add('slide-in');
                setTimeout(() => card.classList.remove('slide-in'), 500);
            }
        }

        window.handleAnswer = function(score) {
            if (isAnimating) return;
            isAnimating = true;
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light'); // ویبره ملایم‌تر
            
            const currentQ = questionsDB[currentIndex];
            userAnswers[currentQ.key] = score;
            currentIndex++;
            saveProgress();
            
            card.classList.add('slide-out');
            setTimeout(() => {
                if (currentIndex >= questionsDB.length) {
                    finishQuiz();
                } else {
                    renderQuestion(true);
                    isAnimating = false;
                }
            }, 300);
        };

        function finishQuiz() {
            progress.style.width = '100%';
            qNum.innerText = '';
            document.getElementById('interaction-area').style.display = 'none';
            if(tg.BackButton) tg.BackButton.hide();
            
            // پایان شیک و ساده
            card.classList.remove('slide-out');
            card.innerHTML = `
                <div style="font-size:60px; margin-bottom:20px; filter: grayscale(1);">✨</div>
                <h3 style="margin:10px 0 10px 0; color:var(--text-gold); font-weight:300;">پایان سفر</h3>
                <p style="font-size:14px; color:var(--text-secondary); margin-bottom:30px;">الگوهای شما ثبت شد.</p>
            `;
            
            // تنظیم دکمه اصلی تلگرام
            tg.MainButton.text = "دریافت تحلیل نهایی";
            tg.MainButton.color = "#d4af37"; // رنگ طلایی
            tg.MainButton.textColor = "#000000"; // متن مشکی
            tg.MainButton.show();
            tg.MainButton.onClick(sendDataSecure);
        }

        let isSubmitting = false; 

        async function sendDataSecure() {
            if (isSubmitting) return; 
            
            const initDataRaw = window.Telegram.WebApp.initData;
            if (!initDataRaw) {
                alert("خطا: احراز هویت انجام نشد.");
                return;
            }

            isSubmitting = true;
            document.getElementById('loading-overlay').style.display = 'flex';
            tg.MainButton.showProgress(true); 
            tg.MainButton.disable();

            const payload = {
                init_data: initDataRaw,
                answers: userAnswers,
                timestamp: Math.floor(Date.now() / 1000)
            };

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 15000);

                const response = await fetch('https://self-production-1573.up.railway.app/receive-data', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);

                if (response.ok) {
                    tg.close();
                } else {
                    if (response.status === 429) {
                        alert("⏳ لطفاً کمی صبر کنید، ترافیک بالاست.");
                    } else {
                        const err = await response.text();
                        alert("خطا: " + err);
                    }
                    resetButtonState();
                }
            } catch (error) {
                if (error.name === 'AbortError') {
                     alert("زمان پاسخگویی طولانی شد. نت بررسی شود.");
                } else {
                     alert("خطای شبکه: " + error.message);
                }
                resetButtonState();
            }
        }

        function resetButtonState() {
            isSubmitting = false;
            document.getElementById('loading-overlay').style.display = 'none';
            tg.MainButton.hideProgress();
            tg.MainButton.enable();
        }

        window.onload = function() {
            // برای تست: true کنید تا روی مرورگر ببینید
            const isDebug = false; 
            
            if (isTelegram || isDebug) {
                document.getElementById('access-denied').style.display = 'none';
                intro.style.display = 'flex';
                fetchQuestions();
            } else {
                document.getElementById('access-denied').style.display = 'flex';
                intro.style.display = 'none';
            }
        };
    </script>
</body>
</html>
