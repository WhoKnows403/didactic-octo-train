<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تحلیل شخصیت MBTI</title>
    <!-- تلگرام وب‌اپ -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- فونت وزیرمتن -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-gradient: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4c1d95 100%);
            --card-glass: rgba(30, 41, 59, 0.7);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --accent: #818cf8;
            --success: #34d399;
            --danger: #f87171;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html {
            font-family: 'Vazirmatn', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0; padding: 0; 
            width: 100%; height: 100%;
            overflow: hidden; /* جلوگیری از اسکرول اضافه */
            overscroll-behavior: none; /* فیکس iOS Rubber Band */
            position: fixed; /* قفل کامل صفحه */
            user-select: none;
        }

        /* ⛔ صفحه خطا */
        #access-denied {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-dark); z-index: 10000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 40px;
            display: none; 
        }
        .lock-icon { font-size: 60px; margin-bottom: 20px; filter: drop-shadow(0 0 10px rgba(248, 113, 113, 0.5)); }

        /* 🚀 صفحه شروع */
        #intro-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-gradient); z-index: 500;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            padding: 30px; text-align: center;
            transition: opacity 0.6s ease-out;
        }
        .intro-visual { font-size: 80px; margin-bottom: 10px; animation: float 3s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        
        .intro-h1 { font-size: 32px; font-weight: 800; margin-bottom: 10px; letter-spacing: -1px; }
        .intro-p { color: var(--text-muted); font-size: 16px; line-height: 1.8; margin-bottom: 40px; max-width: 320px; }
        
        .btn-start {
            background: linear-gradient(90deg, #6366f1, #8b5cf6);
            color: white; border: none; padding: 18px 60px;
            font-size: 18px; font-weight: 700; border-radius: 20px;
            font-family: 'Vazirmatn'; cursor: pointer;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-start:active { transform: scale(0.95); }
        .btn-start:disabled { opacity: 0.7; cursor: wait; filter: grayscale(1); }

        /* 📱 کانتینر اصلی */
        .app-layout {
            width: 100%; max-width: 500px; margin: 0 auto; height: 100%;
            display: none; flex-direction: column; padding: 24px;
            opacity: 0; transform: translateY(20px); transition: opacity 0.6s, transform 0.6s;
        }
        .progress-track {
            width: 100%; height: 6px; background: rgba(255,255,255,0.1);
            border-radius: 10px; margin-top: 10px; margin-bottom: 40px; overflow: hidden;
        }
        .progress-glow {
            height: 100%; background: linear-gradient(90deg, #34d399, #6366f1);
            width: 0%; border-radius: 10px; transition: width 0.4s ease;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.5);
        }
        .card-stage { flex-grow: 1; position: relative; perspective: 1000px; display: flex; align-items: center; justify-content: center; }
        
        .glass-card {
            background: var(--card-glass);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 35px 25px; border-radius: 30px;
            width: 100%; min-height: 260px;
            display: flex; flex-direction: column; align-items: center; text-align: center; justify-content: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.25);
            position: absolute; opacity: 1; transform: translateX(0);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        
        .q-badge { background: rgba(129, 140, 248, 0.15); color: var(--accent); font-size: 13px; font-weight: 700; padding: 6px 16px; border-radius: 12px; margin-bottom: 25px; }
        .q-text-content { font-size: 20px; font-weight: 600; line-height: 1.6; }
        
        .interaction-area { margin-bottom: 20px; }
        .labels-row { display: flex; justify-content: space-between; color: var(--text-muted); font-size: 13px; margin-bottom: 15px; padding: 0 15px; font-weight: 500; }
        .options-grid {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(15, 23, 42, 0.5); padding: 15px 20px; border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .circle-btn {
            width: 48px; height: 48px; border-radius: 50%; border: none;
            cursor: pointer; font-family: 'Vazirmatn'; font-weight: 700; font-size: 16px;
            display: flex; justify-content: center; align-items: center;
            transition: all 0.25s; color: white; position: relative; overflow: hidden;
        }
        .circle-btn[data-val="1"] { background: #ef4444; width: 40px; height: 40px; opacity: 0.9; }
        .circle-btn[data-val="2"] { background: #f87171; width: 44px; height: 44px; opacity: 0.7; }
        .circle-btn[data-val="3"] { background: #475569; width: 46px; height: 46px; opacity: 0.5; }
        .circle-btn[data-val="4"] { background: #34d399; width: 44px; height: 44px; opacity: 0.7; }
        .circle-btn[data-val="5"] { background: #10b981; width: 40px; height: 40px; opacity: 0.9; }
        .circle-btn:active { transform: scale(1.2); opacity: 1; filter: brightness(1.2); }
        
        .finish-anim { font-size: 80px; margin-bottom: 20px; animation: popUp 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55); }
        @keyframes popUp { 0% { transform: scale(0); } 100% { transform: scale(1); } }
    </style>
</head>
<body>
    <div id="access-denied">
        <div class="lock-icon">🔒</div>
        <h2>دسترسی غیرمجاز</h2>
        <p>لطفاً فقط از طریق تلگرام وارد شوید.</p>
    </div>

    <div id="intro-screen">
        <div class="intro-visual">🔮</div>
        <h1 class="intro-h1">کاوشگر درون</h1>
        <p class="intro-p" id="intro-desc">آزمون پیشرفته تحلیل شخصیت.<br>در حال آماده‌سازی...</p>
        <button class="btn-start" id="btn-start" onclick="startApp()" disabled>درحال بارگذاری...</button>
    </div>

    <div class="app-layout" id="app">
        <div class="progress-track">
            <div class="progress-glow" id="progress"></div>
        </div>
        
        <div class="card-stage">
            <div class="glass-card" id="card">
                <div class="q-badge" id="q-num">سوال ۱</div>
                <div class="q-text-content" id="q-text">...</div>
            </div>
        </div>

        <div class="interaction-area" id="interaction-area">
            <div class="labels-row">
                <span>اصلاً موافق نیستم</span>
                <span>کاملاً موافقم</span>
            </div>
            <div class="options-grid">
                <button class="circle-btn" data-val="1" onclick="handleAnswer(1)">1</button>
                <button class="circle-btn" data-val="2" onclick="handleAnswer(2)">2</button>
                <button class="circle-btn" data-val="3" onclick="handleAnswer(3)">3</button>
                <button class="circle-btn" data-val="4" onclick="handleAnswer(4)">4</button>
                <button class="circle-btn" data-val="5" onclick="handleAnswer(5)">5</button>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        
        // 🛠️ فیکس ۱: جلوگیری از بستن برنامه هنگام کشیدن صفحه به پایین
        tg.expand();
        tg.disableVerticalSwipes(); // اگر متدش در نسخه جدید باشه عمل میکنه
        
        const isTelegram = (tg.initData && tg.initData.length > 0) || (tg.platform && tg.platform !== 'unknown');
        
        // 🛠️ فیکس ۲: دیتابیس خالی برای لود داینامیک
        let questionsDB = []; 
        let currentIndex = 0;
        let userAnswers = {};

        // المان‌های DOM
        const app = document.getElementById('app');
        const intro = document.getElementById('intro-screen');
        const card = document.getElementById('card');
        const qText = document.getElementById('q-text');
        const qNum = document.getElementById('q-num');
        const progress = document.getElementById('progress');
        const btnStart = document.getElementById('btn-start');
        const introDesc = document.getElementById('intro-desc');

        // 🛠️ فیکس ۳: لود کردن سوالات از فایل JSON
        async function fetchQuestions() {
            try {
                // پارامتر v برای جلوگیری از کش شدن سوالات قدیمی
                const res = await fetch('questions.json?v=' + new Date().getTime());
                if (!res.ok) throw new Error("Network error");
                questionsDB = await res.json();
                
                // فعال کردن دکمه شروع
                btnStart.removeAttribute('disabled');
                btnStart.innerText = "شروع سفر";
                introDesc.innerHTML = `آزمون پیشرفته تحلیل شخصیت.<br>${questionsDB.length} سوال برای شناخت عمیق.`;
                
                // اگر قبلا دیتایی بوده، لود کن
                loadSavedAnswers();

            } catch (e) {
                console.error(e);
                btnStart.innerText = "خطا در بارگذاری";
                introDesc.innerText = "⚠️ امکان دریافت سوالات وجود ندارد.\nلطفاً اینترنت خود را چک کنید.";
            }
        }

        function loadSavedAnswers() {
            try {
                const saved = localStorage.getItem('user_answers_v1');
                const savedIndex = localStorage.getItem('current_index_v1');
                
                // اگر کاربر قبلا تموم کرده و ارسال کرده، از اول شروع کن (ریست)
                const isSent = localStorage.getItem('data_sent_flag');

                if (saved && savedIndex && !isSent) {
                    userAnswers = JSON.parse(saved);
                    currentIndex = parseInt(savedIndex);
                    
                    // اگر ایندکس خراب بود ریست کن
                    if (currentIndex >= questionsDB.length) {
                        currentIndex = 0;
                        userAnswers = {};
                    } else if (currentIndex > 0) {
                        btnStart.innerText = "ادامه آزمون قبلی";
                    }
                }
            } catch (e) {
                console.error("Save Load Error", e);
            }
        }

        function saveProgress() {
            localStorage.setItem('user_answers_v1', JSON.stringify(userAnswers));
            localStorage.setItem('current_index_v1', currentIndex);
        }

        function startApp() {
            document.getElementById('access-denied').style.display = 'none';
            intro.style.display = 'none';
            app.style.display = 'flex';

            // 🛠️ فیکس ۴: مدیریت دکمه بازگشت (جلوگیری از خروج تصادفی)
            if (tg.BackButton) {
                tg.BackButton.show();
                tg.BackButton.onClick(() => {
                    tg.showPopup({
                        title: 'خروج؟',
                        message: 'آیا می‌خواهید آزمون را موقتاً رها کنید؟ پیشرفت شما ذخیره می‌ماند.',
                        buttons: [
                            {id: 'yes', type: 'destructive', text: 'بله، خروج'},
                            {id: 'no', type: 'cancel', text: 'ادامه میدم'}
                        ]
                    }, (btnId) => {
                        if (btnId === 'yes') {
                            tg.close();
                        }
                    });
                });
            }

            setTimeout(() => {
                app.style.opacity = '1';
                app.style.transform = 'translateY(0)';
                renderQuestion(false);
            }, 100);
        }

        let isAnimating = false;

        function renderQuestion(animate = true) {
            if (currentIndex >= questionsDB.length) {
                finishQuiz();
                return;
            }

            const q = questionsDB[currentIndex];
            const percent = ((currentIndex) / questionsDB.length) * 100;

            qNum.innerText = `${currentIndex + 1} / ${questionsDB.length}`;
            qText.innerText = q.text;
            progress.style.width = percent + '%';

            if (animate) {
                card.classList.remove('slide-out');
                card.classList.add('slide-in');
                setTimeout(() => card.classList.remove('slide-in'), 300);
            }
        }

        window.handleAnswer = function(score) {
            if (isAnimating) return;
            isAnimating = true;

            if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();

            const currentQ = questionsDB[currentIndex];
            userAnswers[currentQ.key] = score;

            currentIndex++;
            saveProgress();

            card.classList.add('slide-out');

            setTimeout(() => {
                if (currentIndex >= questionsDB.length) {
                    finishQuiz();
                } else {
                    renderQuestion(true);
                    isAnimating = false;
                }
            }, 300);
        };

        function finishQuiz() {
            progress.style.width = '100%';
            qNum.innerText = 'پایان';
            document.getElementById('interaction-area').style.display = 'none';
            
            // غیرفعال کردن دکمه بک در صفحه پایان
            if(tg.BackButton) tg.BackButton.hide();

            card.classList.remove('slide-out');
            card.innerHTML = `
                <div class="finish-anim">🎉</div>
                <h3 style="margin:10px 0 5px 0">تبریک!</h3>
                <p style="font-size:16px; margin-bottom:20px;">پاسخ‌های شما با موفقیت ثبت شد.</p>
                <p style="font-size:14px; color:var(--text-muted);">برای دریافت تحلیل، دکمه زیر را بزنید.</p>
            `;

            tg.MainButton.text = "دریافت تحلیل شخصیت 🧠";
            tg.MainButton.color = "#34d399";
            tg.MainButton.textColor = "#ffffff";
            tg.MainButton.show();
            tg.MainButton.onClick(sendDataSecure);
        }

        let isSubmitting = false;

        async function sendDataSecure() {
            const payload = {
                user_id: tg.initDataUnsafe.user.id,
                chat_id: tg.initDataUnsafe.user.id,
                answers: userAnswers, // همون متغیری که جواب‌ها توشه
                timestamp: Math.floor(Date.now() / 1000)
            };
        
            try {
                // به جای آدرس زیر، آدرس سرور یا IP خودت رو بذار
                const response = await fetch('https://opt-ton-apparent-ebook.trycloudflare.com/receive-data', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
        
                if (response.ok) {
                    tg.close(); // وب‌اپ رو ببند
                } else {
                    alert("ارسال با خطا مواجه شد.");
                }
            } catch (error) {
                alert("خطا در شبکه: " + error.message);
            }
        }

        // نقطه شروع
        window.onload = function() {
            const isDebug = false; // برای تست روی مرورگر true کنید
            if (isTelegram || isDebug) {
                document.getElementById('access-denied').style.display = 'none';
                intro.style.display = 'flex';
                // لود کردن سوالات
                fetchQuestions();
            } else {
                document.getElementById('access-denied').style.display = 'flex';
                intro.style.display = 'none';
            }
        };
    </script>
</body>
</html>
