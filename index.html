<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تحلیل شخصیت MBTI</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@200;300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 🎨 پالت رنگی اصلاح شده: لوکس، تاریک، مرموز */
            --bg-main: #050505;         /* سیاه مطلق نزدیک به زغال */
            --bg-card: rgba(20, 20, 20, 0.8); /* شیشه‌ای دودی */
            --border-color: #333333;    
            --text-primary: #e0e0e0;    
            --text-secondary: #888888;  
            --text-gold: #d4af37;       /* طلایی واقعی */
            
            /* رنگ دکمه‌ها (اصلاح شده) */
            --btn-disagree: #1a1a1a;    /* تقریبا نامرئی/تاریک */
            --btn-neutral: #2d2d2d;     /* خاکستری خنثی */
            --btn-agree: #d4af37;       /* طلایی درخشان */
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        
        body, html {
            font-family: 'Vazirmatn', sans-serif;
            background-color: var(--bg-main);
            /* ساخت اتمسفر با گرادینت شعاعی: مرکز روشن‌تر، گوشه‌ها تاریک */
            background-image: 
                radial-gradient(circle at 50% 30%, #1a1a1a 0%, #000000 80%),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
            color: var(--text-primary);
            margin: 0; padding: 0; 
            width: 100%; height: 100%;
            overflow: hidden; 
            overscroll-behavior: none; 
            position: fixed; 
            user-select: none;
        }

        /* 💡 کانتینر لامپ و نور */
        .lamp-wrapper {
            position: fixed; top: -20px; left: 50%;
            transform: translateX(-50%); z-index: 20;
            display: flex; flex-direction: column; align-items: center;
            /* انیمیشن تاب خوردن آرام */
            animation: swing 6s ease-in-out infinite alternate;
            transform-origin: top center;
            pointer-events: none;
        }

        /* سیم بلند */
        .lamp-wire {
            width: 2px; height: 100px; 
            background: linear-gradient(to bottom, #111, #333);
        }

        /* حباب/کلاهک لامپ (طرح صنعتی انگلیسی) */
        .lamp-head {
            position: relative;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.8));
        }

        /* نور حجمی (Volumetric Light Beam) */
        /* این اون حاله ای هست که گفتی میخوای دیده بشه */
        .light-beam {
            position: absolute;
            top: 90px; /* شروع از زیر لامپ */
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 600px;
            background: radial-gradient(ellipse at top, rgba(212, 175, 55, 0.15) 0%, rgba(0,0,0,0) 70%);
            clip-path: polygon(40% 0%, 60% 0%, 100% 100%, 0% 100%);
            pointer-events: none;
            z-index: 1;
            mix-blend-mode: screen;
            animation: flicker 4s infinite alternate;
        }

        @keyframes swing {
            from { transform: translateX(-50%) rotate(2deg); }
            to { transform: translateX(-50%) rotate(-2deg); }
        }

        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
            55% { opacity: 0.9; }
            90% { opacity: 0.85; }
        }

        /* ✨ ذرات معلق (غبار توی نور) */
        .dust-particle {
            position: fixed; background: #c5a059;
            border-radius: 50%; pointer-events: none;
            animation: float-dust linear infinite;
            box-shadow: 0 0 4px #c5a059;
        }
        .dust-1 { width: 2px; height: 2px; top: 40%; left: 30%; animation-duration: 15s; opacity: 0.3; }
        .dust-2 { width: 1px; height: 1px; top: 50%; left: 60%; animation-duration: 25s; opacity: 0.5; }
        .dust-3 { width: 3px; height: 3px; top: 35%; left: 45%; animation-duration: 20s; opacity: 0.2; }
        
        @keyframes float-dust {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            50% { opacity: 0.6; }
            100% { transform: translateY(-60px) translateX(20px); opacity: 0; }
        }

        /* 🚀 صفحات */
        #access-denied, #intro-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-main); z-index: 500;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            padding: 30px; text-align: center;
        }
        
        .intro-visual { 
            font-size: 60px; margin-bottom: 20px; 
            filter: grayscale(100%) opacity(0.8) drop-shadow(0 0 15px rgba(212, 175, 55, 0.2));
            animation: breathe 4s infinite;
        }
        .intro-h1 { 
            font-size: 26px; font-weight: 300; margin-bottom: 10px; 
            color: var(--text-gold); letter-spacing: 0.5px;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }
        .intro-p { 
            color: var(--text-secondary); font-size: 14px; margin-bottom: 50px; 
            max-width: 280px; font-weight: 300; line-height: 1.8;
        }
        .btn-start {
            background: rgba(212, 175, 55, 0.05); color: var(--text-gold);
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 14px 50px; font-size: 15px; border-radius: 50px;
            font-family: 'Vazirmatn'; cursor: pointer; transition: all 0.3s;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        .btn-start:active { background: rgba(212, 175, 55, 0.2); transform: scale(0.98); }

        /* 📱 کانتینر اصلی */
        .app-layout {
            width: 100%; max-width: 480px; margin: 0 auto; height: 100%;
            display: none; flex-direction: column; padding: 20px 25px;
            opacity: 0; transform: translateY(10px); transition: opacity 0.8s;
            position: relative; z-index: 5; /* زیر نور ولی روی بکگراند */
        }

        .progress-container {
            width: 100%; display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 25px; margin-top: 80px; /* فضای بیشتر برای نور */
        }
        .q-counter { color: #555; font-size: 12px; font-family: monospace; }
        .progress-track {
            flex-grow: 1; height: 2px; background: #222;
            margin-right: 15px; position: relative; border-radius: 2px; overflow: hidden;
        }
        .progress-glow {
            height: 100%; background: var(--text-gold); width: 0%; 
            transition: width 0.5s ease; box-shadow: 0 0 8px var(--text-gold);
        }

        /* 🎴 کارت سوال - استایل شیشه‌ای */
        .card-stage { 
            flex-grow: 1; position: relative; display: flex; 
            align-items: center; justify-content: center; 
        }
        .stone-card {
            /* افکت شیشه‌ای مات */
            background: var(--bg-card);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top: 1px solid rgba(255, 255, 255, 0.15); 
            padding: 30px 25px; border-radius: 16px; width: 100%; min-height: 220px;
            display: flex; flex-direction: column; align-items: center; 
            text-align: center; justify-content: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,0,0,0.5);
            position: absolute; opacity: 1; 
        }
        .q-text-content { 
            font-size: 19px; font-weight: 300; line-height: 1.9; color: #ececec;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        /* 🔘 دکمه‌ها و تعامل */
        .interaction-area { margin-bottom: 40px; width: 100%; }
        .labels-row { 
            display: flex; justify-content: space-between; 
            color: #444; font-size: 11px; margin-bottom: 20px; padding: 0 10px; 
            text-transform: uppercase; letter-spacing: 1px;
        }
        
        .options-grid {
            display: flex; justify-content: space-between; align-items: center;
            position: relative; padding: 0 10px;
        }
        /* خط راهنما پشت دکمه ها */
        .options-grid::before {
            content: ''; position: absolute; left: 20px; right: 20px; top: 50%; height: 1px;
            background: linear-gradient(to left, transparent, #222, transparent); z-index: 0;
        }

        .circle-btn {
            border: none; border-radius: 50%; 
            cursor: pointer; z-index: 2; position: relative;
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            color: transparent; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        
        /* استایل جدید دکمه‌ها */
        /* مخالف (چپ) - تیره و خاموش */
        .circle-btn[data-val="1"] { 
            width: 38px; height: 38px; 
            background: var(--btn-disagree); 
            border: 1px solid #333;
        }
        .circle-btn[data-val="2"] { 
            width: 46px; height: 46px; 
            background: var(--btn-disagree); 
            opacity: 0.8; 
            border: 1px solid #333;
        }
        /* خنثی */
        .circle-btn[data-val="3"] { 
            width: 50px; height: 50px; 
            background: var(--btn-neutral); 
            border: 2px solid #222;
        }
        /* موافق (راست) - طلایی و درخشان */
        .circle-btn[data-val="4"] { 
            width: 58px; height: 58px; 
            background: var(--btn-agree); 
            opacity: 0.7; 
        }
        .circle-btn[data-val="5"] { 
            width: 70px; height: 70px; 
            background: radial-gradient(circle at 30% 30%, #ebd392, #c5a059); 
            box-shadow: 0 0 20px rgba(197, 160, 89, 0.3), inset 0 2px 5px rgba(255,255,255,0.4);
            border: none;
        }

        .circle-btn:active { transform: scale(0.9); filter: brightness(1.2); }

        /* انیمیشن‌ها */
        .fade-out { animation: dissolveOut 0.4s forwards; }
        .fade-in { animation: dissolveIn 0.4s forwards; }
        @keyframes dissolveOut { to { opacity: 0; transform: scale(0.95) translateY(-10px); } }
        @keyframes dissolveIn { from { opacity: 0; transform: scale(1.05) translateY(10px); } to { opacity: 1; transform: scale(1); } }
        @keyframes breathe { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }

        /* 🧠 لایه لودینگ */
        #loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2000;
            background: rgba(5, 5, 5, 0.98); 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center;
        }
        .brain-loader {
            font-size: 50px; filter: grayscale(100%) drop-shadow(0 0 15px var(--text-gold)); 
            animation: breathe 1.5s infinite;
        }
        .loading-bar-container {
            width: 140px; height: 2px; background: #222; 
            margin-top: 30px; overflow: hidden; position: relative;
        }
        .loading-bar-fill {
            position: absolute; top: 0; left: 0; bottom: 0; background: var(--text-gold);
            width: 50%; animation: indeterminate 1.5s infinite ease-in-out;
            box-shadow: 0 0 10px var(--text-gold);
        }
        @keyframes indeterminate {
            0% { left: -50%; width: 30%; } 50% { left: 20%; width: 80%; } 100% { left: 100%; width: 30%; }
        }
    </style>
</head>
<body>

    <!-- 💡 لامپ ادیسونی آویز کلاسیک -->
    <div class="lamp-wrapper">
        <div class="lamp-wire"></div>
        <!-- نور حجمی (هاله) -->
        <div class="light-beam"></div>
        <!-- بدنه لامپ مشکی کلاسیک -->
        <svg class="lamp-head" width="80" height="90" viewBox="0 0 80 90" xmlns="http://www.w3.org/2000/svg">
            <!-- کلاهک فلزی مشکی -->
            <path d="M20 30 L 10 60 L 70 60 L 60 30 Z" fill="#111" stroke="#333" stroke-width="1"/>
            <rect x="30" y="0" width="20" height="30" fill="#151515" rx="2" />
            <!-- حباب داخلی -->
            <path d="M25 60 Q 25 85, 40 85 Q 55 85, 55 60 Z" fill="url(#glowGradient)" />
            <!-- فیلامنت -->
            <path d="M35 65 L 35 75 L 45 75 L 45 65" stroke="#ffaa00" fill="none" stroke-width="1.5" opacity="0.9"/>
            
            <defs>
                <radialGradient id="glowGradient" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" style="stop-color:rgba(255, 240, 200, 0.9); stop-opacity:1" />
                    <stop offset="80%" style="stop-color:rgba(255, 200, 50, 0.2); stop-opacity:1" />
                    <stop offset="100%" style="stop-color:rgba(0,0,0,0); stop-opacity:1" />
                </radialGradient>
            </defs>
        </svg>
    </div>

    <div class="dust-particle dust-1"></div>
    <div class="dust-particle dust-2"></div>
    <div class="dust-particle dust-3"></div>

    <div id="access-denied">
        <h2 style="color: var(--text-gold); font-weight: 300;">دسترسی غیرمجاز</h2>
    </div>

    <div id="intro-screen">
        <div class="intro-visual">🗝️</div>
        <h1 class="intro-h1">کاوشگرِ درون</h1>
        <p class="intro-p" id="intro-desc">در حال بارگذاری...</p>
        <button class="btn-start" id="btn-start" onclick="startApp()" disabled>L O A D I N G</button>
    </div>

    <div class="app-layout" id="app">
        <div class="progress-container">
            <div class="progress-track">
                <div class="progress-glow" id="progress"></div>
            </div>
            <div class="q-counter" id="q-num">1 / 60</div>
        </div>
        
        <div class="card-stage">
            <div class="stone-card" id="card">
                <div class="q-text-content" id="q-text">...</div>
            </div>
        </div>

        <div class="interaction-area" id="interaction-area">
            <div class="labels-row">
                <span>مخالفم</span>
                <span>موافقم</span>
            </div>
            <div class="options-grid">
                <!-- دکمه‌ها با رنگ‌بندی جدید -->
                <button class="circle-btn" data-val="1" onclick="handleAnswer(1)"></button>
                <button class="circle-btn" data-val="2" onclick="handleAnswer(2)"></button>
                <button class="circle-btn" data-val="3" onclick="handleAnswer(3)"></button>
                <button class="circle-btn" data-val="4" onclick="handleAnswer(4)"></button>
                <button class="circle-btn" data-val="5" onclick="handleAnswer(5)"></button>
            </div>
        </div>
    </div>

    <div id="loading-overlay" style="display: none;">
        <div class="brain-loader">🧠</div>
        <h3 style="margin-top: 25px; color: var(--text-gold); font-weight: 300; letter-spacing: 1px; font-size: 16px;">تـحـلـیـل داده‌هـا</h3>
        <p style="color: var(--text-secondary); font-size: 12px; margin-top: 5px;">در حال ترسیم نقشه‌ی ذهن...</p>
        <div class="loading-bar-container">
            <div class="loading-bar-fill"></div>
        </div>
    </div>

    <script>
        // ✅ لاجیک اصلی (دقیقاً همان معماری و کد قبلی بدون تغییر منطقی)
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand(); tg.disableVerticalSwipes();
        if(tg.setHeaderColor) tg.setHeaderColor('#050505'); // هماهنگ با رنگ جدید
        if(tg.setBackgroundColor) tg.setBackgroundColor('#050505');
        
        const isTelegram = (tg.initData && tg.initData.length > 0) || (tg.platform && tg.platform !== 'unknown');
        
        let questionsDB = []; let currentIndex = 0; let userAnswers = {};
        const app = document.getElementById('app');
        const intro = document.getElementById('intro-screen');
        const card = document.getElementById('card');
        const qText = document.getElementById('q-text');
        const qNum = document.getElementById('q-num');
        const progress = document.getElementById('progress');
        const btnStart = document.getElementById('btn-start');
        const introDesc = document.getElementById('intro-desc');

        async function fetchQuestions() {
            try {
                // کش باستر برای اطمینان از لود سوالات جدید
                const res = await fetch('questions.json?v=' + new Date().getTime());
                if (!res.ok) throw new Error("Network error");
                questionsDB = await res.json();
                btnStart.removeAttribute('disabled');
                btnStart.innerText = "ورود به ناخودآگاه"; 
                introDesc.innerHTML = `${questionsDB.length} ایستگاه برای شناخت عمیق`;
                loadSavedAnswers();
            } catch (e) {
                console.error(e);
                btnStart.innerText = "خطا در ارتباط";
                introDesc.innerText = "امکان بارگذاری وجود ندارد.";
            }
        }

        function loadSavedAnswers() {
            try {
                const saved = localStorage.getItem('user_answers_v1');
                const savedIndex = localStorage.getItem('current_index_v1');
                const isSent = localStorage.getItem('data_sent_flag');
                if (saved && savedIndex && !isSent) {
                    userAnswers = JSON.parse(saved);
                    currentIndex = parseInt(savedIndex);
                    if (currentIndex >= questionsDB.length) { currentIndex = 0; userAnswers = {}; }
                    else if (currentIndex > 0) { btnStart.innerText = "ادامه مسیر قبلی"; }
                }
            } catch (e) { console.error(e); }
        }

        function saveProgress() {
            localStorage.setItem('user_answers_v1', JSON.stringify(userAnswers));
            localStorage.setItem('current_index_v1', currentIndex);
        }

        function startApp() {
            document.getElementById('access-denied').style.display = 'none';
            intro.style.display = 'none';
            app.style.display = 'flex';
            
            if (tg.BackButton) {
                tg.BackButton.show();
                tg.BackButton.onClick(() => {
                    tg.showPopup({
                        title: 'توقف مسیر؟', message: 'پیشرفت شما محفوظ می‌ماند.',
                        buttons: [{id: 'yes', type: 'destructive', text: 'خروج'}, {id: 'no', type: 'cancel', text: 'ادامه'}]
                    }, (btnId) => { if (btnId === 'yes') tg.close(); });
                });
            }

            setTimeout(() => {
                app.style.opacity = '1'; app.style.transform = 'translateY(0)';
                renderQuestion(false);
            }, 100);
        }

        let isAnimating = false;
        function renderQuestion(animate = true) {
            if (currentIndex >= questionsDB.length) { finishQuiz(); return; }
            const q = questionsDB[currentIndex];
            const percent = ((currentIndex) / questionsDB.length) * 100;
            qNum.innerText = `${currentIndex + 1} / ${questionsDB.length}`;
            qText.innerText = q.text;
            progress.style.width = percent + '%';

            if (animate) {
                card.classList.remove('fade-out');
                card.classList.add('fade-in');
                setTimeout(() => card.classList.remove('fade-in'), 400);
            }
        }

        window.handleAnswer = function(score) {
            if (isAnimating) return;
            isAnimating = true;
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light'); 
            
            const currentQ = questionsDB[currentIndex];
            userAnswers[currentQ.key] = score;
            currentIndex++;
            saveProgress();
            
            card.classList.add('fade-out');
            setTimeout(() => {
                if (currentIndex >= questionsDB.length) { finishQuiz(); }
                else { renderQuestion(true); isAnimating = false; }
            }, 400); 
        };

        function finishQuiz() {
            progress.style.width = '100%'; qNum.innerText = '';
            document.getElementById('interaction-area').style.display = 'none';
            if(tg.BackButton) tg.BackButton.hide();
            
            card.classList.remove('fade-out');
            card.innerHTML = `
                <div style="font-size:60px; margin-bottom:20px; filter: grayscale(1);">✨</div>
                <h3 style="margin:10px 0 10px 0; color:var(--text-gold); font-weight:300;">پایان سفر</h3>
                <p style="font-size:14px; color:var(--text-secondary); margin-bottom:30px;">الگوهای شما ثبت شد.</p>
            `;
            
            tg.MainButton.text = "دریافت تحلیل نهایی";
            tg.MainButton.color = "#c5a059"; tg.MainButton.textColor = "#000000"; 
            tg.MainButton.show();
            tg.MainButton.onClick(sendDataSecure);
        }

        let isSubmitting = false; 
        async function sendDataSecure() {
            if (isSubmitting) return; 
            const initDataRaw = window.Telegram.WebApp.initData;
            if (!initDataRaw) { alert("خطا: احراز هویت انجام نشد."); return; }
            
            isSubmitting = true;
            document.getElementById('loading-overlay').style.display = 'flex';
            tg.MainButton.showProgress(true); tg.MainButton.disable();

            const payload = { init_data: initDataRaw, answers: userAnswers, timestamp: Math.floor(Date.now() / 1000) };

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 30000);
                
                const response = await fetch('https://self-production-1573.up.railway.app/receive-data', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload), signal: controller.signal
                });
                
                clearTimeout(timeoutId);

                if (response.ok) { tg.close(); }
                else {
                    if (response.status === 429) { alert("⏳ درخواست شما قبلا ثبت شده است. لطفاً ربات را چک کنید."); }
                    else { const err = await response.text(); alert("خطا: " + err); }
                    resetButtonState();
                }
            } catch (error) {
                if (error.name === 'AbortError') { alert("ارتباط با سرور زمان‌بر شد. لطفاً ربات را چک کنید."); }
                else { alert("خطای شبکه: " + error.message); }
                resetButtonState();
            }
        }

        function resetButtonState() {
            isSubmitting = false;
            document.getElementById('loading-overlay').style.display = 'none';
            tg.MainButton.hideProgress(); tg.MainButton.enable();
        }

        window.onload = function() {
            const isDebug = false; 
            if (isTelegram || isDebug) {
                document.getElementById('access-denied').style.display = 'none';
                intro.style.display = 'flex'; fetchQuestions();
            } else {
                document.getElementById('access-denied').style.display = 'flex';
                intro.style.display = 'none';
            }
        };
    </script>
</body>
</html>
