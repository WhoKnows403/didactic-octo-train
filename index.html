    <!DOCTYPE html>
    <html lang="fa" dir="rtl">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <title>تحلیل شخصیت </title>
        <script src="https://telegram.org/js/telegram-web-app.js"></script>
        <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@200;300;400;500;600&display=swap" rel="stylesheet">
        <style>
            :root {
                /* 🎨 Premium Zen Minimalist Palette - Enhanced */
                --bg-dark: #1a1c1d;
                --bg-center: #242728;
                --text-ivory: #FDFBF7;
                --text-muted: #9a958d;
                --accent-sage: #9DB39B;
                --accent-glow: rgba(157, 179, 155, 0.4);
                --line-color: rgba(255, 255, 255, 0.1);
                --gray-dark: #121415;
                --gray-light: #2d3133;
                --accent-warm: #E2C2A4;
                --accent-warm-glow: rgba(226, 194, 164, 0.25);
                --comparison-accent: #C2A878;
            }

            * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

            body, html {
                font-family: 'Vazirmatn', "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
                background: var(--bg-dark);
                color: var(--text-ivory);
                margin: 0; padding: 0;
                width: 100%; height: 100%;
                overflow: hidden;
                overscroll-behavior: none;
                position: fixed;
                user-select: none;
            }

            /* 🌟 Ethereal Breathing Background */

            .mesh-bg {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                z-index: 0;
                opacity: 0;
                pointer-events: none;
                background: var(--bg-dark);
                filter: blur(80px);
                -webkit-filter: blur(80px);
            }

            .blob {
                position: absolute; border-radius: 50%;
                animation: drift 15s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
                transition: background 1.5s ease;
            }

            .blob-1 { width: 350px; height: 350px; background: var(--blob-1); top: -10%; left: -10%; animation-delay: 0s; }
            .blob-2 { width: 400px; height: 400px; background: var(--blob-2); bottom: -20%; right: -10%; animation-delay: -5s; }
            .blob-3 { width: 300px; height: 300px; background: var(--blob-3); top: 40%; left: 40%; animation-delay: -10s; }

            @keyframes drift {
                0% { transform: translate(0, 0) scale(1); }
                33% { transform: translate(15vw, 10vh) scale(1.1); }
                66% { transform: translate(-10vw, 20vh) scale(0.9); }
                100% { transform: translate(5vw, -10vh) scale(1.05); }
            }

            /* 🚀 Screens */
            #access-denied {
                position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                z-index: 500; display: none;
                flex-direction: column; align-items: center; justify-content: center;
                padding: 30px; text-align: center; background: var(--bg-dark);
            }

            #intro-screen {
                position: fixed; top: 0; left: 0; width: 100%; height: 100%;
                z-index: 600; display: flex;
                flex-direction: column; align-items: center; justify-content: center;
                padding: 30px; text-align: center;
                background: radial-gradient(circle at center, var(--bg-center) 0%, var(--bg-dark) 100%);
            }

            /* Mind Ripple Animation for Intro */
            .mind-ripple {
                position: relative; width: 60px; height: 60px; margin-bottom: 30px;
            }
            .mind-ripple::before, .mind-ripple::after {
                content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
                border-radius: 50%; border: 2px solid var(--accent-sage);
                animation: ripple-out 3s infinite cubic-bezier(0.21, 0.53, 0.56, 0.8);
            }
            .mind-ripple::after { animation-delay: 1.5s; }
            @keyframes ripple-out {
                0% { transform: scale(0.5); opacity: 1; }
                100% { transform: scale(2); opacity: 0; }
            }

            .intro-h1 {
                font-size: 28px; font-weight: 500; margin-bottom: 15px;
                color: var(--text-ivory); letter-spacing: 1px;
                text-shadow: 0 4px 15px rgba(253, 251, 247, 0.1);
            }
            .intro-p {
                color: var(--text-muted); font-size: 15px; margin-bottom: 50px;
                max-width: 280px; font-weight: 300; line-height: 1.8;
            }

            .btn-start {
                background: var(--accent-sage); color: var(--bg-dark);
                border: none; padding: 16px 50px; font-size: 15px; font-weight: 600;
                border-radius: 50px; font-family: 'Vazirmatn'; cursor: pointer;
                transition: all 0.3s ease; box-shadow: 0 4px 20px rgba(157, 179, 155, 0.3);
                letter-spacing: 0.5px;
            }
            .btn-start:active { transform: scale(0.95); box-shadow: 0 2px 10px rgba(157, 179, 155, 0.2); }
            .btn-start:disabled {
                background: transparent; color: var(--text-muted); border: 1px solid var(--text-muted);
                box-shadow: none; opacity: 0.5; cursor: not-allowed;
            }

            /* 📱 Main App Layout */

            .app-layout {
                width: 100%;
                max-width: 480px;
                height: 100%;
                margin: 0 auto;

                display: none;
                flex-direction: column;

                padding: 22px 25px 28px;
                box-sizing: border-box;

                opacity: 0;
                transform: translateY(10px);

                transition:
                    opacity 0.8s ease,
                    transform 0.8s ease;

                position: relative;
                z-index: 10;

                isolation: isolate;

                /*
                * Keep the canvas itself transparent.
                * The artwork and atmosphere are handled by the
                * pseudo layers below.
                */
            }

            .app-layout::before {
                content: "";

                position: absolute;
                inset: 0;

                width: 100vw;
                height: 100%;

                left: 50%;
                transform: translateX(-50%);

                pointer-events: none;

                z-index: -2;

                background-image: url("little.webp");
                background-size: cover;
                background-position: center center;
                background-repeat: no-repeat;

                /*
                * Slightly soften the artwork without destroying
                * the painterly texture.
                */
                filter:
                    brightness(0.82)
                    saturate(0.82);

                -webkit-filter:
                    brightness(0.82)
                    saturate(0.82);

                will-change: auto;
            }


/* =========================================================
   ATMOSPHERIC TRANSITION
   Image → interaction environment
   ========================================================= */

                .app-layout::after {
                    content: "";

                    position: absolute;
                    inset: 0;

                    width: 100vw;
                    height: 100%;

                    left: 50%;
                    transform: translateX(-50%);

                    pointer-events: none;

                    z-index: -1;

                    background:
                        /*
                        * Top:
                        * preserve the dark blue atmosphere.
                        */
                        linear-gradient(
                            to bottom,
                            rgba(15, 17, 18, 0.16) 0%,
                            rgba(15, 17, 18, 0.02) 24%,

                            /*
                            * Middle:
                            * very subtle readability support.
                            */
                            rgba(15, 17, 18, 0.08) 46%,

                            /*
                            * Transition zone:
                            * the artwork gradually gives way to the
                            * interaction environment.
                            */
                            rgba(15, 17, 18, 0.42) 66%,
                            rgba(15, 17, 18, 0.82) 82%,

                            /*
                            * Bottom:
                            * stable dark visual ground.
                            */
                            rgba(15, 17, 18, 0.97) 100%
                        ),

                        /*
                        * Very subtle edge control.
                        * No hard vignette.
                        */
                        radial-gradient(
                            ellipse at 50% 35%,
                            rgba(0, 0, 0, 0) 38%,
                            rgba(0, 0, 0, 0.12) 72%,
                            rgba(0, 0, 0, 0.28) 100%
                        );
                }



            .progress-container {
                width: 100%;

                display: flex;
                align-items: center;

                gap: 18px;

                margin: 0;

                position: relative;
                z-index: 30;

                flex: 0 0 auto;
            }

            .q-counter {
                order: 2;

                flex: 0 0 auto;

                color: rgba(253, 251, 247, 0.62);

                font-size: 12px;
                font-weight: 400;

                letter-spacing: 0.8px;

                white-space: nowrap;

                text-shadow:
                    0 2px 10px rgba(0, 0, 0, 0.32);
            }

            .progress-track {
                order: 1;

                flex: 1 1 auto;

                height: 2px;

                margin: 0;

                position: relative;

                background: rgba(255, 255, 255, 0.15);

                border-radius: 999px;

                overflow: hidden;

                /*
                * Prevent the track from becoming visually heavy.
                */
                backdrop-filter: blur(3px);
                -webkit-backdrop-filter: blur(3px);
            }


            .progress-glow {
                height: 100%;

                width: 0%;

                background: var(--accent-sage);

                border-radius: 999px;

                transition:
                    width 0.6s cubic-bezier(0.4, 0, 0.2, 1);

                box-shadow:
                    0 0 7px var(--accent-glow);
            }



            #story-progress {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 70%;
                margin: 30px auto 40px;
                gap: 4px;
            }

            .neural-node {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: #33383B;
                transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
                border: 1px solid #1a1d1f;
            }

            .neural-node.active {
                background: #D1D5DB;
                transform: scale(1.1);
                box-shadow: 0 0 0 3px rgba(209, 213, 219, 0.1);
            }

            .neural-link {
                flex-grow: 1;
                height: 1px;
                background: #25282B;
                transition: all 0.6s ease;
            }

            .neural-link.active {
                background: #5D6367;
            }

           /* 🎵 Ambient Music Toggle */
            .music-toggle {
                position: absolute;
                top: 25px;
                left: 25px;
                width: 44px;
                height: 44px;
                border-radius: 50%;
                background: rgba(13, 13, 14, 0.4);
                border: 1px solid rgba(255, 255, 255, 0.05);
                color: var(--text-muted);
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                z-index: 100;
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
                transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            }

            .music-toggle:active {
                transform: scale(0.92);
                background: rgba(13, 13, 14, 0.8);
            }

            .music-toggle svg {
                width: 18px;
                height: 18px;
                fill: currentColor;
                transition: all 0.4s ease;
            }

            .music-toggle.playing {
                color: var(--accent-warm); /* طلایی شامپاینی برای حالت فعال */
                border-color: rgba(212, 175, 55, 0.2);
                box-shadow: 0 0 20px rgba(212, 175, 55, 0.08);
            }

            /* 🎴 Question Stage */

            .card-stage {
                flex: 1 1 auto;

                min-height: 0;

                width: 100%;

                position: relative;

                display: flex;
                align-items: center;
                justify-content: center;

                z-index: 10;
            }

            #card {
                width: 100%;

                min-height: 160px;

                padding: 0 8px;

                box-sizing: border-box;

                display: flex;
                flex-direction: column;

                align-items: center;
                justify-content: center;

                text-align: center;

                position: absolute;

                opacity: 1;

                z-index: 20;
            }


            .q-text-content {
                width: 100%;
                max-width: 350px;

                /*
                * Slightly smaller than the previous 24px.
                * This makes it feel like a personal question,
                * not a marketing headline.
                */
                font-size: 22px;

                font-weight: 400;

                line-height: 1.85;

                letter-spacing: 0;

                color: var(--text-ivory);

                text-align: center;

                text-wrap: balance;

                /*
                * Enough separation from the artwork,
                * without producing a glowing / artificial text effect.
                */
                text-shadow:
                    0 2px 10px rgba(0, 0, 0, 0.32),
                    0 6px 24px rgba(0, 0, 0, 0.20);

                position: relative;

                z-index: 21;
            }

            /* 🔘 Interaction Area (Likert Scale) */
            .interaction-area {
                width: 100%;

                flex: 0 0 auto;

                margin: 0 0 18px;

                position: relative;

                z-index: 30;
            }


            .scale-container {
                width: 100%;

                position: relative;

                padding-top: 4px;
            }

            .scale-line {
                position: absolute;

                left: 0;
                right: 0;

                top: 16px;

                height: 1px;

                background:
                    linear-gradient(
                        to right,
                        rgba(255, 255, 255, 0.10),
                        rgba(255, 255, 255, 0.18),
                        rgba(255, 255, 255, 0.10)
                    );

                pointer-events: none;

                z-index: 1;
            }

            .options-grid {
                width: 100%;

                display: grid;

                grid-template-columns:
                    repeat(5, 1fr);

                align-items: center;

                position: relative;

                z-index: 2;
            }


            /* 🔴 ENHANCED CIRCLES */
            .circle-btn {
                width: 30px;
                height: 30px;

                padding: 0;
                margin: 0 auto;

                border-radius: 50%;

                border:
                    1px solid rgba(255, 255, 255, 0.20);

                background:
                    rgba(18, 20, 21, 0.72);

                box-shadow:
                    0 3px 14px rgba(0, 0, 0, 0.16);

                backdrop-filter: blur(5px);
                -webkit-backdrop-filter: blur(5px);

                cursor: pointer;

                transition:
                    transform 0.22s ease,
                    border-color 0.22s ease,
                    background 0.22s ease,
                    box-shadow 0.22s ease;
            }


            /* Soft inner fill to make it pop */
            .circle-btn::after {
                content: '';
                position: absolute;
                top: 50%;
                left: 50%;
                width: 10px;
                height: 10px;
                border-radius: 50%;
                background: var(--accent-sage);
                box-shadow: 0 0 10px var(--accent-glow);
                transform: translate(-50%, -50%) scale(0);
                transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
                opacity: 0;
            }

            .circle-btn:active {
                transform: scale(0.85);
                border-color: var(--accent-sage);
                background: rgba(157, 179, 155, 0.05);
                transform: scale(0.92);

            }

            .circle-btn:active::after {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }

            .labels-row {
                width: 100%;

                display: flex;

                justify-content: space-between;

                align-items: center;

                margin-top: 17px;

                padding: 0 1px;

                color: rgba(253, 251, 247, 0.46);

                font-size: 11px;

                font-weight: 400;

                letter-spacing: 0;

                text-shadow:
                    0 2px 8px rgba(0, 0, 0, 0.25);
            }
            @media (max-width: 380px) {

                .app-layout {
                    padding-left: 20px;
                    padding-right: 20px;
                }

                .q-text-content {
                    max-width: 330px;
                    font-size: 21px;
                }

                .circle-btn {
                    width: 28px;
                    height: 28px;
                }

                .labels-row {
                    font-size: 10px;
                }
            }

            /* 🌟 Pure Fade Animation */
            .fade-out { animation: simpleFadeOut 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
            .fade-in { animation: simpleFadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

            @keyframes simpleFadeOut {
                0% { opacity: 1; transform: translateY(0) scale(1); }
                100% { opacity: 0; transform: translateY(-10px) scale(0.98); }
            }
            @keyframes simpleFadeIn {
                0% { opacity: 0; transform: translateY(10px) scale(0.98); }
                100% { opacity: 1; transform: translateY(0) scale(1); }
            }

            /* 🧠 Loading Overlay */
            #loading-overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                z-index: 2000;
                background: rgba(13, 13, 14, 0.92); /* تیره‌تر و عمیق‌تر */
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                text-align: center;
            }

            .minimal-spinner {
                width: 48px;
                height: 48px;
                border: 1px solid rgba(255, 255, 255, 0.03);
                border-top-color: var(--accent-sage);
                border-right-color: var(--accent-warm); /* ترکیب دو رنگ لوکس در چرخش */
                border-radius: 50%;
                animation: spin 1.2s cubic-bezier(0.6, 0.2, 0.4, 0.8) infinite;
                box-shadow: 0 0 20px rgba(157, 179, 155, 0.05);
            }

            .dual-orb {
                background: radial-gradient(circle at 30% 30%, rgba(194, 168, 120, 0.15) 0%, transparent 60%),
                            radial-gradient(circle at 70% 70%, rgba(157, 179, 155, 0.1) 0%, transparent 60%) !important;
                opacity: 0.8;
            }

            dual-orb {
                background: radial-gradient(circle at 30% 30%, rgba(194, 168, 120, 0.15) 0%, transparent 60%),
                            radial-gradient(circle at 70% 70%, rgba(157, 179, 155, 0.1) 0%, transparent 60%) !important;
                opacity: 0.8;
            }

            .comparison-glow {
                background: radial-gradient(circle at top right, rgba(194, 168, 120, 0.06) 0%, transparent 70%) !important;
            }

            .text-highlight.comparison-highlight {
                background: linear-gradient(120deg, rgba(194, 168, 120, 0.12) 0%, transparent 100%);
                border-bottom: 1px solid rgba(194, 168, 120, 0.3);
                color: var(--text-ivory);
                padding: 0 4px;
                border-radius: 2px 2px 0 0;
            }

            .soul-quote.comparison-quote {
                border-right: 2px solid rgba(194, 168, 120, 0.5);
                background: linear-gradient(90deg, rgba(194, 168, 120, 0.04) 0%, transparent 100%);
                padding: 15px 20px;
                border-radius: 4px;
                font-style: italic;
            }


            /* 📖 Story Mode UI - Premium Experience */
            #result-container {
                display: none;
                flex-direction: column;
                width: 100%;
                height: 100%;
                position: fixed;
                top: 0;
                left: 0;
                background: var(--bg-dark); /* پس‌زمینه سالید و عمیق برای فوکوس روی متن */
                z-index: 1000;
                padding: 40px 25px; /* تنفس بیشتر کادرها */
                overflow: hidden;
            }

            .story-progress-bar {
                display: flex;
                gap: 6px;
                width: 100%;
                margin-bottom: 40px;
                position: relative;
                z-index: 10;
            }

            .story-tick {
                flex: 1;
                height: 2px; /* خطوط پیشرفت مایکرو */
                background: rgba(255, 255, 255, 0.06);
                border-radius: 2px;
                overflow: hidden;
            }

            .story-tick-fill {
                height: 100%;
                width: 0%;
                background: linear-gradient(90deg, var(--accent-sage), var(--accent-warm));
                box-shadow: 0 0 8px var(--accent-warm-glow);
                transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            }

            .story-tick.active .story-tick-fill {
                width: 100%;
            }

            .slide-container {
                flex-grow: 1;
                position: relative;
                width: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                -webkit-mask-image: linear-gradient(to bottom, black 80%, transparent 100%);
                mask-image: linear-gradient(to bottom, black 80%, transparent 100%);
            }

            .slide {
                position: absolute;
                width: 100%;
                max-height: 80vh;
                overflow-y: auto;
                padding-bottom: 60px;
                opacity: 0;
                transform: translateY(20px) scale(0.97);
                transition: all 0.7s cubic-bezier(0.16, 1, 0.3, 1);
                pointer-events: none;
                scrollbar-width: none; /* Firefox */
                scroll-behavior: smooth;
            }

            .slide::-webkit-scrollbar {
                display: none; /* Chrome */
            }

            .slide.active {
                opacity: 1;
                transform: translateY(0) scale(1);
                pointer-events: auto;
            }

            .slide.passed {
                opacity: 0;
                transform: translateY(-20px) scale(0.97);
            }

            .slide h2 {
                color: var(--accent-warm); /* عناوین با طلایی شامپاینی */
                font-size: 20px;
                font-weight: 500;
                margin-bottom: 25px;
                line-height: 1.5;
                letter-spacing: 1px;
                text-shadow: 0 4px 20px rgba(212, 175, 55, 0.15);
            }

            .slide p {
                color: rgba(253, 251, 247, 0.85); /* کمی نرم‌تر از سفید خالص */
                font-size: 15px;
                font-weight: 300;
                line-height: 2; /* فاصله‌گذاری اتمسفریک بین خطوط */
                text-align: justify;
                text-shadow: none; /* حذف سایه‌های کثیف‌کننده متن طولانی */
                margin-bottom: 15px;
            }

           /* 🔘 Floating Continue Button */
            .continue-btn-wrapper {
                position: absolute;
                bottom: 35px;
                left: 0;
                width: 100%;
                display: flex;
                justify-content: center;
                z-index: 20;
            }

            .continue-btn {
                background: transparent;
                color: var(--accent-sage);
                border: 1px solid var(--accent-sage);
                padding: 12px 35px;
                font-size: 14px;
                font-weight: 500;
                border-radius: 4px; /* لبه‌های مینیمال به جای کپسولی */
                font-family: 'Vazirmatn', sans-serif;
                cursor: pointer;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
                display: flex;
                align-items: center;
                gap: 12px;
                transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
                backdrop-filter: blur(8px);
                letter-spacing: 1px;
            }

            .continue-btn:active {
                transform: scale(0.97);
                background: var(--accent-sage);
                color: var(--bg-dark);
                box-shadow: 0 0 15px var(--accent-glow);
            }

            .continue-btn svg {
                width: 16px;
                height: 16px;
                fill: currentColor;
            }

            /* Network Error UI */
            .network-error-ui {
                display: none;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(13, 13, 14, 0.95);
                z-index: 2000;
                text-align: center;
                padding: 30px;
                backdrop-filter: blur(10px);
            }

            .network-error-ui svg {
                width: 50px;
                height: 50px;
                fill: var(--text-muted);
                margin-bottom: 25px;
                animation: pulse 2.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            }

            /* Back Button for Story Mode */
            .back-story-btn {
                position: absolute;
                top: 25px;
                left: 25px;
                background: transparent;
                border: 1px solid rgba(255, 255, 255, 0.05);
                color: var(--text-muted);
                cursor: pointer;
                z-index: 101;

                transform: scale(0.92);

                height: 20px;
                fill: currentColor;

            @keyframes spin {
                to { transform: rotate(360deg); }

            /* 💠 Glass Card Restyling */
            .glass-card {
                position: relative;
                width: 90%;
                margin: 0 auto;
                padding: 45px 30px;
                border-radius: 6px; /* خطوط دقیق و شکسته به جای گردی زیاد */

                box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.05);
                backdrop-filter: blur(25px);
                -webkit-backdrop-filter: blur(25px);
            }

            .glass-card::before, .glass-card::after {
                display: none;
            }

            .glass-card-content {
                position: relative;
                z-index: 2;
                display: flex;
                flex-direction: column;
                align-items: center;

            @keyframes rotate-glow {
                100% { transform: rotate(360deg); }

            .paragraph-target {
                opacity: 0;
                filter: blur(8px); /* بلور نرم‌تر */
                transform: translateY(10px);

            .blur-reveal {
                animation: blurFocus 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            }

            @keyframes blurFocus {
                to { opacity: 1; filter: blur(0); transform: translateY(0); }

            /* 🔮 Sacred Geometry Loaders */
            .sacred-geometry {
                position: relative;
                width: 44px; /* کمی جمع‌وجورتر */

                transform-style: preserve-3d;
                perspective: 800px;

            .geom-ring {
                position: absolute;
                top: 0; left: 0; right: 0; bottom: 0;
                border: 1px solid rgba(157, 179, 155, 0.4);

                transition: border-color 1.5s ease;
                box-shadow: 0 0 15px rgba(157, 179, 155, 0.05);

            .geom-ring:nth-child(1) { animation: spin3D_1 6s linear infinite; }
            .geom-ring:nth-child(2) { animation: spin3D_2 8s linear infinite; }
            .geom-ring:nth-child(3) { animation: spin3D_3 10s linear infinite; border-color: rgba(212, 175, 55, 0.3); } /* طلایی شدن یکی از حلقه‌ها */

            @keyframes spin3D_1 {
                0% { transform: rotateX(75deg) rotateZ(0deg); }
                100% { transform: rotateX(75deg) rotateZ(360deg); }

            @keyframes spin3D_2 {
                0% { transform: rotateY(75deg) rotateZ(0deg); }
                100% { transform: rotateY(75deg) rotateZ(360deg); }
            }
            @keyframes spin3D_3 {
                0% { transform: rotateX(45deg) rotateY(45deg) rotateZ(0deg); }
                100% { transform: rotateX(45deg) rotateY(45deg) rotateZ(360deg); }

            <div class="progress-container">

                    <div class="progress-glow" id="progress"></div>
                </div>
                <div class="q-counter" id="q-num">1 / 60</div>
            </div>

            <div class="card-stage">
                <div id="card">
                    <div class="q-text-content" id="q-text">...</div>
                </div>
            </div>

            <div class="interaction-area" id="interaction-area">
                <div class="scale-container">
                    <div class="scale-line"></div>
                    <div class="options-grid">
                        <button class="circle-btn" data-val="1" onclick="handleAnswer(1)"></button>
                        <button class="circle-btn" data-val="2" onclick="handleAnswer(2)"></button>
                        <button class="circle-btn" data-val="3" onclick="handleAnswer(3)"></button>
                        <button class="circle-btn" data-val="4" onclick="handleAnswer(4)"></button>
                        <button class="circle-btn" data-val="5" onclick="handleAnswer(5)"></button>
                    </div>
                    <div class="labels-row">
                        <span>کاملاً مخالف</span>
                        <span>کاملاً موافق</span>
                    </div>
                </div>
            </div>
        </div>

        <div id="loading-overlay" style="display: none;">
            <div class="minimal-spinner"></div>
            <h3 style="margin-top: 25px; color: var(--text-ivory); font-weight: 400; letter-spacing: 1px; font-size: 16px;">تـحـلـیـل داده‌هـا</h3>
            <p style="color: var(--text-muted); font-size: 13px; margin-top: 5px;">در حال ترسیم نقشه‌ی ذهن...</p>
        </div>

        <!-- Story Mode Result Container -->
        <div id="result-container">
        <div class="smart-nav-wrapper">
            <div class="nav-pill">
                <button class="nav-btn prev-btn" id="btn-prev" onclick="prevSlide()">
                    <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
                </button>
                <div class="nav-divider"></div>
                <button class="nav-btn next-btn" id="btn-next" onclick="nextSlide()">
                    <span id="next-btn-text">ادامه</span>
                    <svg viewBox="0 0 24 24"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
                </button>
            </div>
        </div>
            <div class="story-progress-bar" id="story-progress"></div>
            <div class="slide-container" id="slides-wrapper"></div>

        </div>

        <!-- Beautiful Network Error -->
        <div class="network-error-ui" id="network-error">
            <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.36 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/></svg>
            <h3 style="color: var(--text-ivory); font-weight: 400; margin-bottom: 10px;">ارتباط با سرور کُند است</h3>
            <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 30px; max-width: 250px;">سیگنال‌های ذهن شما در مسیر ارتباطی گیر کرده‌اند. لطفاً اینترنت خود را بررسی کنید.</p>
            <button class="btn-start" onclick="loadAnalysis()">تلاش مجدد</button>
        </div>

        <script>
            // ✅ Main Logic (Untouched functionally, only UI constants updated)
            const tg = window.Telegram.WebApp;
            tg.ready(); tg.expand(); tg.disableVerticalSwipes();
            if(tg.setHeaderColor) tg.setHeaderColor('#1a1c1d');
            if(tg.setBackgroundColor) tg.setBackgroundColor('#1a1c1d');

            const isTelegram = (tg.initData && tg.initData.length > 0) || (tg.platform && tg.platform !== 'unknown');

            let questionsDB = []; let currentIndex = 0; let userAnswers = {};
            const app = document.getElementById('app');
            const intro = document.getElementById('intro-screen');
            const card = document.getElementById('card');
            const qText = document.getElementById('q-text');
            const qNum = document.getElementById('q-num');
            const progress = document.getElementById('progress');
            const btnStart = document.getElementById('btn-start');
            const introDesc = document.getElementById('intro-desc');
            const bgAudio = document.getElementById('bg-audio');
            const muteBtn = document.getElementById('mute-btn');
            const iconUnmuted = document.getElementById('icon-unmuted');
            const iconMuted = document.getElementById('icon-muted');

            function toggleMute() {
                if (bgAudio.muted) {
                    bgAudio.muted = false;
                    muteBtn.classList.add('playing');
                    iconUnmuted.style.display = 'block';
                    iconMuted.style.display = 'none';
                } else {
                    bgAudio.muted = true;
                    muteBtn.classList.remove('playing');
                    iconUnmuted.style.display = 'none';
                    iconMuted.style.display = 'block';
                }
                if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
            }

            async function fetchQuestions() {
                try {
                    const res = await fetch('questions.json?v=' + new Date().getTime());
                    if (!res.ok) throw new Error("Network error");
                    questionsDB = await res.json();
                    introDesc.innerHTML = `${questionsDB.length} ایستگاه برای شناخت عمیق`;
                    loadSavedAnswers();
                } catch (e) {
                    console.error(e);
                    btnStart.innerText = "خطا در ارتباط";
                    introDesc.innerText = "امکان بارگذاری وجود ندارد.";
                }
            }

            function loadSavedAnswers() {
                let cloudResponded = false;

                const fallbackTimer = setTimeout(() => {
                    if (!cloudResponded) {
                        console.warn("CloudStorage timeout. Falling back to LocalStorage.");
                        loadFromLocalStorage();
                    }
                }, 2000);

                if (tg.CloudStorage) {
                    tg.CloudStorage.getItems(['user_answers_v1', 'current_index_v1'], (err, res) => {
                        cloudResponded = true;
                        clearTimeout(fallbackTimer);

                        if (!err && res) {
                            const savedAnswers = res['user_answers_v1'];
                            const savedIndex = res['current_index_v1'];

                            if (savedAnswers && savedIndex) {
                                userAnswers = JSON.parse(savedAnswers);
                                currentIndex = parseInt(savedIndex);

                                if (currentIndex >= questionsDB.length) {
                                    currentIndex = 0;
                                    userAnswers = {};
                                }
                            }
                        }
                        btnStart.removeAttribute('disabled');
                        btnStart.innerText = currentIndex > 0 ? "ادامه مسیر قبلی" : "ورود به ناخودآگاه";
                    });
                } else {
                    cloudResponded = true;
                    clearTimeout(fallbackTimer);
                    loadFromLocalStorage();
                }
            }

            function loadFromLocalStorage() {
                const savedAnswers = localStorage.getItem('user_answers_v1');
                const savedIndex = localStorage.getItem('current_index_v1');
                if (savedAnswers && savedIndex) {
                    userAnswers = JSON.parse(savedAnswers);
                    currentIndex = parseInt(savedIndex);
                    if (currentIndex >= questionsDB.length) {
                        currentIndex = 0;
                        userAnswers = {};
                    }
                }
                btnStart.removeAttribute('disabled');
                btnStart.innerText = currentIndex > 0 ? "ادامه مسیر قبلی" : "ورود به ناخودآگاه";
            }

            let cloudSaveTimeout;

            function saveProgress() {
                localStorage.setItem('user_answers_v1', JSON.stringify(userAnswers));
                localStorage.setItem('current_index_v1', currentIndex);

                if (tg.CloudStorage) {
                    clearTimeout(cloudSaveTimeout);
                    cloudSaveTimeout = setTimeout(() => {
                        tg.CloudStorage.setItem('user_answers_v1', JSON.stringify(userAnswers), (err) => {
                            if (err) console.error("CloudStorage Error:", err);
                        });
                        tg.CloudStorage.setItem('current_index_v1', currentIndex.toString());
                    }, 1500);
                }
            }

            function startApp() {
                document.getElementById('access-denied').style.display = 'none';
                intro.style.display = 'none';
                app.style.display = 'flex';
                bgAudio.play().catch(e => console.log("Audio autoplay issue:", e));
                if (tg.BackButton) {
                    tg.BackButton.show();
                    tg.BackButton.onClick(() => {
                        tg.showPopup({
                            title: 'توقف مسیر؟', message: 'پیشرفت شما محفوظ می‌ماند.',
                            buttons: [{id: 'yes', type: 'destructive', text: 'خروج'}, {id: 'no', type: 'cancel', text: 'ادامه'}]
                        }, (btnId) => { if (btnId === 'yes') tg.close(); });
                    });
                }
                setTimeout(() => {
                    app.style.opacity = '1'; app.style.transform = 'translateY(0)';
                    renderQuestion(false);
                }, 100);
            }

            let isAnimating = false;

            function renderQuestion(animate = true) {
                if (currentIndex >= questionsDB.length) { finishQuiz(); return; }

                const q = questionsDB[currentIndex];
                const percent = ((currentIndex) / questionsDB.length) * 100;
                qNum.innerText = `${currentIndex + 1} / ${questionsDB.length}`;
                qText.innerText = q.text;
                progress.style.width = percent + '%';

                if (animate) {
                    card.classList.remove('fade-out');
                    card.classList.add('fade-in');
                    setTimeout(() => card.classList.remove('fade-in'), 300);
                }
            }

            window.handleAnswer = function(score) {
                if (isAnimating) return;
                isAnimating = true;
                if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
                const currentQ = questionsDB[currentIndex];
                userAnswers[currentQ.key] = score;
                currentIndex++;
                saveProgress();

                card.classList.add('fade-out');
                setTimeout(() => {
                    if (currentIndex >= questionsDB.length) { finishQuiz(); }
                    else { renderQuestion(true); isAnimating = false; }
                }, 300);
            };

            function finishQuiz() {
                progress.style.width = '100%'; qNum.innerText = '';
                document.getElementById('interaction-area').style.display = 'none';
                if(tg.BackButton) tg.BackButton.hide();
                card.classList.remove('fade-out');

                card.innerHTML = `
                    <div style="width: 16px; height: 16px; border-radius: 50%; background: var(--accent-sage); box-shadow: 0 0 20px var(--accent-sage); margin: 0 auto 30px auto; animation: breathe 2s infinite alternate;"></div>
                    <h3 style="margin:0 0 15px 0; color:var(--text-ivory); font-weight:500; font-size:24px;">پایان سفر</h3>
                    <p style="font-size:15px; color:var(--text-muted); margin-bottom:30px;">الگوهای شما ثبت شد.</p>
                `;
                tg.MainButton.text = "دریافت تحلیل نهایی";
                tg.MainButton.color = "#9DB39B";
                tg.MainButton.textColor = "#1a1c1d";
                tg.MainButton.show();
                tg.MainButton.onClick(sendDataSecure);
            }

            let isSubmitting = false;
            async function sendDataSecure() {
                if (isSubmitting) return;
                const initDataRaw = window.Telegram.WebApp.initData;
                if (!initDataRaw) { tg.showAlert("خطا: احراز هویت انجام نشد."); return; }

                isSubmitting = true;
                bgAudio.pause();
                document.getElementById('loading-overlay').style.display = 'flex';
                tg.MainButton.showProgress(true);
                tg.MainButton.disable();

                const payload = { init_data: initDataRaw, answers: userAnswers, timestamp: Math.floor(Date.now() / 1000) };

                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 30000);

                    const response = await fetch('https://90c2-2a0b-4140-101a-00-2.ngrok-free.app/assessment/receive-data', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload),
                        signal: controller.signal
                    });

                    clearTimeout(timeoutId);

                    if (response.ok) {
                        localStorage.removeItem('user_answers_v1');
                        localStorage.removeItem('current_index_v1');

                        if (tg.CloudStorage) {
                            tg.CloudStorage.removeItems(['user_answers_v1', 'current_index_v1'], (err, success) => {
                                if (err) console.error("Error clearing CloudStorage:", err);
                                tg.close();
                            });
                        } else {
                            tg.close();
                        }
                        return;
                    }

                    if (!response.ok) {
                        if (response.status === 404) {
                            tg.showAlert(" متأسفانه نتیجه‌ای برای این درخواست یافت نشد.");
                        } else if (response.status === 429 || response.status === 400) {
                            tg.showAlert("⏳ درخواست شما قبلا ثبت شده است. لطفاً ربات را چک کنید.");
                        } else {
                            try {
                                const errJson = await response.json();
                                tg.showAlert("خطا: " + (errJson.detail || "مشکلی پیش آمده است"));
                            } catch (parseError) {
                                const errText = await response.text();
                                tg.showAlert("خطا: " + (errText || "خطای ناشناخته"));
                            }
                        }
                        resetButtonState();
                        return;
                    }

                } catch (error) {
                    tg.showAlert("خطا در برقراری ارتباط با سرور: " + error.message);
                    resetButtonState();
                }
            }

            function resetButtonState() {
                isSubmitting = false;
                document.getElementById('loading-overlay').style.display = 'none';
                tg.MainButton.hideProgress(); tg.MainButton.enable();
            }

            window.onload = function() {
                const isDebug = false;

                if (isTelegram || isDebug) {
                    document.getElementById('access-denied').style.display = 'none';

                    const params = new URLSearchParams(window.location.search);
                    const flow = params.get("flow");
                    const comparisonRequestId = params.get("comparison_request_id");

                    document.getElementById('intro-screen').style.display = 'none';
                    document.getElementById('app').style.display = 'none';

                    if (flow === "comparison" && comparisonRequestId) {
                        handleComparisonFlow(comparisonRequestId);

                    } else if (flow === "result") {
                        loadAnalysis();

                    } else {
                        document.getElementById('intro-screen').style.display = 'flex';
                        fetchQuestions();
                    }

                } else {
                    document.getElementById('access-denied').style.display = 'flex';
                    document.getElementById('intro-screen').style.display = 'none';
                    document.getElementById('app').style.display = 'none';
                }
            };

            let parsedSlides = [];
            let currentSlideIndex = 0;

            async function loadAnalysis() {
                document.getElementById('network-error').style.display = 'none';

                const initDataRaw = window.Telegram.WebApp.initData;
                const CACHE_KEY = 'user_mental_analysis_v1';

                let hasCachedData = false;

                const cachedDataString = localStorage.getItem(CACHE_KEY);
                if (cachedDataString) {
                    try {
                        const cachedData = JSON.parse(cachedDataString);
                        renderResultUI(cachedData);
                        hasCachedData = true;
                    } catch (e) {
                        console.warn("خطا در خواندن کش قدیمی، دوباره دریافت می‌شود...", e);
                    }
                }

                if (!hasCachedData) {
                    document.getElementById('loading-overlay').style.display = 'flex';
                    document.querySelector('#loading-overlay h3').innerText = "فراخوانی پرونده ذهنی";
                    document.querySelector('#loading-overlay p').innerText = "در حال ایجاد ارتباط امن...";
                }

                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 12000);

                try {
                    const response = await fetch('https://90c2-2a0b-4140-101a-00-2.ngrok-free.app/assessment/receive-result', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ init_data: initDataRaw }),
                        signal: controller.signal
                    });

                    clearTimeout(timeoutId);

                    if (response.ok) {
                        const freshData = await response.json();

                        localStorage.setItem(CACHE_KEY, JSON.stringify(freshData));

                        if (!hasCachedData) {
                            document.getElementById('loading-overlay').style.display = 'none';
                            renderResultUI(freshData);
                        }
                    } else {
                        if (!hasCachedData) {
                            document.getElementById('loading-overlay').style.display = 'none';
                            tg.showAlert("هنوز تحلیلی برای شما ثبت نشده یا مشکلی پیش آمده است.");
                            tg.close();
                        }
                    }
                } catch (error) {
                    clearTimeout(timeoutId);

                    if (!hasCachedData) {
                        document.getElementById('loading-overlay').style.display = 'none';

                        const isNetworkError = error.name === 'AbortError' ||
                                            error.name === 'TypeError' ||
                                            error.message.includes('Failed to fetch') ||
                                            error.message.includes('Load failed') ||
                                            error.message.includes('Network');

                        if (isNetworkError) {
                            document.getElementById('network-error').style.display = 'flex';
                            if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
                        } else {
                            tg.showAlert("خطای غیرمنتظره: " + error.message);
                        }
                    } else {
                        console.log("Background update failed (offline mode). Showing cached version.");
                    }
                }
            }

            function getSlideMeta(titleText) {
                let meta = { chapter: "", whisper: "" };

                if (titleText.includes('قبل از اینکه شروع کنیم')) {
                    meta.chapter = "CHAPTER I • آغاز";
                    meta.whisper = "هر سفری،<br>با شناخت نقطه‌ی آغاز خودش معنا پیدا می‌کند.";
                }
                else if (titleText.includes('چیزی که در ذهن تو پررنگ‌تر است')) {
                    meta.chapter = "CHAPTER I • ادراک";
                    meta.whisper = "هر ذهن،<br>از جایی آغاز می‌شود.";
                }
                else if (titleText.includes('ذهن تو چطور کار می‌کند')) {
                    meta.chapter = "CHAPTER II • پردازش";
                    meta.whisper = "آنچه می‌بینی،<br>فقط نیمی از داستان است.";
                }
                else if (titleText.includes('زاویه‌ای که شاید کمتر دیده باشی')) {
                    meta.chapter = "CHAPTER III • سایه‌ها";
                    meta.whisper = "بعضی پاسخ‌ها،<br>در سکوت زندگی می‌کنند.";
                }
                else if (titleText.includes('گره می‌خورد') || titleText.includes('نشتی') || titleText.includes('فشار')) {
                    meta.chapter = "CHAPTER IV • چالش";
                    meta.whisper = "هیچ نقطه‌ی قوتی،<br>بدون سایه نیست.";
                }
                else if (titleText.includes('درون تو و نگاهِ بیرون')) {
                    meta.chapter = "CHAPTER V • بازتاب";
                    meta.whisper = "دیگران،<br>همیشه از همان پنجره نگاه نمی‌کنند.";
                }
                else if (titleText.includes('این الگو در یک آدم دیگر')) {
                    meta.chapter = "CHAPTER VI • آینه";
                    meta.whisper = "گاهی،<br>دیدن یک آینه، همه چیز را روشن‌تر می‌کند.";
                }
                else if (titleText.includes('جایی برای مکث')) {
                    meta.chapter = "CHAPTER VII • توقف";
                    meta.whisper = "هر سفری،<br>چیزی را با خودش باقی می‌گذارد.";
                }
                else if (titleText.includes('لایه‌های عمیق‌تر')) {
                    meta.chapter = "CHAPTER VII • هسته‌ی پنهان";
                    meta.whisper = "پشت هر انتخاب،<br>ساختاری وجود دارد که آرام شکل گرفته است.";
                }

                return meta;
            }

            function parseMarkdownToSlides(rawText) {
                const cleanText = rawText.replace(/---/g, '');

                const rawParts = cleanText.split('##').map(p => p.trim()).filter(p => p.length > 0);

                return rawParts.map(part => {
                    const lines = part.split('\n');
                    const title = lines[0].trim();
                    const content = lines.slice(1).join('<br><br>').trim();
                    return { title, content };
                });
            }

            function typeWriterEffect(element, text, speed = 35, onComplete) {
                if (element.twTimeout) clearTimeout(element.twTimeout);
                element.innerHTML = "";
                let i = 0;

                function type() {
                    if (i < text.length) {
                        element.innerHTML += text.charAt(i);
                        i++;
                        element.twTimeout = setTimeout(type, speed);
                    } else if (onComplete) {
                        onComplete();
                    }
                }
                type();
            }

            async function handleComparisonFlow(requestId) {

                const loadingOverlay = document.getElementById('loading-overlay');
                if (loadingOverlay) {
                    loadingOverlay.style.display = 'flex';
                    document.querySelector('#loading-overlay h3').innerText = "هم‌گام‌سازی ذهن‌ها";
                    document.querySelector('#loading-overlay p').innerText = "در حال پردازش نقاط اتصال...";
                }

                const initData = tg?.initData || "debug_init_data";

                try {
                    const url = `https://90c2-2a0b-4140-101a-00-2.ngrok-free.app/comparison/receive-comparison-result`;

                    const response = await fetch(url, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json, text/plain, */*',
                            'ngrok-skip-browser-warning': 'true'
                        },
                        body: JSON.stringify({
                            init_data: initData,
                            comparison_request_id: parseInt(requestId, 10)
                        })
                    });

                    if (loadingOverlay) loadingOverlay.style.display = 'none';

                    if (response.status === 404) {
                        showErrorState("پیدا نشد • 404", "تحلیل مشترکی با این مشخصات پیدا نشد، یا هنوز دسترسی معتبری برای ذهن شما صادر نشده است.");
                        return;
                    }

                    if (response.status === 500) {
                        showErrorState("اختلال هسته • 500", "سیستم پردازش متمرکز دچار نوسان شده است. مهندسان ما در حال بازبینی کدهای سرور هستند.");
                        return;
                    }

                    if (!response.ok) throw new Error(`Status: ${response.status}`);

                    let resultText = "";
                    const contentType = response.headers.get("content-type") || "";
                    if (contentType.includes("application/json")) {
                        const data = await response.json();
                        resultText = data.comparison_result;
                    } else {
                        const rawText = await response.text();
                        try { resultText = JSON.parse(rawText).comparison_result || rawText; }
                        catch { resultText = rawText; }
                    }

                    if (!resultText || resultText.trim() === "") {
                        showErrorState("فضای خالی", "تحلیلی انجام شده است، اما دیتایی برای نمایش وجود ندارد.");
                        return;
                    }

                    renderComparisonResultUI(resultText);

                } catch (error) {
                    if (loadingOverlay) loadingOverlay.style.display = 'none';
                    showErrorState("خطای ارتباطی", "سیگنال بین مینی‌اپ و سرور قطع شد یا اینترنت شما دچار نوسان است.");
                }
            }


            function renderComparisonResultUI(resultText) {
                document.getElementById('app').style.display = 'none';
                document.getElementById('intro-screen').style.display = 'none';

                const container = document.getElementById('result-container');
                const slidesWrapper = document.getElementById('slides-wrapper');
                const progressWrapper = document.getElementById('story-progress');
                const navWrapper = document.querySelector('.smart-nav-wrapper');

                slidesWrapper.innerHTML = '';
                progressWrapper.innerHTML = '';
                if (navWrapper) navWrapper.style.display = 'flex';

                let rawContent = resultText || "";
                let sections = rawContent.split(/(?=##\s)/);

                parsedSlides = [];

                if (sections.length > 1) {
                    sections.forEach(section => {
                        section = section.trim();
                        if (!section) return;

                        let lines = section.split('\n');
                        let slideTitle = lines[0].replace('##', '').replace(/<b>|<\/b>/g, '').trim();
                        let slideBody = lines.slice(1).join('\n').trim();

                        parsedSlides.push({
                            title: slideTitle,
                            content: slideBody,

            async function handleCreateTelegramOrder() {
                const btn = document.getElementById('btn-submit-order');
                if (!btn || btn.disabled) return;

                // افکت لودینگ روی دکمه
                const originalText = btn.innerHTML;
                btn.disabled = true;
                btn.style.opacity = '0.7';
                btn.innerHTML = `<span>در حال صدور فاکتور...</span>`;
                const telegramInitData = window.Telegram?.WebApp?.initData || "";

                const orderPayload = {
                    init_data: telegramInitData
                };

                if (!telegramInitData) {
                    alert("خطا: اطلاعات تلگرام دریافت نشد. لطفاً ربات را مجدداً باز کنید.");
                    btn.disabled = false;
                    btn.style.opacity = '1';
                    btn.innerHTML = originalText;
                    return;
                }

                try {
                    const response = await fetch('https://90c2-2a0b-4140-101a-00-2.ngrok-free.app/orders/create-telegram-order', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify(orderPayload)
                    });

                    const data = await response.json();

                    // 🌟 چک کردن پاسخ بک‌اند بر اساس success و message
                    if (response.ok && data.success && data.message === "invoice_sent") {

                        // ویبره موفقیت در تلگرام
                        if (window.Telegram?.WebApp?.HapticFeedback) {
                            window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
                        }

                        // پیام به کاربر
                        alert('فاکتور پرداخت در چت تلگرام برای شما ارسال شد!');

                        // 💡 پیشنهاد UX: بستن وب‌اپ تلگرام تا کاربر مستقیماً فاکتور ارسال‌شده در چت را ببیند
                        if (window.Telegram?.WebApp) {
                            window.Telegram.WebApp.close();
                        }

                    } else {
                        // اگر بک‌اند success را false فرستاده بود یا پیغام دیگری داد
                        throw new Error(data.message || 'خطای غیرمنتظره در صدور فاکتور');
                    }

                } catch (error) {
                    console.error('Error creating order:', error);

                    if (window.Telegram?.WebApp?.HapticFeedback) {
                        window.Telegram.WebApp.HapticFeedback.notificationOccurred('error');
                    }

                    alert('مواجهه با خطا در ثبت درخواست. لطفاً مجدداً تلاش کنید.');

                    // بازگرداندن دکمه به حالت اول فقط در صورت بروز خطا
                    btn.disabled = false;
                    btn.style.opacity = '1';
                    btn.innerHTML = originalText;
                }
            }
