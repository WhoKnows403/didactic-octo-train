<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تحلیل شخصیت MBTI</title>
    <!-- تلگرام وب‌اپ -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- فونت وزیرمتن -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@200;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 🎨 پالت رنگی: لوکس، سنگین */
            --bg-main: #0a0a0a;         
            --bg-card: #141414;         
            --border-color: #333333;    
            --text-primary: #e0e0e0;    
            --text-secondary: #888888;  
            --text-gold: #c5a059;       
            --lamp-glow: rgba(197, 160, 89, 0.15);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html {
            font-family: 'Vazirmatn', sans-serif;
            background-color: var(--bg-main);
            /* بافت محو پس زمینه برای عمق دادن */
            background-image: 
                radial-gradient(circle at 50% 0%, #1a1a1a 0%, #050505 80%),
                url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23222' fill-opacity='0.15'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            color: var(--text-primary);
            margin: 0; padding: 0; 
            width: 100%; height: 100%;
            overflow: hidden; 
            overscroll-behavior: none; 
            position: fixed; 
            user-select: none;
        }

        /* 💡 کانتینر لامپ آویز */
        .lamp-container {
            position: fixed;
            top: -20px;
            left: 50%;
            transform-origin: top center;
            z-index: 10;
            animation: swing 6s ease-in-out infinite alternate;
            pointer-events: none;
        }

        /* سیم لامپ */
        .lamp-wire {
            width: 2px;
            height: 100px;
            background: #222;
            margin: 0 auto;
        }

        /* حباب لامپ (با CSS ساخته شده) */
        .lamp-bulb {
            width: 40px;
            height: 60px;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8), rgba(255, 200, 100, 0.4));
            border-radius: 50% 50% 40% 40%;
            margin: 0 auto;
            position: relative;
            box-shadow: 
                0 0 20px 5px rgba(255, 180, 60, 0.2), /* درخشش دور */
                0 0 60px 20px rgba(197, 160, 89, 0.1); /* نور محیطی */
        }
        
        /* رشته تنگستن داخل لامپ */
        .lamp-bulb::after {
            content: '';
            position: absolute;
            top: 15px; left: 10px; right: 10px; height: 20px;
            border: 1px solid rgba(255, 200, 0, 0.5);
            border-bottom: none;
            border-radius: 20px 20px 0 0;
            opacity: 0.7;
        }

        /* انیمیشن تاب خوردن لامپ */
        @keyframes swing {
            from { transform: translateX(-50%) rotate(2deg); }
            to { transform: translateX(-50%) rotate(-2deg); }
        }

        /* ✨ ذرات معلق (Dust Particles) */
        .dust-particle {
            position: fixed;
            background: rgba(197, 160, 89, 0.4);
            border-radius: 50%;
            pointer-events: none;
            animation: float-dust linear infinite;
        }
        /* تولید رندوم ذرات با CSS */
        .dust-1 { width: 2px; height: 2px; top: 20%; left: 10%; animation-duration: 15s; }
        .dust-2 { width: 3px; height: 3px; top: 40%; left: 80%; animation-duration: 25s; opacity: 0.3; }
        .dust-3 { width: 1px; height: 1px; top: 70%; left: 30%; animation-duration: 10s; }
        
        @keyframes float-dust {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            50% { opacity: 0.5; }
            100% { transform: translateY(-50px) translateX(20px); opacity: 0; }
        }


        /* ⛔ صفحه خطا */
        #access-denied {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-main); z-index: 10000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            display: none; 
        }

        /* 🚀 صفحه شروع */
        #intro-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-main); z-index: 500;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            padding: 30px; text-align: center;
            transition: opacity 0.8s ease-out;
        }
        
        .intro-visual { 
            font-size: 50px; margin-bottom: 20px; 
            filter: grayscale(100%) opacity(0.8);
            animation: pulse-slow 4s infinite;
        }
        
        .intro-h1 { 
            font-size: 26px; font-weight: 200; margin-bottom: 15px; 
            color: var(--text-gold); letter-spacing: 2px;
            text-transform: uppercase;
        }
        
        .intro-p { 
            color: var(--text-secondary); font-size: 14px; line-height: 1.8; 
            margin-bottom: 50px; max-width: 280px; font-weight: 300;
        }

        .btn-start {
            background: transparent;
            color: var(--text-gold);
            border: 1px solid rgba(197, 160, 89, 0.3);
            padding: 14px 40px;
            font-size: 15px; font-weight: 400; 
            border-radius: 4px; /* دکمه‌های گوشه‌دار جدی‌ترن */
            font-family: 'Vazirmatn'; cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
        }
        .btn-start:active { background: var(--lamp-glow); border-color: var(--text-gold); }

        /* 📱 کانتینر اصلی */
        .app-layout {
            width: 100%; max-width: 500px; margin: 0 auto; height: 100%;
            display: none; flex-direction: column; padding: 20px 30px;
            opacity: 0; transform: translateY(10px); 
            transition: opacity 0.8s, transform 0.8s;
            position: relative; z-index: 2;
        }

        .progress-container {
            width: 100%; display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 30px; margin-top: 50px; /* فاصله از لامپ */
        }
        .q-counter { color: #555; font-size: 11px; font-weight: 400; letter-spacing: 1px; }
        
        .progress-track {
            flex-grow: 1; height: 1px; background: #222;
            margin-right: 15px; position: relative;
        }
        .progress-glow {
            height: 100%; background: var(--text-gold);
            width: 0%; transition: width 0.5s ease;
            box-shadow: 0 0 5px var(--text-gold);
        }

        .card-stage { 
            flex-grow: 1; position: relative; perspective: 1000px; 
            display: flex; align-items: center; justify-content: center; 
        }
        
        .stone-card {
            background: linear-gradient(145deg, #1a1a1a, #111);
            border: 1px solid #222;
            border-top: 1px solid #333; /* نور لبه بالا */
            padding: 40px 25px; 
            border-radius: 2px; /* گوشه‌های تیز برای حس سنگ */
            width: 100%; min-height: 220px;
            display: flex; flex-direction: column; align-items: center; text-align: center; justify-content: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8); /* سایه عمیق */
            position: absolute; opacity: 1; 
        }
        
        /* تکسچر نویز روی کارت برای حس کاغذ قدیمی/سنگ */
        .stone-card::before {
            content: ""; position: absolute; top:0; left:0; width:100%; height:100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.03'/%3E%3C/svg%3E");
            opacity: 0.5; pointer-events: none;
        }

        .q-text-content { 
            font-size: 19px; font-weight: 300; line-height: 1.8; color: #ddd;
            z-index: 2;
        }

        .interaction-area { margin-bottom: 50px; width: 100%; }
        .labels-row { 
            display: flex; justify-content: space-between; 
            color: #444; font-size: 11px; margin-bottom: 20px; padding: 0 5px; 
        }
        
        .options-grid {
            display: flex; justify-content: space-between; align-items: center;
            position: relative;
        }
        .options-grid::before {
            content: ''; position: absolute; left: 10px; right: 10px; top: 50%; height: 1px;
            background: #222; z-index: 0;
        }

        .circle-btn {
            background: #0f0f0f;
            border: 1px solid #333;
            border-radius: 50%; 
            cursor: pointer; z-index: 1;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: transparent; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        
        .circle-btn[data-val="1"] { width: 30px; height: 30px; }
        .circle-btn[data-val="2"] { width: 40px; height: 40px; }
        .circle-btn[data-val="3"] { width: 50px; height: 50px; border-color: #444; }
        .circle-btn[data-val="4"] { width: 60px; height: 60px; }
        .circle-btn[data-val="5"] { width: 70px; height: 70px; border-color: var(--text-gold); background: rgba(197, 160, 89, 0.05); }

        .circle-btn:active { 
            background: var(--text-gold); 
            border-color: var(--text-gold);
            transform: scale(0.95);
            box-shadow: 0 0 15px var(--text-gold);
        }

        /* ✨ انیمیشن‌ها */
        .fade-out {
            animation: fadeOutBlur 0.5s forwards;
        }
        .fade-in {
            animation: fadeInBlur 0.5s forwards;
        }

        @keyframes fadeOutBlur {
            to { opacity: 0; transform: scale(0.9); filter: blur(4px); }
        }
        @keyframes fadeInBlur {
            from { opacity: 0; transform: scale(1.1); filter: blur(4px); }
            to { opacity: 1; transform: scale(1); filter: blur(0); }
        }

        @keyframes pulse-slow { 
            0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } 
        }

        /* لایه لودینگ */
        #loading-overlay {
            backdrop-filter: blur(20px); 
            background: rgba(10, 10, 10, 0.9);
        }
        .brain-loader {
            font-size: 50px; 
            filter: grayscale(100%) drop-shadow(0 0 15px var(--text-gold)); 
            animation: pulse-slow 2s infinite;
        }
        
        .loading-bar-container {
            width: 140px; height: 2px; background: #222; 
            margin-top: 20px; overflow: hidden; position: relative;
        }
        .loading-bar-fill {
            position: absolute; top: 0; left: 0; bottom: 0; background: var(--text-gold);
            width: 50%;
            animation: indeterminate 1.5s infinite ease-in-out;
            box-shadow: 0 0 8px var(--text-gold);
        }
        @keyframes indeterminate {
            0% { left: -50%; width: 30%; }
            50% { left: 20%; width: 80%; }
            100% { left: 100%; width: 30%; }
        }

    </style>
</head>
<body>
    
    <!-- 💡 لامپ ادیسونی آویز (Micro-Interaction) -->
    <div class="lamp-container">
        <div class="lamp-wire"></div>
        <div class="lamp-bulb"></div>
    </div>

    <!-- ✨ ذرات غبار معلق -->
    <div class="dust-particle dust-1"></div>
    <div class="dust-particle dust-2"></div>
    <div class="dust-particle dust-3"></div>

    <div id="access-denied">
        <h2 style="color: var(--text-gold);">Access Denied</h2>
    </div>

    <div id="intro-screen">
        <div class="intro-visual">🗝️</div>
        <h1 class="intro-h1">ARCHETYPE</h1>
        <p class="intro-p" id="intro-desc">Loading modules...</p>
        <button class="btn-start" id="btn-start" onclick="startApp()" disabled>INITIALIZING</button>
    </div>

    <div class="app-layout" id="app">
        <div class="progress-container">
            <div class="progress-track">
                <div class="progress-glow" id="progress"></div>
            </div>
            <div class="q-counter" id="q-num">1 / 60</div>
        </div>
        
        <div class="card-stage">
            <div class="stone-card" id="card">
                <div class="q-text-content" id="q-text">...</div>
            </div>
        </div>

        <div class="interaction-area" id="interaction-area">
            <div class="labels-row">
                <span>Disagree</span>
                <span>Agree</span>
            </div>
            <div class="options-grid">
                <button class="circle-btn" data-val="1" onclick="handleAnswer(1)"></button>
                <button class="circle-btn" data-val="2" onclick="handleAnswer(2)"></button>
                <button class="circle-btn" data-val="3" onclick="handleAnswer(3)"></button>
                <button class="circle-btn" data-val="4" onclick="handleAnswer(4)"></button>
                <button class="circle-btn" data-val="5" onclick="handleAnswer(5)"></button>
            </div>
        </div>
    </div>

    <div id="loading-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2000; flex-direction: column; align-items: center; justify-content: center; text-align: center;">
        <div class="brain-loader">🧠</div>
        <h3 style="margin-top: 30px; color: var(--text-gold); font-weight: 300; letter-spacing: 2px; font-size: 16px;">ANALYZING</h3>
        <p style="color: var(--text-secondary); font-size: 12px; margin-top: 5px;">Mapping neural pathways...</p>
        <div class="loading-bar-container">
            <div class="loading-bar-fill"></div>
        </div>
    </div>

    <script>
        // ✅ لاجیک جاوااسکریپت بدون تغییر و کاملاً سالم
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        tg.disableVerticalSwipes();
        
        if(tg.setHeaderColor) tg.setHeaderColor('#0a0a0a');
        if(tg.setBackgroundColor) tg.setBackgroundColor('#0a0a0a');
        
        const isTelegram = (tg.initData && tg.initData.length > 0) || (tg.platform && tg.platform !== 'unknown');
        
        let questionsDB = []; 
        let currentIndex = 0;
        let userAnswers = {};

        const app = document.getElementById('app');
        const intro = document.getElementById('intro-screen');
        const card = document.getElementById('card');
        const qText = document.getElementById('q-text');
        const qNum = document.getElementById('q-num');
        const progress = document.getElementById('progress');
        const btnStart = document.getElementById('btn-start');
        const introDesc = document.getElementById('intro-desc');

        async function fetchQuestions() {
            try {
                const res = await fetch('questions.json?v=' + new Date().getTime());
                if (!res.ok) throw new Error("Network error");
                questionsDB = await res.json();
                
                btnStart.removeAttribute('disabled');
                btnStart.innerText = "ورود به ناخودآگاه"; // فارسی
                introDesc.innerHTML = `${questionsDB.length} ایستگاه برای شناخت عمیق`;
                
                loadSavedAnswers();
            } catch (e) {
                console.error(e);
                btnStart.innerText = "خطا در ارتباط";
                introDesc.innerText = "امکان بارگذاری وجود ندارد.";
            }
        }

        function loadSavedAnswers() {
            try {
                const saved = localStorage.getItem('user_answers_v1');
                const savedIndex = localStorage.getItem('current_index_v1');
                const isSent = localStorage.getItem('data_sent_flag');
                
                if (saved && savedIndex && !isSent) {
                    userAnswers = JSON.parse(saved);
                    currentIndex = parseInt(savedIndex);
                    
                    if (currentIndex >= questionsDB.length) {
                        currentIndex = 0; userAnswers = {};
                    } else if (currentIndex > 0) {
                        btnStart.innerText = "ادامه مسیر قبلی";
                    }
                }
            } catch (e) { console.error(e); }
        }

        function saveProgress() {
            localStorage.setItem('user_answers_v1', JSON.stringify(userAnswers));
            localStorage.setItem('current_index_v1', currentIndex);
        }

        function startApp() {
            document.getElementById('access-denied').style.display = 'none';
            intro.style.display = 'none';
            app.style.display = 'flex';
            
            if (tg.BackButton) {
                tg.BackButton.show();
                tg.BackButton.onClick(() => {
                    tg.showPopup({
                        title: 'توقف مسیر؟',
                        message: 'پیشرفت شما محفوظ می‌ماند.',
                        buttons: [
                            {id: 'yes', type: 'destructive', text: 'خروج'},
                            {id: 'no', type: 'cancel', text: 'ادامه'}
                        ]
                    }, (btnId) => {
                        if (btnId === 'yes') tg.close();
                    });
                });
            }
            
            setTimeout(() => {
                app.style.opacity = '1';
                app.style.transform = 'translateY(0)';
                renderQuestion(false);
            }, 100);
        }

        let isAnimating = false;
        function renderQuestion(animate = true) {
            if (currentIndex >= questionsDB.length) {
                finishQuiz();
                return;
            }
            const q = questionsDB[currentIndex];
            const percent = ((currentIndex) / questionsDB.length) * 100;
            
            qNum.innerText = `${currentIndex + 1} / ${questionsDB.length}`;
            qText.innerText = q.text;
            progress.style.width = percent + '%';
            
            if (animate) {
                card.classList.remove('fade-out');
                card.classList.add('fade-in');
                setTimeout(() => card.classList.remove('fade-in'), 400);
            }
        }

        window.handleAnswer = function(score) {
            if (isAnimating) return;
            isAnimating = true;
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light'); 
            
            const currentQ = questionsDB[currentIndex];
            userAnswers[currentQ.key] = score;
            currentIndex++;
            saveProgress();
            
            card.classList.add('fade-out');
            
            setTimeout(() => {
                if (currentIndex >= questionsDB.length) {
                    finishQuiz();
                } else {
                    renderQuestion(true);
                    isAnimating = false;
                }
            }, 400); 
        };

        function finishQuiz() {
            progress.style.width = '100%';
            qNum.innerText = '';
            document.getElementById('interaction-area').style.display = 'none';
            if(tg.BackButton) tg.BackButton.hide();
            
            card.classList.remove('fade-out');
            card.innerHTML = `
                <div style="font-size:60px; margin-bottom:20px; filter: grayscale(1);">✨</div>
                <h3 style="margin:10px 0 10px 0; color:var(--text-gold); font-weight:300;">پایان سفر</h3>
                <p style="font-size:14px; color:var(--text-secondary); margin-bottom:30px;">الگوهای شما ثبت شد.</p>
            `;
            
            tg.MainButton.text = "دریافت تحلیل نهایی";
            tg.MainButton.color = "#c5a059"; 
            tg.MainButton.textColor = "#000000"; 
            tg.MainButton.show();
            tg.MainButton.onClick(sendDataSecure);
        }

        let isSubmitting = false; 

        async function sendDataSecure() {
            if (isSubmitting) return; 
            
            const initDataRaw = window.Telegram.WebApp.initData;
            if (!initDataRaw) {
                alert("خطا: احراز هویت انجام نشد.");
                return;
            }

            isSubmitting = true;
            document.getElementById('loading-overlay').style.display = 'flex';
            tg.MainButton.showProgress(true); 
            tg.MainButton.disable();

            const payload = {
                init_data: initDataRaw,
                answers: userAnswers,
                timestamp: Math.floor(Date.now() / 1000)
            };

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 30000);

                const response = await fetch('https://self-production-1573.up.railway.app/receive-data', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);

                if (response.ok) {
                    tg.close();
                } else {
                    if (response.status === 429) {
                        alert("⏳ درخواست شما قبلا ثبت شده است. لطفاً ربات را چک کنید یا بعداً تلاش نمایید.");
                    } else {
                        const err = await response.text();
                        alert("خطا: " + err);
                    }
                    resetButtonState();
                }
            } catch (error) {
                if (error.name === 'AbortError') {
                     alert("ارتباط با سرور زمان‌بر شد. لطفاً ربات را چک کنید، احتمالاً درخواست شما ثبت شده است.");
                } else {
                     alert("خطای شبکه: " + error.message);
                }
                resetButtonState();
            }
        }

        function resetButtonState() {
            isSubmitting = false;
            document.getElementById('loading-overlay').style.display = 'none';
            tg.MainButton.hideProgress();
            tg.MainButton.enable();
        }

        window.onload = function() {
            const isDebug = false; 
            if (isTelegram || isDebug) {
                document.getElementById('access-denied').style.display = 'none';
                intro.style.display = 'flex';
                fetchQuestions();
            } else {
                document.getElementById('access-denied').style.display = 'flex';
                intro.style.display = 'none';
            }
        };
    </script>
</body>
</html>
