<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تحلیل شخصیت MBTI</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@200;300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 🎨 پالت رنگی: تاریک، مات، طلایی */
            --bg-main: #0a0a0a;         
            --bg-card: #141414;         
            --border-color: #2a2a2a;    
            --text-primary: #d0d0d0;    
            --text-secondary: #777777;  
            --text-gold: #c5a059;       
            
            /* رنگ دکمه‌ها (طیف ملایم) */
            --btn-disagree: #3a2a2a; /* قرمز/قهوه‌ای خیلی تیره */
            --btn-neutral: #2a2a2a;  /* خاکستری */
            --btn-agree: #3a352a;    /* طلایی/زیتونی خیلی تیره */
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html {
            font-family: 'Vazirmatn', sans-serif;
            background-color: var(--bg-main);
            /* پترن نویز خیلی محو برای بافت */
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
            color: var(--text-primary);
            margin: 0; padding: 0; 
            width: 100%; height: 100%;
            overflow: hidden; 
            overscroll-behavior: none; 
            position: fixed; 
            user-select: none;
        }

        /* 💡 کانتینر لامپ آویز */
        .lamp-container {
            position: fixed; top: -10px; left: 50%;
            transform: translateX(-50%); z-index: 10;
            animation: swing 8s ease-in-out infinite alternate;
            pointer-events: none;
            display: flex; flex-direction: column; align-items: center;
        }
        .lamp-wire {
            width: 1px; height: 80px; background: #222;
        }
        .lamp-bulb-svg {
            width: 50px; height: 70px;
            filter: drop-shadow(0 0 15px rgba(255, 200, 100, 0.3));
        }
        @keyframes swing {
            from { transform: translateX(-50%) rotate(1.5deg); }
            to { transform: translateX(-50%) rotate(-1.5deg); }
        }

        /* ✨ ذرات معلق */
        .dust-particle {
            position: fixed; background: rgba(197, 160, 89, 0.3);
            border-radius: 50%; pointer-events: none;
            animation: float-dust linear infinite;
        }
        .dust-1 { width: 2px; height: 2px; top: 30%; left: 20%; animation-duration: 20s; }
        .dust-2 { width: 1px; height: 1px; top: 60%; left: 80%; animation-duration: 30s; opacity: 0.4; }
        .dust-3 { width: 1.5px; height: 1.5px; top: 80%; left: 40%; animation-duration: 25s; }
        
        @keyframes float-dust {
            0% { transform: translateY(0); opacity: 0; }
            50% { opacity: 0.6; }
            100% { transform: translateY(-40px); opacity: 0; }
        }

        /* 🚀 صفحات */
        #access-denied, #intro-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-main); z-index: 500;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            padding: 30px; text-align: center;
        }
        
        .intro-visual { 
            font-size: 50px; margin-bottom: 20px; 
            filter: grayscale(100%) opacity(0.8);
            animation: breathe 4s infinite;
        }
        .intro-h1 { 
            font-size: 24px; font-weight: 300; margin-bottom: 10px; 
            color: var(--text-gold); letter-spacing: 1px;
        }
        .intro-p { 
            color: var(--text-secondary); font-size: 14px; margin-bottom: 40px; 
            max-width: 280px; font-weight: 300; line-height: 1.8;
        }
        .btn-start {
            background: transparent; color: var(--text-gold);
            border: 1px solid rgba(197, 160, 89, 0.3);
            padding: 12px 40px; font-size: 14px; border-radius: 4px;
            font-family: 'Vazirmatn'; cursor: pointer; transition: all 0.3s;
        }
        .btn-start:active { background: rgba(197, 160, 89, 0.1); border-color: var(--text-gold); }

        /* 📱 کانتینر اصلی */
        .app-layout {
            width: 100%; max-width: 500px; margin: 0 auto; height: 100%;
            display: none; flex-direction: column; padding: 20px 25px;
            opacity: 0; transform: translateY(10px); transition: opacity 0.8s;
            position: relative; z-index: 2;
        }

        .progress-container {
            width: 100%; display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 25px; margin-top: 60px; /* فضای برای لامپ */
        }
        .q-counter { color: #444; font-size: 12px; }
        .progress-track {
            flex-grow: 1; height: 1px; background: #222;
            margin-right: 15px; position: relative;
        }
        .progress-glow {
            height: 100%; background: var(--text-gold); width: 0%; 
            transition: width 0.5s ease; box-shadow: 0 0 5px var(--text-gold);
        }

        /* 🎴 کارت سوال */
        .card-stage { 
            flex-grow: 1; position: relative; display: flex; 
            align-items: center; justify-content: center; 
        }
        .stone-card {
            background: linear-gradient(160deg, #181818, #101010);
            border: 1px solid var(--border-color);
            border-top: 1px solid #333; 
            padding: 30px 20px; border-radius: 2px; width: 100%; min-height: 200px;
            display: flex; flex-direction: column; align-items: center; 
            text-align: center; justify-content: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.7);
            position: absolute; opacity: 1; 
        }
        .q-text-content { 
            font-size: 18px; font-weight: 300; line-height: 1.8; color: #ddd;
        }

        /* 🔘 دکمه‌ها و تعامل */
        .interaction-area { margin-bottom: 40px; width: 100%; }
        .labels-row { 
            display: flex; justify-content: space-between; 
            color: #555; font-size: 11px; margin-bottom: 15px; padding: 0 5px; 
        }
        .options-grid {
            display: flex; justify-content: space-between; align-items: center;
            position: relative;
        }
        .options-grid::before {
            content: ''; position: absolute; left: 10px; right: 10px; top: 50%; height: 1px;
            background: #1a1a1a; z-index: 0;
        }

        .circle-btn {
            border: 1px solid #333; border-radius: 50%; 
            cursor: pointer; z-index: 1; position: relative;
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
            color: transparent; display: flex; justify-content: center; align-items: center;
        }
        
        /* اعداد راهنما داخل دکمه (بسیار محو) */
        .circle-btn::after {
            content: attr(data-val); color: #fff; opacity: 0; font-size: 10px; font-weight: 200;
        }
        
        /* طیف رنگی دکمه‌ها */
        .circle-btn[data-val="1"] { width: 32px; height: 32px; background: var(--btn-disagree); border-color: #332222; }
        .circle-btn[data-val="2"] { width: 40px; height: 40px; background: var(--btn-disagree); opacity: 0.8; }
        .circle-btn[data-val="3"] { width: 48px; height: 48px; background: var(--btn-neutral); border-color: #333; }
        .circle-btn[data-val="4"] { width: 56px; height: 56px; background: var(--btn-agree); opacity: 0.8; }
        .circle-btn[data-val="5"] { width: 64px; height: 64px; background: var(--btn-agree); border-color: #554a33; box-shadow: 0 0 10px rgba(197, 160, 89, 0.1); }

        .circle-btn:active { transform: scale(0.9); border-color: var(--text-gold); }

        /* ✨ انیمیشن جدید: Cross Dissolve (بدون حرکت) */
        .fade-out { animation: dissolveOut 0.4s forwards; }
        .fade-in { animation: dissolveIn 0.4s forwards; }

        @keyframes dissolveOut {
            to { opacity: 0; transform: scale(0.98); }
        }
        @keyframes dissolveIn {
            from { opacity: 0; transform: scale(1.02); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes breathe { 
            0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } 
        }

        /* 🧠 لایه لودینگ */
        #loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 2000;
            background: rgba(10, 10, 10, 0.95); backdrop-filter: blur(10px);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center;
        }
        .brain-loader {
            font-size: 40px; filter: grayscale(100%) drop-shadow(0 0 10px var(--text-gold)); 
            animation: breathe 2s infinite;
        }
        .loading-bar-container {
            width: 120px; height: 2px; background: #222; 
            margin-top: 20px; overflow: hidden; position: relative;
        }
        .loading-bar-fill {
            position: absolute; top: 0; left: 0; bottom: 0; background: var(--text-gold);
            width: 50%; animation: indeterminate 1.5s infinite ease-in-out;
        }
        @keyframes indeterminate {
            0% { left: -50%; width: 30%; } 50% { left: 20%; width: 80%; } 100% { left: 100%; width: 30%; }
        }
    </style>
</head>
<body>
    
    <!-- 💡 لامپ ادیسونی آویز (SVG Inline) -->
    <div class="lamp-container">
        <div class="lamp-wire"></div>
        <svg class="lamp-bulb-svg" viewBox="0 0 50 70" xmlns="http://www.w3.org/2000/svg">
            <!-- حباب -->
            <path d="M10 20 C 10 0, 40 0, 40 20 C 40 40, 30 50, 30 60 L 20 60 C 20 50, 10 40, 10 20 Z" 
                  fill="url(#bulbGradient)" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
            <!-- رشته فیلامنت -->
            <path d="M22 25 Q 25 10, 28 25" stroke="#ffaa00" stroke-width="1" fill="none" opacity="0.8"/>
            <defs>
                <radialGradient id="bulbGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
                    <stop offset="0%" style="stop-color:rgba(255, 230, 150, 0.4); stop-opacity:1" />
                    <stop offset="100%" style="stop-color:rgba(255, 200, 50, 0.05); stop-opacity:1" />
                </radialGradient>
            </defs>
        </svg>
    </div>

    <div class="dust-particle dust-1"></div>
    <div class="dust-particle dust-2"></div>
    <div class="dust-particle dust-3"></div>

    <div id="access-denied">
        <h2 style="color: var(--text-gold); font-weight: 300;">دسترسی غیرمجاز</h2>
    </div>

    <div id="intro-screen">
        <div class="intro-visual">🗝️</div>
        <h1 class="intro-h1">کاوشگرِ درون</h1>
        <p class="intro-p" id="intro-desc">در حال بارگذاری...</p>
        <button class="btn-start" id="btn-start" onclick="startApp()" disabled>L O A D I N G</button>
    </div>

    <div class="app-layout" id="app">
        <div class="progress-container">
            <div class="progress-track">
                <div class="progress-glow" id="progress"></div>
            </div>
            <div class="q-counter" id="q-num">1 / 60</div>
        </div>
        
        <div class="card-stage">
            <div class="stone-card" id="card">
                <div class="q-text-content" id="q-text">...</div>
            </div>
        </div>

        <div class="interaction-area" id="interaction-area">
            <div class="labels-row">
                <span>مخالفم</span>
                <span>موافقم</span>
            </div>
            <div class="options-grid">
                <button class="circle-btn" data-val="1" onclick="handleAnswer(1)"></button>
                <button class="circle-btn" data-val="2" onclick="handleAnswer(2)"></button>
                <button class="circle-btn" data-val="3" onclick="handleAnswer(3)"></button>
                <button class="circle-btn" data-val="4" onclick="handleAnswer(4)"></button>
                <button class="circle-btn" data-val="5" onclick="handleAnswer(5)"></button>
            </div>
        </div>
    </div>

    <div id="loading-overlay" style="display: none;">
        <div class="brain-loader">🧠</div>
        <h3 style="margin-top: 25px; color: var(--text-gold); font-weight: 300; letter-spacing: 1px; font-size: 16px;">تـحـلـیـل داده‌هـا</h3>
        <p style="color: var(--text-secondary); font-size: 12px; margin-top: 5px;">در حال ترسیم نقشه‌ی ذهن...</p>
        <div class="loading-bar-container">
            <div class="loading-bar-fill"></div>
        </div>
    </div>

    <script>
        // ✅ لاجیک اصلی (دست نخورده)
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand(); tg.disableVerticalSwipes();
        if(tg.setHeaderColor) tg.setHeaderColor('#0a0a0a');
        if(tg.setBackgroundColor) tg.setBackgroundColor('#0a0a0a');
        
        const isTelegram = (tg.initData && tg.initData.length > 0) || (tg.platform && tg.platform !== 'unknown');
        
        let questionsDB = []; let currentIndex = 0; let userAnswers = {};
        const app = document.getElementById('app');
        const intro = document.getElementById('intro-screen');
        const card = document.getElementById('card');
        const qText = document.getElementById('q-text');
        const qNum = document.getElementById('q-num');
        const progress = document.getElementById('progress');
        const btnStart = document.getElementById('btn-start');
        const introDesc = document.getElementById('intro-desc');

        async function fetchQuestions() {
            try {
                const res = await fetch('questions.json?v=' + new Date().getTime());
                if (!res.ok) throw new Error("Network error");
                questionsDB = await res.json();
                btnStart.removeAttribute('disabled');
                btnStart.innerText = "ورود به ناخودآگاه"; 
                introDesc.innerHTML = `${questionsDB.length} ایستگاه برای شناخت عمیق`;
                loadSavedAnswers();
            } catch (e) {
                console.error(e);
                btnStart.innerText = "خطا در ارتباط";
                introDesc.innerText = "امکان بارگذاری وجود ندارد.";
            }
        }

        function loadSavedAnswers() {
            try {
                const saved = localStorage.getItem('user_answers_v1');
                const savedIndex = localStorage.getItem('current_index_v1');
                const isSent = localStorage.getItem('data_sent_flag');
                if (saved && savedIndex && !isSent) {
                    userAnswers = JSON.parse(saved);
                    currentIndex = parseInt(savedIndex);
                    if (currentIndex >= questionsDB.length) { currentIndex = 0; userAnswers = {}; }
                    else if (currentIndex > 0) { btnStart.innerText = "ادامه مسیر قبلی"; }
                }
            } catch (e) { console.error(e); }
        }

        function saveProgress() {
            localStorage.setItem('user_answers_v1', JSON.stringify(userAnswers));
            localStorage.setItem('current_index_v1', currentIndex);
        }

        function startApp() {
            document.getElementById('access-denied').style.display = 'none';
            intro.style.display = 'none';
            app.style.display = 'flex';
            if (tg.BackButton) {
                tg.BackButton.show();
                tg.BackButton.onClick(() => {
                    tg.showPopup({
                        title: 'توقف مسیر؟', message: 'پیشرفت شما محفوظ می‌ماند.',
                        buttons: [{id: 'yes', type: 'destructive', text: 'خروج'}, {id: 'no', type: 'cancel', text: 'ادامه'}]
                    }, (btnId) => { if (btnId === 'yes') tg.close(); });
                });
            }
            setTimeout(() => {
                app.style.opacity = '1'; app.style.transform = 'translateY(0)';
                renderQuestion(false);
            }, 100);
        }

        let isAnimating = false;
        function renderQuestion(animate = true) {
            if (currentIndex >= questionsDB.length) { finishQuiz(); return; }
            const q = questionsDB[currentIndex];
            const percent = ((currentIndex) / questionsDB.length) * 100;
            qNum.innerText = `${currentIndex + 1} / ${questionsDB.length}`;
            qText.innerText = q.text;
            progress.style.width = percent + '%';
            if (animate) {
                // انیمیشن Fade بدون حرکت
                card.classList.remove('fade-out');
                card.classList.add('fade-in');
                setTimeout(() => card.classList.remove('fade-in'), 400);
            }
        }

        window.handleAnswer = function(score) {
            if (isAnimating) return;
            isAnimating = true;
            if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light'); 
            const currentQ = questionsDB[currentIndex];
            userAnswers[currentQ.key] = score;
            currentIndex++;
            saveProgress();
            
            // انیمیشن خروج Fade بدون حرکت
            card.classList.add('fade-out');
            setTimeout(() => {
                if (currentIndex >= questionsDB.length) { finishQuiz(); }
                else { renderQuestion(true); isAnimating = false; }
            }, 400); 
        };

        function finishQuiz() {
            progress.style.width = '100%'; qNum.innerText = '';
            document.getElementById('interaction-area').style.display = 'none';
            if(tg.BackButton) tg.BackButton.hide();
            card.classList.remove('fade-out');
            card.innerHTML = `
                <div style="font-size:60px; margin-bottom:20px; filter: grayscale(1);">✨</div>
                <h3 style="margin:10px 0 10px 0; color:var(--text-gold); font-weight:300;">پایان سفر</h3>
                <p style="font-size:14px; color:var(--text-secondary); margin-bottom:30px;">الگوهای شما ثبت شد.</p>
            `;
            tg.MainButton.text = "دریافت تحلیل نهایی";
            tg.MainButton.color = "#c5a059"; tg.MainButton.textColor = "#000000"; 
            tg.MainButton.show();
            tg.MainButton.onClick(sendDataSecure);
        }

        let isSubmitting = false; 
        async function sendDataSecure() {
            if (isSubmitting) return; 
            const initDataRaw = window.Telegram.WebApp.initData;
            if (!initDataRaw) { alert("خطا: احراز هویت انجام نشد."); return; }
            isSubmitting = true;
            document.getElementById('loading-overlay').style.display = 'flex';
            tg.MainButton.showProgress(true); tg.MainButton.disable();
            const payload = { init_data: initDataRaw, answers: userAnswers, timestamp: Math.floor(Date.now() / 1000) };
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 30000);
                const response = await fetch('https://self-production-1573.up.railway.app/receive-data', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload), signal: controller.signal
                });
                clearTimeout(timeoutId);
                if (response.ok) { tg.close(); }
                else {
                    if (response.status === 429) { alert("⏳ درخواست شما قبلا ثبت شده است. لطفاً ربات را چک کنید."); }
                    else { const err = await response.text(); alert("خطا: " + err); }
                    resetButtonState();
                }
            } catch (error) {
                if (error.name === 'AbortError') { alert("ارتباط با سرور زمان‌بر شد. لطفاً ربات را چک کنید."); }
                else { alert("خطای شبکه: " + error.message); }
                resetButtonState();
            }
        }
        function resetButtonState() {
            isSubmitting = false;
            document.getElementById('loading-overlay').style.display = 'none';
            tg.MainButton.hideProgress(); tg.MainButton.enable();
        }
        window.onload = function() {
            const isDebug = false; 
            if (isTelegram || isDebug) {
                document.getElementById('access-denied').style.display = 'none';
                intro.style.display = 'flex'; fetchQuestions();
            } else {
                document.getElementById('access-denied').style.display = 'flex';
                intro.style.display = 'none';
            }
        };
    </script>
</body>
</html>
